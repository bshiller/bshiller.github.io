<!doctype html>

<head>

<title>Rung Rank: Paper One</title>
<style>
:root{
  --navy:#1B2A4A; --navy2:#2B3D63; --gold:#C9A227; --gold-l:#FBF3DA; --teal:#1C7C7D; --teal-l:#E3F2F1;

  --ok:#1E8E5A; --ok-l:#E4F5EC; --warn:#B7791F; --warn-l:#FFF5DE; --bad:#C0392B; --bad-l:#FBE9E7;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top .brand{font-weight:700;font-size:20px;letter-spacing:.3px}
header.top .codebadge{font-size:14px;opacity:.9}
header.top .codebadge b{font-size:18px;letter-spacing:2px;color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.narrow{max-width:560px;margin-left:auto;margin-right:auto}
h1{font-size:26px;margin:0 0 6px;color:var(--navy)}
h2{font-size:19px;margin:0 0 10px;color:var(--navy)}
h3{font-size:16px;margin:0 0 6px;color:var(--navy)}
h4{font-size:14px;margin:14px 0 6px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
label small{display:block;font-weight:400;color:var(--muted)}
input[type=text],select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid #C9CED8;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:200px;resize:vertical;font-size:14px}
textarea.short{min-height:72px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
.btn{font:inherit;font-weight:600;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:9px 16px;cursor:pointer}
.btn:hover{background:#EEF1F6}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#166667}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.link{background:none;border:0;color:var(--teal);cursor:pointer;font:inherit;font-size:13px;padding:0;text-decoration:underline}
.link.danger{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{margin-top:10px;font-size:14px;min-height:1px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
.banner{background:var(--bad-l);color:var(--bad);border-bottom:1px solid #f0c4bf;padding:10px 20px;font-size:14px}
.demo-bar{background:var(--warn-l);border-bottom:1px solid #f1d9a0;padding:8px 20px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;margin:2px 4px 2px 0;white-space:nowrap}
.chip.ok{background:var(--ok-l);color:var(--ok)}
.chip.miss{background:#F1F2F5;color:#98A2B3}
.chip.teal{background:var(--teal-l);color:var(--teal)}
.chip.warn{background:var(--warn-l);color:#7a5413}
.chip.bad{background:var(--bad-l);color:var(--bad)}
.live{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-l);border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:6px;text-transform:uppercase;letter-spacing:.5px}
details{margin:6px 0 0;border:1px solid var(--line);border-radius:8px;background:#FAFBFC}
details>summary{cursor:pointer;padding:7px 10px;font-size:14px;font-weight:600}
details .out{padding:0 12px 10px;white-space:pre-wrap;font-size:14px;max-height:340px;overflow:auto}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--navy);color:#fff;border:0}
.hero h2{color:#fff}
.hero .bigcode{font-size:44px;font-weight:800;letter-spacing:6px;color:var(--gold);line-height:1}
.hero .url{font-size:15px;opacity:.9;word-break:break-all}
.steps{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.steps span{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:#E8EBF1;color:var(--muted)}
.steps span.on{background:var(--navy);color:#fff}
.steps span.done{background:var(--teal-l);color:var(--teal)}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs .n{background:var(--gold);color:var(--navy);border-radius:999px;padding:0 7px;font-size:12px;margin-left:6px}
.howto{background:var(--teal-l);border:1px solid #C5E3E1;border-radius:10px;padding:12px 16px;font-size:14px;margin-bottom:14px}
.howto ol{margin:6px 0 0;padding-left:20px}
.howto li{margin:3px 0}

.prompt .q{font-size:17px;font-weight:700}
.prompt .q small{display:block;font-size:13px;font-weight:400;opacity:.85}
.outputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.output{border:2px solid var(--line);border-radius:10px;display:flex;flex-direction:column;background:#FCFCFD}
.output .olabel{background:var(--navy);color:#fff;font-weight:800;font-size:18px;padding:6px 12px;border-radius:7px 7px 0 0;display:flex;justify-content:space-between;align-items:center;gap:6px}
.output .olabel .tag{font-size:12px;font-weight:700;background:var(--gold);color:var(--navy);border-radius:999px;padding:3px 10px}

.revwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.paperpane{position:sticky;top:12px;max-height:calc(100vh - 24px)}
.paperpane .otext{max-height:calc(100vh - 80px)}
.dim{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:#fff}
.dim .dt{font-weight:700;color:var(--navy)}
.dim .dd{font-size:13px;color:var(--muted);margin-bottom:8px}
.scale{display:flex;gap:6px;flex-wrap:wrap;position:relative}

.scale label{flex:1;min-width:54px;margin:0;font-weight:700;font-size:14px;text-align:center;border:1px solid #C9CED8;border-radius:8px;padding:5px 3px;cursor:pointer;background:#fff;color:var(--navy)}
.scale label small{display:block;font-weight:400;font-size:11px;color:var(--muted);line-height:1.2}
.scale input:checked+label{background:var(--teal);border-color:var(--teal);color:#fff}
.scale input:checked+label small{color:#E3F2F1}
.scale input:focus-visible+label{outline:2px solid var(--gold)}
.dim input.note{margin-top:8px;font-size:13px;padding:6px 9px}
.radios label,.checks label{display:inline-flex;align-items:center;gap:6px;font-weight:500;margin:4px 16px 4px 0;font-size:14px}
.radios input,.checks input{width:auto;margin:0}
.checks label.locked{color:var(--muted)}
.sticky-submit{position:sticky;bottom:0;background:rgba(245,246,248,.97);border-top:1px solid var(--line);padding:12px 16px;margin:12px -16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;z-index:4}
table.stat{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.stat th,table.stat td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.stat th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
table.stat td details{margin:0;border:0;background:none}
table.stat td details>summary{padding:0;color:var(--teal);text-decoration:underline;font-weight:500;font-size:13px}
table.stat td details .out{padding:6px 0;max-height:260px}
.bar{height:14px;background:#EEF0F4;border-radius:6px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:6px}
.bar.gold>i{background:var(--gold)}
.hostlinks{text-align:center;font-size:14px;color:var(--muted);margin-top:22px}
.hostlinks .btn{margin:4px}
.warnbox{background:var(--warn-l);color:#7a5413;border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}
.okbox{background:var(--ok-l);color:#16613f;border-radius:8px;padding:10px 14px;font-size:15px;margin:8px 0}
.nudge{background:var(--gold-l);border:1px solid #EAD591;color:#5c4a0d;border-radius:8px;padding:10px 14px;font-size:14px;margin:8px 0}
.fb-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.fb-row .score{font-weight:800;color:var(--navy);white-space:nowrap}
.fb-row .note{grid-column:1/-1;color:var(--muted);font-size:13px;font-style:italic}
.qa{margin:0 0 10px}
.qa .q{font-weight:600;font-size:14px;color:var(--navy)}
.qa .a{white-space:pre-wrap;font-size:14px;padding:4px 0 0 10px;border-left:3px solid var(--teal-l)}
.right{color:var(--ok);font-weight:700} .wrong{color:var(--bad);font-weight:700}
.promptbox{width:100%;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:160px}
@media (max-width:900px){
  .outputs,.grid2,.revwrap{grid-template-columns:minmax(0,1fr)}
  .paperpane{position:static;max-height:none}
  .paperpane .otext{max-height:360px}
  .hero .bigcode{font-size:34px}
}
@media print{
  header.top,.demo-bar,.banner,.tabs,.noprint,#who{display:none!important}
  body{background:#fff} main{max-width:none;padding:0}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  details{border:0} details>summary{display:none} details .out{max-height:none}
}
</style>

<script>
/* =====================================================================
   FIREBASE CONFIG (same project as the other class games)
   Sessions live under games/rp1-CODE, so your existing rules apply.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDQ8gn5w_Jj4OzcXFBz2lY2SKuaKEo2wbk",
  authDomain: "obfuscationgame.firebaseapp.com",

  appId: "1:443679460937:web:d6b2806717894b3c923998"

const PREFIX = "rp1-";

/* =====================================================================
   THE PROMPT STUDENTS COPY INTO THEIR AI MODEL  (edit freely)
   ===================================================================== */
const PROMPT_TEXT = `You are helping with an in-class writing exercise for a first-year seminar at Brandeis University. Write a complete paper that fulfills the assignment below, based ONLY on the attached document(s).

Instructions:
- Length: about four double-spaced pages in 12-point font (roughly 1,000–1,200 words of body text), plus a reference list at the end.
- Follow the thesis, structure, and argument in the attached outline or draft as closely as you can. Do not change the author's position.
- Use only sources that appear in the attached materials. Do not invent sources, quotations, statistics, or page numbers. If the attached materials do not contain enough sources to meet the citation requirement, say so in a note at the end rather than making any up.
- Citation style: format all citations and the reference list exactly the way they appear in the American Economic Review — author-year citations in the text, e.g. (Autor 2015) or Autor (2015), and an alphabetical reference list at the end in AER format.
- Write in the style of a non-technical academic paper, such as articles in the Journal of Economic Perspectives (for example, Lee & Wu, "Subsidizing Creativity through Network Design: Zero-Pricing and Net Neutrality," JEP 2009): clear, concise argumentation and logical structure; well-reasoned arguments supported by evidence; no complex mathematical or statistical analysis.
- Return the full paper as plain text, with the reference list at the end.

The assignment (from the course syllabus):

Paper 1. AI and Your Education
Focus: Analysis of how AI's existence should impact your studies at Brandeis University. When/where should you use AI in your studies? When/where should you not? How might you prepare yourself for a world where work often uses AI? When does using AI reduce/expand your human capital?
Length: 5–6 pages, double-spaced, 12-point font. (For this exercise, write about four pages instead, as described above.)
Style: Model your approach on non-technical academic papers like Lee & Wu's "Subsidizing Creativity through Network Design: Zero-Pricing and Net Neutrality" (Journal of Economic Perspectives, 2009). Citation style: as in the American Economic Review (see above).
Citations: 10 to 15 citations are required to support the analysis (e.g., from Journal of Economic Perspectives, Economics Letters, Wall Street Journal, Financial Times, The Economist, Washington Post, 404 Media, Ars Technica, U.S. News, Economic Policy Institute, or search platforms like EconLit).
Emphasis on clear, concise argumentation and logical structure, and on developing well-reasoned arguments supported by evidence, without using complex mathematical or statistical analysis.`;

/* =====================================================================
   THE HANDOUT, AS A FORM  (edit freely)
   ===================================================================== */
// [name, description, optional [label for 1, label for 5]] — dimensions without anchors use SCALE below
const DIMS = [
  ["Clarity of central argument", "How clear and focused is the main claim?"],
  ["Restatable thesis", "After reading, how easily could you state the paper's central argument in one sentence?", ["Couldn't say what it argues", "Could restate it instantly"]],
  ["Depth of analysis", "How much does the paper move beyond summary into interpretation and argument?"],
  ["Use of evidence", "How effectively does the paper use examples, data, quotations, or other support?"],
  ["Integration of sources", "How smoothly and meaningfully are sources incorporated?"],
  ["Credibility of sourcing", "Do the citations look real, specific, and used correctly — or vague, generic, or possibly invented?"],
  ["Organization and logical flow", "How well do ideas build from paragraph to paragraph?"],
  ["Originality / insight", "How much does the paper offer fresh thinking rather than predictable points?"],
  ["Voice and sense of authorship", "How much does it sound like a real person with a perspective and a purpose?"],
  ["Substance behind the polish", "The prose probably reads smoothly. Is that polish backed by real quality of thought, or is it mostly smooth wording?", ["Mostly smooth wording", "Real quality throughout"]],
  ["Fit to the assignment", "How well does it answer the Paper 1 question (when/where to use AI at Brandeis; human capital) in the required style?"],
  ["Overall persuasiveness", "How convincing is the paper as a whole?"]
];
const SCALE = ["Weak", "Below average", "Adequate", "Strong", "Excellent"];
function scaleLabel(i, v) {        // label shown under number v (1..5) for dimension i
  const an = DIMS[i][2];
  if (!an) return SCALE[v - 1];
  return v === 1 ? an[0] : v === 5 ? an[1] : v === 3 ? "In between" : "";
}
function scoreWord(i, v) { const an = DIMS[i][2]; return an ? (v === 1 ? an[0] : v === 5 ? an[1] : v < 3 ? "Leans “" + an[0].toLowerCase() + "”" : v > 3 ? "Leans “" + an[1].toLowerCase() + "”" : "In between") : SCALE[v - 1]; }
const REFL = [
  "Where is this paper strongest?",
  "Where is it weakest?",
  "What does the paper flatten, overgeneralize, or leave out?"
];
const SYNTH = [
  "Having read your reviewer's comments and both AI versions, would you rather submit one of the AI versions or your own paper? Why?",
  "What does this comparison suggest about what AI currently does well, and what it still does poorly, in college writing?",
  "Which AI version was closer to your own paper — the one generated from your outline (+ bibliography), or the one from your full first draft? Why?"
];
const SRC_NAME = { a: "outline-based", b: "full-draft-based" };
const SRC_LONG = { a: "generated from your outline (+ bibliography)", b: "generated from your full first draft" };
const MAX_CHARS = 80000;
const N_FIELDS = 4 + 2 * DIMS.length + 2 * REFL.length + 2;
/* ===================================================================== */

const $ = id => document.getElementById(id);
const app = $("app");
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function words(t) { const s = String(t || "").trim(); return s ? s.split(/\s+/).length : 0; }
function mean(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function pct(n, d) { return d ? Math.round(100 * n / d) + "%" : "–"; }
function fmt2(x) { return x == null ? "–" : x.toFixed(2); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function fatal(msg) { const f = $("fatal"); f.innerHTML = msg; f.hidden = false; }
function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function dateStr(ts) { return new Date(ts || Date.now()).toLocaleString(); }

/* ---------------- stores ---------------- */
function fbStore(db) {
  return {
    kind: "firebase",
    set: (p, v) => db.ref(p).set(v),
    update: (p, o) => db.ref(p).update(o),
    get: async p => (await db.ref(p).get()).val(),
    on(p, cb) {
      const r = db.ref(p);
      const h = r.on("value", s => cb(s.val()), e => fatal("Database read failed (" + esc(e.message) + "). Check that your Firebase rules allow reads and writes under <code>games</code>."));
      return () => r.off("value", h);
    }
  };
}
function memStore() {
  const data = {}; let subs = [];
  const get = p => p.split("/").filter(Boolean).reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), data);
  const setDeep = (p, v) => {
    const ks = p.split("/").filter(Boolean); let o = data;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete o[last]; else o[last] = JSON.parse(JSON.stringify(v));
  };
  const copy = v => v == null ? null : JSON.parse(JSON.stringify(v));
  const fire = () => { for (const s of subs) s.cb(copy(get(s.p))); };
  return {
    kind: "memory",
    async set(p, v) { setDeep(p, v); fire(); },
    async update(p, o) { for (const k in o) setDeep(p + "/" + k, o[k]); fire(); },
    async get(p) { return copy(get(p)); },
    on(p, cb) { const s = { p, cb }; subs.push(s); setTimeout(() => cb(copy(get(p))), 0); return () => { subs = subs.filter(x => x !== s); }; }
  };
}
let fbCache = null;
function firebaseStore() {
  if (fbCache) return fbCache;
  if (typeof firebase === "undefined") throw new Error("The Firebase library didn't load. Check your internet connection and reload the page.");
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  fbCache = fbStore(firebase.database());
  return fbCache;
}

/* ---------------- state ----------------
   games/rp1-CODE:
     created, phase: submit | review | feedback
     players/{pid}            {name, joined}
     subs/{pid}/a             {text, bib, assign, model, ts}            (AI paper from the outline)
     subs/{pid}/b             {text, outline, bib, assign, model, ts}   (AI paper from the full draft)
     reviews/{rid}            {author, reviewer, order:[a|b, a|b] (shown as Paper 1, Paper 2),
                               assignedAt, done, progress, guess, ratings, reflect, compare, submittedAt}
     synth/{pid}              author's synthesis answers {0,1,2, ts}
   -------------------------------------- */
let store = null;
let ctx = { role: null, code: null, pid: null, demo: false };
let S = null, unsub = null;
let screen = null, sig = null;
let studentTab = null;
const openDetails = new Set();
const base = () => "games/" + PREFIX + ctx.code;
function getPid() {
  let p = lsGet("rp1.pid");
  if (!p) { p = "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); lsSet("rp1.pid", p); }
  return p;
}
const players = () => (S && S.players) || {};
const subs = () => (S && S.subs) || {};
const reviews = () => (S && S.reviews) || {};
const synth = () => (S && S.synth) || {};
const phase = () => (S && S.phase) || "submit";
function subOf(pid) { return subs()[pid] || {}; }
function complete(pid) { const s = subOf(pid); return !!(s.a && s.a.text && s.b && s.b.text); }
function pname(pid) { return (players()[pid] || {}).name || "?"; }
function byTime(x, y) { return (x[1].assignedAt || 0) - (y[1].assignedAt || 0); }
function reviewsOf(author) { return Object.entries(reviews()).filter(([, r]) => r.author === author).sort(byTime); }
function tasksOf(pid) { return Object.entries(reviews()).filter(([, r]) => r.reviewer === pid).sort(byTime); }
function inputsLine(src, s) {
  if (!s) return "";
  const parts = [];
  if (src === "a") parts.push("outline"); else { parts.push("full first draft"); if (s.outline) parts.push("outline"); }
  if (s.bib) parts.push("annotated bibliography");
  if (s.assign) parts.push("assignment description");
  return parts.join(" + ") + (s.model ? ` · model: ${s.model}` : "");
}

async function joinSession() {
  const msg = $("jMsg");
  const code = $("jCode").value.toUpperCase().replace(/[^A-Z]/g, "");
  const name = $("jName").value.trim().replace(/\s+/g, " ");

    store = firebaseStore();
    const created = await store.get("games/" + PREFIX + code + "/created");
    if (!created) { msg.className = "msg err"; msg.textContent = "No session with that code. Check the board."; $("jGo").disabled = false; return; }
    ctx = { role: "student", code, pid: getPid(), demo: false };
    const existing = await store.get(base() + "/players/" + ctx.pid);
    await store.update(base() + "/players/" + ctx.pid, { name, joined: existing && existing.joined || Date.now() });

/* =====================================================================

  if (!studentTab) studentTab = pending.length ? "review" : (phase() === "feedback" ? "feedback" : "review");

}

  if (text.length > MAX_CHARS) { msg.textContent = `That's too long (${text.length.toLocaleString()} characters). The limit is ${MAX_CHARS.toLocaleString()}.`; return; }

/* ---------- reviewing ---------- */
let rev = { rid: null, d: null };
let progTimer = null;
const draftLS = rid => `rp1.draft.${ctx.code}.${rid}`;
function blankDraft() { return { step: 1, guess: {}, ratings: { p1: {}, p2: {} }, reflect: { p1: {}, p2: {} }, compare: {} }; }
function loadDraft(rid) { try { const x = JSON.parse(lsGet(draftLS(rid)) || "null"); if (x && x.ratings) return x; } catch (e) {} return blankDraft(); }
function saveDraft() {
  lsSet(draftLS(rev.rid), JSON.stringify(rev.d));
  clearTimeout(progTimer);
  progTimer = setTimeout(() => {
    const r = rev.rid && reviews()[rev.rid];
    if (!r || r.done) return;
    store.update(`${base()}/reviews/${rev.rid}`, { progress: progressOf(rev.d) }).catch(() => {});
  }, 1500);
}
function progressOf(d) {
  let n = 0; const g = d.guess || {};
  ["draftIs", "bib", "assignP1", "assignP2"].forEach(k => { if (g[k] != null && g[k] !== "") n++; });
  ["p1", "p2"].forEach(s => {
    DIMS.forEach((_, i) => { const x = ((d.ratings || {})[s] || {})[i]; if (x && x.r) n++; });
    REFL.forEach((_, i) => { if (String(((d.reflect || {})[s] || {})[i] || "").trim()) n++; });
  });
  const c = d.compare || {}; if (c.stronger) n++; if (String(c.useful || "").trim()) n++;
  return Math.round(100 * n / N_FIELDS) / 100;
}
function stepsReview(step) {
  const names = ["1 · Read & guess", "2 · Rate Paper 1", "3 · Rate Paper 2", "4 · Compare & submit"];
  return `<div class="steps">${names.map((n, j) => `<span class="${j + 1 === step ? "on" : j + 1 < step ? "done" : ""}">${n}</span>`).join("")}</div>`;
}
function studentReview(pending) {
  if (!pending.length) {
    const done = tasksOf(ctx.pid).filter(([, r]) => r.done).length;
    const key = ["norev", done, phase(), complete(ctx.pid), reviewsOf(ctx.pid).length].join("|");
    if (screen === "s-norev" && sig === key) { fillShell("review"); return; }
    screen = null; rev = { rid: null, d: null };
    let body;
    if (done) body = `<h2>Your review is in ✓</h2><p>Thanks — your classmate will see your comments (anonymously) once the instructor releases feedback.${phase() === "feedback" ? ` Feedback has been released: see the <b>Feedback on your papers</b> tab.` : ""}</p>`;
    else body = `<h2>Waiting for an assignment</h2><p class="muted">Your instructor hasn't assigned you a classmate's papers yet. This page updates on its own.</p>`;
    if (!complete(ctx.pid) && !reviewsOf(ctx.pid).length) body += `<div class="nudge"><b>You haven't submitted both AI papers yet.</b> Until you do, nobody can review your work. Go to <b>Your submission</b> to finish.</div>`;
    setScreen("s-norev", shellHTML() + `<section class="card narrow">${body}</section>`); sig = key;
    fillShell("review");
    return;
  }
  const [rid, r] = pending[0];
  if (rev.rid !== rid) rev = { rid, d: loadDraft(rid) };
  const step = rev.d.step || 1;
  const key = ["rev", rid, step].join("|");
  if (screen === "s-rev" && sig === key) { fillShell("review"); return; }
  screen = null; setScreen("s-rev", shellHTML() + `<div id="revBody"></div>`); sig = key;
  fillShell("review");
  drawReview(rid, r, step);
}
function paperCard(label, text, cls) {
  return `<div class="output ${cls || ""}"><div class="olabel"><span>${label}</span></div><div class="otext">${esc(text)}</div></div>`;
}
function radios(name, data, opts, cur) {
  return `<div class="radios">${opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}" data-${data}" ${String(cur) === String(v) ? "checked" : ""}> ${l}</label>`).join("")}</div>`;
}
function drawReview(rid, r, step) {
  const sub = subOf(r.author);

  const d = rev.d; const body = $("revBody");
  rev.warned = null;
  let html = stepsReview(step);
  if (step === 1) {
    const g = d.guess || {};
    html += `<div class="howto"><b>How this works.</b> Below are <b>two AI-written versions of a classmate's Paper 1</b>. One was generated from the author's outline (maybe with their annotated bibliography), the other from the author's full first draft. They're shown in random order and nothing tells you which is which — or whose they are. Please don't try to work out the author.
      <ol><li>Read both papers.</li><li>Guess what each one was made from.</li><li>Rate each paper on the handout's dimensions and write short comments.</li><li>Say which is stronger and what the author should know.</li></ol>
      Your ratings and comments go to the author anonymously, so be specific and useful.</div>
      <div class="outputs">${paperCard("Paper 1", texts.p1)}${paperCard("Paper 2", texts.p2)}</div>
      <section class="card" style="margin-top:14px"><h2>Your guesses</h2>
        <label>Which paper do you think was generated from the author's <b>full first draft</b>?</label>
        ${radios("g-draft", `guess="draftIs"`, [["p1", "Paper 1"], ["p2", "Paper 2"]], g.draftIs)}
        <label>The other paper came from the outline. Do you think the <b>annotated bibliography</b> was attached too?</label>
        ${radios("g-bib", `guess="bib"`, [["yes", "Yes"], ["no", "No"]], g.bib == null ? "" : g.bib ? "yes" : "no")}
        <label>Do you think the <b>assignment description</b> was included in the prompt?</label>
        <div class="row"><span class="small" style="min-width:64px">Paper 1:</span>${radios("g-a1", `guess="assignP1"`, [["yes", "Yes"], ["no", "No"]], g.assignP1 == null ? "" : g.assignP1 ? "yes" : "no")}</div>
        <div class="row"><span class="small" style="min-width:64px">Paper 2:</span>${radios("g-a2", `guess="assignP2"`, [["yes", "Yes"], ["no", "No"]], g.assignP2 == null ? "" : g.assignP2 ? "yes" : "no")}</div>
      </section>
      <div class="sticky-submit"><span class="small muted" id="revMsg"></span><button class="btn primary" data-nav="2">Continue to rate Paper 1 →</button></div>`;
  } else if (step === 2 || step === 3) {
    const slot = step === 2 ? "p1" : "p2", label = step === 2 ? "Paper 1" : "Paper 2";
    const rt = d.ratings[slot] || {}, rf = d.reflect[slot] || {};

      <div class="paperpane">${paperCard(label, texts[slot])}</div>
      <div>
        <section class="card"><h2>Rate ${label}</h2>

        </section>
      </div></div>
      <div class="sticky-submit"><span class="small muted" id="revMsg"></span><span class="row"><button class="btn" data-nav="${step - 1}">← Back</button><button class="btn primary" data-nav="${step + 1}">${step === 2 ? "Continue to Paper 2 →" : "Continue to compare →"}</button></span></div>`;
  } else {
    const c = d.compare || {};
    const k1 = `cmp|${rid}|1`, k2 = `cmp|${rid}|2`;
    html += `<section class="card"><h2>Compare the two papers</h2>
      <details data-k="${k1}" ${openDetails.has(k1) ? "open" : ""}><summary>Re-read Paper 1</summary><div class="out">${esc(texts.p1)}</div></details>
      <details data-k="${k2}" ${openDetails.has(k2) ? "open" : ""}><summary>Re-read Paper 2</summary><div class="out">${esc(texts.p2)}</div></details>
      <label style="margin-top:16px">Which paper is stronger overall?</label>
      ${radios("c-str", `cmp="stronger"`, [["p1", "Paper 1"], ["p2", "Paper 2"], ["same", "About the same"]], c.stronger)}
      <label>What is the single most useful thing the author should know after reading your review?<small>Two or three sentences. This is the first thing they'll read. Optional, but please try.</small><textarea class="short" data-useful maxlength="2000">${esc(c.useful || "")}</textarea></label>
    </section>
    <div class="sticky-submit"><span class="small muted" id="revMsg"></span><span class="row"><button class="btn" data-nav="3">← Back</button><button class="btn primary" id="revSubmit">Submit review</button></span></div>`;
  }
  body.innerHTML = html;
  body.onchange = e => {

// Guesses and the "which is stronger" pick are required. Missing ratings or
// written comments get one warning; a second click goes ahead anyway.
function validateStep(step) {

    const g = d.guess || {};
    if (!g.draftIs || g.bib == null || g.assignP1 == null || g.assignP2 == null) return { hard: true, msg: "Please answer all four guess questions before continuing." };
  } else if (step === 2 || step === 3) {
    const s = step === 2 ? "p1" : "p2";
    const nr = DIMS.filter((_, i) => d.ratings[s][i] && d.ratings[s][i].r).length;
    const nf = REFL.filter((_, i) => String(d.reflect[s][i] || "").trim()).length;
    if (nr < DIMS.length) return { hard: false, msg: `You've left ${DIMS.length - nr} of ${DIMS.length} ratings blank for this paper. The ratings are the main thing the author gets — but you can go on without them.` };
    if (nf === 0) return { hard: false, msg: "You haven't written any comments on this paper. That's allowed, but even one specific sentence helps the author a lot." };
  } else {
    if (!d.compare.stronger) return { hard: true, msg: "Say which paper is stronger overall." };

}

/* ---------- assignment algorithm ----------
   Every student with both AI papers saved ("author") gets at least one reviewer.
   Reviewers are spread evenly; nobody reviews their own paper. Students who
   didn't submit still review someone (so some papers get a second reviewer).
   Can be re-run later for late submitters / late joiners. */
function computeAssignments() {
  const P = Object.keys(players());
  const R = reviews();
  const pending = {}, total = {};
  P.forEach(p => { pending[p] = 0; total[p] = 0; });
  const reviewed = new Set(); const load = {};
  const authors = P.filter(complete);
  authors.forEach(a => load[a] = 0);
  for (const id in R) {
    const r = R[id]; reviewed.add(r.author);
    if (total[r.reviewer] != null) { total[r.reviewer]++; if (!r.done) pending[r.reviewer]++; }
    if (load[r.author] != null) load[r.author]++;
  }
  const out = [];
  const sortBy = f => (x, y) => f(x) - f(y);
  for (const a of shuffle(authors.filter(a => !reviewed.has(a)))) {
    const cands = shuffle(P.filter(p => p !== a)).sort(sortBy(p => pending[p] * 1000 + total[p]));
    if (!cands.length) continue;
    const rv = cands[0]; out.push({ author: a, reviewer: rv }); pending[rv]++; total[rv]++; load[a]++;
  }
  for (const p of shuffle(P)) {
    if (total[p] > 0) continue;
    const cands = shuffle(authors.filter(a => a !== p)).sort(sortBy(a => load[a]));
    if (!cands.length) continue;
    out.push({ author: cands[0], reviewer: p }); total[p]++; pending[p]++; load[cands[0]]++;
  }
  return out;
}
function assignmentUpdates(list) {
  const upd = {};
  for (const x of list) upd["reviews/" + newId("rv")] = { author: x.author, reviewer: x.reviewer, order: shuffle(["a", "b"]), assignedAt: Date.now(), done: false, progress: 0 };
  return upd;
}

function classStats() {

    ["p1", "p2"].forEach((slot, i) => { const rt = (r.ratings || {})[slot] || {}; DIMS.forEach((_, j) => { const v = rt[j] && rt[j].r; if (v) dims[j][order[i]].push(+v); }); });
    const g = r.guess || {};

`When I arrived at Brandeis this fall, I assumed the question about AI was whether to use it. After two months, I think the better question is what I want to be able to do without it. That question organizes this paper: AI should be used wherever it helps me build a capability I will keep, and avoided wherever it quietly does the building for me.
