<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C6E4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sideline</title>
<style>
  :root{
    --pitch:#2C6E4A; --pitch-dark:#235739; --line:rgba(255,255,255,.45);
    --ink:#101713; --shell:#EEF0EB; --card:#FFFFFF; --edge:#D3D8D1; --muted:#6B7570;
    --amber:#B0700B; --amber-bg:#FBEDD3; --blue:#24557E; --blue-bg:#DDE8F3; --red:#A8321F;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--shell);color:var(--ink);font-size:16px;line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,select{font:inherit;color:inherit}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

  .wrap{max-width:640px;margin:0 auto;padding:0 14px 90px}
  header{position:sticky;top:0;z-index:40;background:var(--shell);padding:10px 14px 0;max-width:640px;margin:0 auto}
  .brand{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
  .brand span{color:var(--pitch)}

  .teams{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
  .teams::-webkit-scrollbar{display:none}
  .teampill{flex:none;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;
    background:var(--card);border:1.5px solid var(--edge);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
  .teampill.on{background:var(--pitch);border-color:var(--pitch-dark);color:#fff}
  .teampill .sz{font-size:11.5px;opacity:.72;font-weight:500}
  .teampill .dot{width:6px;height:6px;border-radius:50%;background:#E8A800;flex:none}
  .addteam{flex:none;padding:7px 13px;border-radius:20px;border:1.5px dashed #B9C0B8;color:var(--muted);
    font-size:14px;font-weight:600;background:transparent}

  nav{display:flex;gap:4px;background:#E1E4DE;padding:3px;border-radius:11px}
  nav button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
  nav button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .screen{display:none;padding-top:14px}
  .screen.on{display:block}

  .panel{background:var(--card);border:1px solid var(--edge);border-radius:13px;padding:14px;margin-bottom:12px}
  .panel h2{font-size:15px;margin-bottom:3px}
  .panel .sub{font-size:13px;color:var(--muted);margin-bottom:11px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 15px;border-radius:9px;
    font-weight:620;font-size:15px;background:#E4E7E2;border:1px solid var(--edge)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--pitch);color:#fff;border-color:var(--pitch-dark)}
  .btn.danger{background:#fff;color:var(--red);border-color:#E2C4BE}
  .btn.wide{width:100%}
  .btn.sm{padding:7px 11px;font-size:13.5px;border-radius:7px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .field-lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .inp{width:100%;padding:9px 11px;border:1px solid var(--edge);border-radius:8px;background:#FAFBFA}
  .inp:focus-visible,.btn:focus-visible,nav button:focus-visible,.chip:focus-visible,
  .benchcard:focus-visible,.teampill:focus-visible,.addteam:focus-visible{outline:3px solid #1B7FD4;outline-offset:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .note{font-size:13px;color:var(--muted);line-height:1.5}
  .empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;
    border:1px dashed var(--edge);border-radius:11px;background:#F7F8F6}

  .plist{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
  .prow{display:flex;align-items:center;gap:9px;padding:8px 10px;background:#F7F8F6;border:1px solid var(--edge);border-radius:9px}
  .jersey{min-width:30px;height:30px;padding:0 5px;border-radius:7px;background:var(--pitch);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
  .jersey.blank{background:#C7CDC6;color:#5A625A}
  .prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}
  .tgt{width:46px;padding:5px 6px;border:1px solid var(--edge);border-radius:7px;background:#fff;
    text-align:center;font-size:13px;flex:none}
  .chk{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:560}
  .chk input{width:20px;height:20px;accent-color:var(--pitch)}
  .x{padding:5px 9px;color:var(--muted);font-size:19px;line-height:1;border-radius:6px}
  .x:hover{background:#E8EAE6;color:var(--red)}

  .attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-bottom:12px}
  .att{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;border:1.5px solid var(--edge);
    background:#F7F8F6;text-align:left;font-size:14.5px;font-weight:560}
  .att[aria-pressed="true"]{border-color:var(--pitch);background:#E9F2EC}
  .tick{width:19px;height:19px;border-radius:5px;border:1.5px solid #B9C0B8;background:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800}
  .att[aria-pressed="true"] .tick{background:var(--pitch);border-color:var(--pitch)}

  .clockbar{position:sticky;top:0;z-index:30;background:var(--pitch);color:#fff;border-radius:13px;
    padding:11px 13px;margin-bottom:11px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(16,23,19,.16)}
  .clockbar .time{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .clockbar .meta{flex:1;font-size:12.5px;opacity:.85;line-height:1.3}
  .clockbar .meta b{display:block;font-size:13.5px;font-weight:650;opacity:1}
  .clockbtn{padding:11px 16px;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;font-weight:650;
    border:1px solid rgba(255,255,255,.28);font-size:15px}
  .clockbtn.go{background:#fff;color:var(--pitch-dark)}
  .fixrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:-5px 0 11px}
  .fix{padding:5px 9px;border-radius:7px;font-size:12.5px;font-weight:620;background:var(--card);
    border:1px solid var(--edge);color:var(--muted)}
  .fix.warn{background:var(--amber-bg);border-color:#E7C98E;color:#7A4E06}
  .fixlbl{font-size:11px;color:var(--muted);margin-right:6px}
  .banner{background:var(--amber-bg);border:1px solid #E7C98E;color:#7A4E06;border-radius:10px;padding:9px 12px;
    font-size:14px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}

  .pitch{position:relative;background:repeating-linear-gradient(0deg,var(--pitch) 0 34px,var(--pitch-dark) 34px 68px);
    border-radius:13px;padding:14px 9px;margin-bottom:12px;overflow:hidden}
  .pitch::before{content:"";position:absolute;inset:7px;border:2px solid var(--line);border-radius:6px;pointer-events:none}
  .pitch::after{content:"";position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;
    border:2px solid var(--line);border-radius:50%;pointer-events:none}
  .prow-slots{display:flex;justify-content:center;gap:6px;margin-bottom:7px;position:relative;z-index:2}
  .prow-slots:last-child{margin-bottom:0}
  .chip{flex:1 1 0;max-width:132px;min-width:0;background:rgba(255,255,255,.95);border-radius:10px;padding:7px 5px 6px;
    display:flex;flex-direction:column;align-items:center;gap:2px;border:2.5px solid transparent;text-align:center}
  .chip.sel{border-color:#FFD23F;box-shadow:0 0 0 4px rgba(255,210,63,.4)}
  .chip.vacant{background:rgba(255,255,255,.2);border:2px dashed rgba(255,255,255,.6);color:#fff}
  .chip .pos{font-size:10.5px;font-weight:750;letter-spacing:.04em;color:var(--muted)}
  .chip.vacant .pos{color:rgba(255,255,255,.9)}
  .chip .who{font-size:14.5px;font-weight:680;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .chip .mins{font-size:11px;font-weight:500;line-height:1.1;color:var(--muted)}
  .chip .mins b{font-size:15px;font-weight:720;color:var(--ink)}
  .over .mins b{color:var(--amber)} .under .mins b{color:var(--blue)}
  .bar{position:relative;display:block;width:100%;height:5px;border-radius:3px;background:#DFE3DE;margin-top:3px}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--pitch)}
  .bar u{position:absolute;top:-2px;width:1.5px;height:9px;background:rgba(0,0,0,.5);text-decoration:none}
  .bar.over i{background:var(--amber)} .bar.under i{background:var(--blue)}
  .gst{font-style:normal;font-size:8.5px;font-weight:800;color:#fff;background:var(--blue);
    border-radius:3px;padding:1px 3px;margin-left:3px;vertical-align:middle}
  .chip .delta{font-size:9.5px;color:var(--muted);line-height:1.2}
  .prow-slots.tight .delta{display:none}
  .benchcard .bar{margin-top:4px}
  .stint{font-size:10.5px;color:var(--muted);line-height:1}
  .longstint{color:var(--red);font-weight:700}
  .prow-slots.tight{gap:4px}
  .prow-slots.tight .chip{padding:6px 3px 5px}
  .prow-slots.tight .who{font-size:12px}
  .prow-slots.tight .mins b{font-size:12.5px}
  .prow-slots.tight .mins{font-size:9.5px}
  .prow-slots.tight .pos{font-size:9px}
  .prow-slots.tight .stint{font-size:9px}

  .legend{font-size:11.5px;color:var(--muted);margin:-6px 0 10px}
  .shaperow{display:flex;align-items:center;gap:5px;margin:-4px 0 14px;flex-wrap:wrap}
  .shapelbl{font-size:12.5px;color:var(--muted);margin-right:3px}
  .shapebtn{padding:6px 10px;border-radius:7px;font-size:13px;font-weight:620;background:var(--card);
    border:1.5px solid var(--edge);color:var(--muted)}
  .shapebtn.on{background:var(--pitch);border-color:var(--pitch-dark);color:#fff}

  .benchhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
  .benchhead h2{font-size:15px}
  .benchhead .hint{font-size:12.5px;color:var(--muted)}
  .bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
  .benchcard{background:var(--card);border:2.5px solid var(--edge);border-radius:10px;padding:8px 7px;
    display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
  .benchcard.sel{border-color:#E8A800;box-shadow:0 0 0 4px rgba(232,168,0,.25)}
  .benchcard .who{font-size:14px;font-weight:660;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .benchcard .mins{font-size:11px;font-weight:500;color:var(--muted);line-height:1.1}
  .benchcard .mins b{font-size:15px;font-weight:720;color:var(--ink)}
  .benchcard .mins.over b{color:var(--amber)} .benchcard .mins.under b{color:var(--blue)}
  .benchcard .wait{font-size:10.5px;color:var(--muted)}
  .benchcard.due{border-color:var(--blue);background:var(--blue-bg)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:7px 5px;text-align:right;border-bottom:1px solid #E7EAE6}
  th{font-size:11.5px;color:var(--muted);font-weight:650}
  th:first-child,td:first-child{text-align:left;font-weight:600}
  tbody tr:last-child td{border-bottom:none}
  td.zero{color:#B4BAB3}
  td.soft{color:var(--muted)}
  td.over{color:var(--amber);font-weight:650} td.under{color:var(--blue);font-weight:650}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:9px;font-size:14px;font-weight:560;z-index:90;opacity:0;pointer-events:none;
    transition:opacity .18s;max-width:88vw;text-align:center}
  .toast.show{opacity:.96}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">Side<span>line</span></div>
  <div class="teams" id="teamBar" aria-label="Teams"></div>
  <nav role="tablist">
    <button role="tab" id="tab-game" aria-selected="true" onclick="show('game')">Game</button>
    <button role="tab" id="tab-team" aria-selected="false" onclick="show('team')">Team</button>
    <button role="tab" id="tab-stats" aria-selected="false" onclick="show('stats')">Minutes</button>
  </nav>
</header>

<div class="wrap">
  <section class="screen on" id="s-game"></section>
  <section class="screen" id="s-team"></section>
  <section class="screen" id="s-stats"></section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   Sideline — offline playing-time tracker
   Several teams, each with its own squad size, roster and format.
   One file, no network, no accounts.
   ========================================================= */

var _mem={}, storageOK=true;
var store={
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ storageOK=false; return _mem[k]||null; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ storageOK=false; _mem[k]=v; } }
};

/* ---------- formations, grouped by how many are on the field ---------- */
var FORMATIONS = {
  5:{
    '1-2-1':  [[['GK','GK']],[['CB','DEF']],[['LM','MID'],['RM','MID']],[['ST','FWD']]],
    '2-1-1':  [[['GK','GK']],[['LB','DEF'],['RB','DEF']],[['CM','MID']],[['ST','FWD']]],
    '2-2':    [[['GK','GK']],[['LB','DEF'],['RB','DEF']],[['LS','FWD'],['RS','FWD']]]
  },
  7:{
    '2-3-1':  [[['GK','GK']],[['LB','DEF'],['RB','DEF']],[['LM','MID'],['CM','MID'],['RM','MID']],[['ST','FWD']]],
    '3-2-1':  [[['GK','GK']],[['LB','DEF'],['CB','DEF'],['RB','DEF']],[['LM','MID'],['RM','MID']],[['ST','FWD']]],
    '2-1-2-1':[[['GK','GK']],[['LB','DEF'],['RB','DEF']],[['CDM','MID']],[['LM','MID'],['RM','MID']],[['ST','FWD']]],
    '3-1-2':  [[['GK','GK']],[['LB','DEF'],['CB','DEF'],['RB','DEF']],[['CM','MID']],[['LS','FWD'],['RS','FWD']]]
  },
  9:{
    '3-3-2':  [[['GK','GK']],[['LB','DEF'],['CB','DEF'],['RB','DEF']],[['LM','MID'],['CM','MID'],['RM','MID']],[['LS','FWD'],['RS','FWD']]],
    '3-2-3':  [[['GK','GK']],[['LB','DEF'],['CB','DEF'],['RB','DEF']],[['LCM','MID'],['RCM','MID']],[['LW','FWD'],['ST','FWD'],['RW','FWD']]],
    '2-3-3':  [[['GK','GK']],[['LB','DEF'],['RB','DEF']],[['LM','MID'],['CM','MID'],['RM','MID']],[['LW','FWD'],['ST','FWD'],['RW','FWD']]],
    '3-4-1':  [[['GK','GK']],[['LB','DEF'],['CB','DEF'],['RB','DEF']],[['LM','MID'],['LCM','MID'],['RCM','MID'],['RM','MID']],[['ST','FWD']]]
  },
  11:{
    '4-4-2':  [[['GK','GK']],[['LB','DEF'],['LCB','DEF'],['RCB','DEF'],['RB','DEF']],[['LM','MID'],['LCM','MID'],['RCM','MID'],['RM','MID']],[['LS','FWD'],['RS','FWD']]],
    '4-3-3':  [[['GK','GK']],[['LB','DEF'],['LCB','DEF'],['RCB','DEF'],['RB','DEF']],[['LCM','MID'],['CM','MID'],['RCM','MID']],[['LW','FWD'],['ST','FWD'],['RW','FWD']]],
    '4-2-3-1':[[['GK','GK']],[['LB','DEF'],['LCB','DEF'],['RCB','DEF'],['RB','DEF']],[['LDM','MID'],['RDM','MID']],[['LAM','MID'],['CAM','MID'],['RAM','MID']],[['ST','FWD']]],
    '3-5-2':  [[['GK','GK']],[['LCB','DEF'],['CB','DEF'],['RCB','DEF']],[['LWB','MID'],['LCM','MID'],['CM','MID'],['RCM','MID'],['RWB','MID']],[['LS','FWD'],['RS','FWD']]]
  }
};
var SIZES=[5,7,9,11];

var BOBCATS = [
  ['54','Ashok'], ['75','Ilan'],   ['31','Daniel'], ['10','William'],
  ['11','Samuel'],['56','Soren'],  ['91','Roland'], ['27','Luc'],
  ['28','Jude'],  ['57','Everett'],['39','Luke'],   ['72','Hans'], ['40','Noah']
];

/* ---------- state ---------- */
var S={teams:[],active:0};
var sel=null, undoStack=[], lastTick=0, timer=null, wakeLock=null, showRoster=false;

function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }
function T(){ return S.teams[S.active]; }
function G(){ return T() ? T().game : null; }

function newTeam(name,size,seeded){
  var sz=size||7;
  return {id:uid(), name:name||'New team', size:sz,
    formation:Object.keys(FORMATIONS[sz])[0], players:[],
    periods:2, periodLength:30, remindEvery:0, longShift:8,
    excludeGK:true,            // keeper minutes sit outside the fairness split
    defaultLineup:null,        // {formation:'2-3-1', slots:{slotId:playerId}}
    seeded:!!seeded, game:null};
}
function shape(){
  var t=T(), set=FORMATIONS[t.size];
  return set[t.formation] || set[Object.keys(set)[0]];
}
function slots(){
  var out=[];
  shape().forEach(function(row,ri){ row.forEach(function(s,si){
    out.push({id:'r'+ri+'s'+si,label:s[0],group:s[1],row:ri}); }); });
  return out;
}
function rows(){
  return shape().map(function(row,ri){ return row.map(function(s,si){
    return {id:'r'+ri+'s'+si,label:s[0],group:s[1]}; }); });
}
/* Roster plus anyone borrowed for today. */
function rosterAll(){
  var g=G();
  return (g&&g.guests&&g.guests.length) ? T().players.concat(g.guests) : T().players;
}
function playerById(id){
  var p=rosterAll(); for(var i=0;i<p.length;i++) if(p[i].id===id) return p[i]; return null;
}
function nameOf(id){ var p=playerById(id); return p?p.name:'\u2014'; }
function isGuest(id){ var p=playerById(id); return !!(p&&p.guest); }

function save(){ store.set('sideline.v2', JSON.stringify(S)); }
function load(){
  var raw=store.get('sideline.v2');
  if(raw){ try{ var d=JSON.parse(raw); if(d.teams&&d.teams.length){ S=d; return; } }catch(e){} }
  var old=store.get('sideline.v1');
  if(old){
    try{
      var o=JSON.parse(old);
      var t=newTeam(o.teamName||'My team',7,true);
      t.players=o.players||[]; t.formation=o.formation||'2-3-1';
      t.periods=o.periods||2; t.periodLength=o.periodLength||30;
      t.remindEvery=o.remindEvery||0; t.longShift=o.longShift||8;
      S={teams:[t],active:0}; save(); return;
    }catch(e){}
  }
  var b=newTeam('Lincoln Bobcats',7,true);
  b.formation='2-3-1'; b.periodLength=30; b.remindEvery=0;
  BOBCATS.forEach(function(r){ b.players.push({id:uid(),num:r[0],name:r[1]}); });
  S={teams:[b],active:0};
}

/* ---------- time ---------- */
function mmss(ms){ if(ms<0)ms=0; var t=Math.floor(ms/1000),m=Math.floor(t/60),s=t%60; return m+':'+(s<10?'0':'')+s; }
function mins1(ms){ return (ms/60000).toFixed(1); }
/* Referees don't stop at exactly 30:00, so each period carries its own
   added time. Everything downstream reads these bounds rather than
   assuming equal periods. */
function periodEnds(){
  var t=T(), g=G(), out=[], acc=0;
  for(var i=0;i<t.periods;i++){
    acc += t.periodLength*60000 + ((g&&g.extra&&g.extra[i])||0);
    out.push(acc);
  }
  return out;
}
function totalGameMs(){ var e=periodEnds(); return e[e.length-1]||0; }
function periodNow(){
  var e=periodEnds(), el=G().elapsed;
  for(var i=0;i<e.length;i++) if(el<e[i]) return i+1;
  return e.length;
}
function periodRemain(){
  var e=periodEnds(), el=G().elapsed;
  for(var i=0;i<e.length;i++) if(el<e[i]) return e[i]-el;
  return 0;
}
function addTime(mins){
  var g=G(), i=periodNow()-1;
  if(!g.extra) g.extra=[];
  g.extra[i]=Math.max(0,(g.extra[i]||0)+mins*60000);
  save(); render();
  toast(mins>0 ? mins+' min added to this period' : 'Added time removed');
}
/* You will forget to start the clock at kickoff. This puts it right, and
   credits or debits everyone on the field for the same amount. */
function nudgeClock(secs){
  var g=G();
  if(secs<0 && g.elapsed+secs*1000<0) secs=-g.elapsed/1000;
  advance(secs*1000);
  save(); render();
  toast((secs>0?'+':'')+Math.round(secs)+'s');
}
/* what this player was owed, given who was actually available while
   the clock ran — accrues per tick, so arrivals and departures
   are handled exactly rather than approximated */
function fairMs(id){ var g=G(); return (g&&g.fair&&g.fair[id])||0; }
function maxPlayed(){
  var g=G(), m=0;
  gameIds().forEach(function(id){ var t=playerTotal(id); if(t>m) m=t; });
  return m;
}
/* everyone this game touched: still here, or here earlier */
function gameIds(){
  var g=G(); if(!g) return [];
  var out=g.present.slice();
  Object.keys(g.time).forEach(function(id){
    if(g.time[id].total>0 && out.indexOf(id)<0) out.push(id);
  });
  Object.keys(g.departed).forEach(function(id){   // keep a 0-minute departure visible
    if(out.indexOf(id)<0) out.push(id);
  });
  return out;
}
function playerTotal(id){ var t=G().time[id]; return t?t.total:0; }

/* Saved lineup first, then roster order for whatever's left. */
function autoFill(useDefault){
  var g=G(), t=T(), sl=slots();
  var order=rosterAll().map(function(p){return p.id;});
  var pool=g.present.slice().sort(function(a,b){ return order.indexOf(a)-order.indexOf(b); });
  g.onField={};

  var placed={};
  if(useDefault!==false && t.defaultLineup && t.defaultLineup.formation===t.formation){
    sl.forEach(function(s){
      var pid=t.defaultLineup.slots[s.id];
      if(pid && pool.indexOf(pid)>=0 && !placed[pid]){ g.onField[s.id]=pid; placed[pid]=1; }
    });
  }
  var spare=pool.filter(function(p){ return !placed[p]; });
  sl.forEach(function(s){ if(!g.onField[s.id]) g.onField[s.id]=spare.shift(); });
  g.bench=spare;
  sel=null; save(); render();
}
function saveDefaultLineup(){
  var g=G(), t=T();
  if(!g||!g.onField){ toast('Set a lineup first.'); return; }
  var slotsMap={};

  t.defaultLineup={formation:t.formation, slots:slotsMap};

}
function clearDefaultLineup(){ T().defaultLineup=null; save(); render(); toast('Default lineup cleared'); }
function kickoff(){
  var g=G(), sl=slots();
  for(var i=0;i<sl.length;i++) if(!g.onField[sl[i].id]){ toast('Fill every position first.'); return; }
  g.stage='live';
  g.bench.forEach(function(id){ g.benchSince[id]=0; });
  Object.keys(g.onField).forEach(function(k){ g.stintSince[g.onField[k]]=0; });
  save(); render();
}
function toggleClock(){
  var g=G(); g.running=!g.running;
  if(g.running){ lastTick=Date.now(); startTimer(); requestWake(); }
  else { stopTimer(); releaseWake(); }
  save(); render();
}
function startTimer(){ if(!timer) timer=setInterval(tick,500); }
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }


/* Move the clock by d milliseconds, crediting everyone accordingly.
   Negative d walks it back — used by the clock correction, so a mis-timed
   start doesn't leave every player's minutes permanently wrong. */
function advance(d){
  var g=G(); if(!g) return;
  g.elapsed=Math.max(0, Math.min(totalGameMs(), g.elapsed+d));
  slots().forEach(function(s){
    var pid=g.onField[s.id]; if(!pid) return;
    var t=g.time[pid]; if(!t) return;
    t.total=Math.max(0,t.total+d); t[s.group]=Math.max(0,t[s.group]+d);
    g.stintSince[pid]=Math.max(0,(g.stintSince[pid]||0)+d);
  });
  g.bench.forEach(function(pid){ g.benchSince[pid]=Math.max(0,(g.benchSince[pid]||0)+d); });
  accrueFair(d);
}
function tick(){
  var g=G(); if(!g||!g.running) return;
  var now=Date.now(), d=now-lastTick; lastTick=now;
  if(d<=0) return;
  if(g.elapsed>=totalGameMs()){ g.running=false; stopTimer(); releaseWake(); render(); return; }
  advance(d);
  if(T().remindEvery>0){
    var every=T().remindEvery*60000;
    if(g.elapsed-g.lastNudge>=every){ g.lastNudge=Math.floor(g.elapsed/every)*every; g.nudge=true; beep(); }
  }
  render();
}


/* ---------------------------------------------------------------
   Fair share, with two wrinkles the simple version can't express.

   Keeper time. Standing in goal isn't the thing players are competing
   for, and counting it makes every keeper look wildly over-played. When
   excludeGK is on, the goal slot leaves the pool AND whoever is in it
   stops accruing — so a full-game keeper reads "not counted" rather than
   "hugely over" or "hugely owed".

   Targets. A player can be aimed at a specific number of minutes. Their
   weight becomes that target; everyone without one splits what's left.
   With no targets set, this collapses back to an even split exactly.
   --------------------------------------------------------------- */

/* Who is between the posts right now, if anyone. */
function keeperNow(){
  var g=G(); if(!g) return null;
  var sl=slots();
  for(var i=0;i<sl.length;i++)
    if(sl[i].group==='GK' && g.onField[sl[i].id]) return g.onField[sl[i].id];
  return null;
}

/* Minutes that count toward fairness — keeper time optionally removed. */
function playedCounted(id){
  var g=G(), t=g&&g.time[id]; if(!t) return 0;
  return T().excludeGK ? Math.max(0, t.total-(t.GK||0)) : t.total;
}

/* Relative claim on the minutes. Equal unless someone has a target. */
function fairWeights(){
  var t=T(), g=G(), W={};
  if(!g) return W;
  var counted=slots().filter(function(s){ return !(t.excludeGK && s.group==='GK'); }).length;
  var capacity=totalGameMs()*counted;

  var here=rosterAll().filter(function(p){ return g.present.indexOf(p.id)>=0; });
  var aimed=here.filter(function(p){ return p.target>0; });
  var rest =here.filter(function(p){ return !(p.target>0); });

  var claimed=aimed.reduce(function(a,p){ return a+p.target*60000; },0);
  // If the targets ask for more than the game has, leave a sliver for
  // everyone else rather than going negative.
  var left=Math.max(capacity*0.05, capacity-claimed);
  var avg=rest.length ? left/rest.length : 1;

  here.forEach(function(p){ W[p.id]=(p.target>0 ? p.target*60000 : avg)||1; });
  return W;
}

function accrueFair(d){
  var g=G(), t=T(), sl=slots();
  var gk=t.excludeGK ? keeperNow() : null;
  var counted=sl.filter(function(s){ return !(t.excludeGK && s.group==='GK'); }).length;
  var pool=g.present.filter(function(p){ return p!==gk; });
  if(!pool.length || !counted) return;

  var W=fairWeights();
  var sum=pool.reduce(function(a,p){ return a+(W[p]||1); },0);
  if(sum<=0) return;
  pool.forEach(function(p){
    // Nobody can be owed more time than has actually been played.
    var add=d*counted*(W[p]||1)/sum;
    add = d>=0 ? Math.min(d, add) : Math.max(d, add);
    g.fair[p]=Math.max(0,(g.fair[p]||0)+add);
  });
}

/* ---------- selection & swapping ---------- */
function pick(kind,id){
  if(sel&&sel.kind===kind&&sel.id===id){ sel=null; render(); return; }
  if(!sel){ sel={kind:kind,id:id}; render(); return; }
  if(sel.kind==='slot'&&kind==='bench') doSwap(sel.id,id);
  else if(sel.kind==='bench'&&kind==='slot') doSwap(id,sel.id);
  else if(sel.kind==='slot'&&kind==='slot') doShuffle(sel.id,id);
  else { sel={kind:kind,id:id}; render(); }
}
function snapshot(){
  var g=G();
  undoStack.push(JSON.stringify({formation:T().formation,onField:g.onField,bench:g.bench,
    stintSince:g.stintSince,benchSince:g.benchSince}));
  if(undoStack.length>25) undoStack.shift();
}
function doSwap(slotId,benchId){
  snapshot(); var g=G();
  var outId=g.onField[slotId];
  g.onField[slotId]=benchId;
  var i=g.bench.indexOf(benchId); if(i>=0) g.bench.splice(i,1);
  if(outId){ g.bench.push(outId); g.benchSince[outId]=0; }
  g.stintSince[benchId]=0; sel=null; save(); render();
  toast(nameOf(benchId)+' in for '+(outId?nameOf(outId):'the empty spot'));
}
function doShuffle(a,b){
  snapshot(); var g=G();
  var pa=g.onField[a], pb=g.onField[b];
  g.onField[a]=pb; g.onField[b]=pa;
  sel=null; save(); render();
  if(pa&&pb) toast(nameOf(pa)+' and '+nameOf(pb)+' switched positions');
}
function undo(){
  if(!undoStack.length){ toast('Nothing to undo.'); return; }
  var s=JSON.parse(undoStack.pop()), g=G();
  if(s.formation) T().formation=s.formation;
  g.onField=s.onField; g.bench=s.bench; g.stintSince=s.stintSince; g.benchSince=s.benchSince;
  sel=null; save(); render(); toast('Undone');
}
function setFormation(k){
  var t=T(); if(k===t.formation) return;
  var g=t.game, mid=g&&(g.stage==='lineup'||g.stage==='live');
  if(!mid){ t.formation=k; save(); render(); return; }
  snapshot();
  var pool=slots().map(function(sl){ return {group:sl.group,pid:g.onField[sl.id]}; })
                  .filter(function(c){ return c.pid; });
  t.formation=k;
  var ns=slots(), out={}, used={};
  ns.forEach(function(sl){
    for(var i=0;i<pool.length;i++) if(!used[i]&&pool[i].group===sl.group){ out[sl.id]=pool[i].pid; used[i]=1; return; }
  });
  ns.forEach(function(sl){
    if(out[sl.id]) return;
    for(var i=0;i<pool.length;i++) if(!used[i]){ out[sl.id]=pool[i].pid; used[i]=1; return; }
  });
  g.onField=out; sel=null; save(); render();
  toast('Switched to '+k+' \u2014 nobody left the field');
}
function endGame(){
  if(!confirm('End the game? The minutes stay on screen until you start the next one.')) return;
  var g=G(); g.running=false; stopTimer(); releaseWake();
  g.stage='done'; sel=null; undoStack=[]; showRoster=false; save(); show('stats'); render();
}
function scrapGame(){
  if(!confirm('Discard this game without saving any minutes?')) return;
  T().game=null; sel=null; stopTimer(); releaseWake(); save(); render();
}
/* someone turns up after kickoff */
function arriveLate(id){
  var g=G(); if(g.present.indexOf(id)>=0) return;
  snapshot();
  g.present.push(id);
  if(!g.time[id]) g.time[id]={total:0,GK:0,DEF:0,MID:0,FWD:0};
  g.fair[id]=playedCounted(id);     // owed nothing for time they weren't here
  g.arrived[id]=g.elapsed; delete g.departed[id];
  g.bench.push(id); g.benchSince[id]=0;
  sel=null; save(); render();
  toast(nameOf(id)+' added — on the bench, owed nothing yet');
}

/* someone has to leave */
function leaveEarly(id){
  var g=G(), sl=slots(), spot=null;
  for(var i=0;i<sl.length;i++) if(g.onField[sl[i].id]===id) spot=sl[i].id;

  if(spot){
    // whoever is owed the most comes on in their place
    var due=g.bench.slice().sort(function(a,b){
      return (fairMs(b)-playedCounted(b))-(fairMs(a)-playedCounted(a)); });
    var repl=due[0];
    if(!repl && !confirm(nameOf(id)+' is on the field and there’s nobody to replace them. Leave the spot empty?')) return;
    snapshot();
    if(repl){
      g.onField[spot]=repl;
      g.bench.splice(g.bench.indexOf(repl),1);
      g.stintSince[repl]=0;
    } else delete g.onField[spot];
  } else snapshot();

  var b=g.bench.indexOf(id); if(b>=0) g.bench.splice(b,1);
  var pr=g.present.indexOf(id); if(pr>=0) g.present.splice(pr,1);
  g.departed[id]=g.elapsed; delete g.arrived[id];
  sel=null; save(); render();
  toast(nameOf(id)+' out for the day'+(spot? ' — '+nameOf(g.onField[spot]||'')+' on':''));
}
function toggleRoster(){ showRoster=!showRoster; render(); }

function backToAttendance(){ G().stage='attendance'; sel=null; save(); render(); }

/* ---------- screen & sound ---------- */
function requestWake(){
  try{ if('wakeLock' in navigator) navigator.wakeLock.request('screen')
    .then(function(w){wakeLock=w;}).catch(function(){}); }catch(e){}
}
function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){ lastTick=Date.now(); if(G()&&G().running) requestWake(); }
});
function beep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var c=new C(),o=c.createOscillator(),g=c.createGain();
    o.connect(g); g.connect(c.destination); o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(.001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);
    o.start(); o.stop(c.currentTime+.36);
  }catch(e){}
}

/* =========================================================
   RENDER
   ========================================================= */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function render(){ renderTeamBar(); renderGame(); renderTeam(); renderStats(); }

function renderTeamBar(){

    });

    h+='<label class="field-lbl" for="oppo">Playing against (optional)</label>'+
       '<input class="inp" id="oppo" value="'+esc(g.opponent||'')+'" placeholder="e.g. Concord Green" '+

    h+='<div class="row" style="margin-bottom:11px">'+
       '<input class="inp num" id="guestNum" placeholder="#" style="width:60px" inputmode="numeric">'+

    el.innerHTML=h; return;
  }

  var live=g.stage==='live';
  if(live){
    var over=g.elapsed>=totalGameMs();
    h+='<div class="clockbar"><div><div class="time num">'+mmss(g.elapsed)+'</div></div>'+
       '<div class="meta"><b>'+(over?'Full time':periodLabel())+'</b>'+

  h+='<div class="pitch">';
  rows().slice().reverse().forEach(function(row){
    h+='<div class="prow-slots'+(row.length>3?' tight':'')+'">';

     (sel?(sel.kind==='bench'?'Now tap a position':'Now tap who comes on'):'Tap a player on, then a player off')+
     '</div></div>';
  h+= bench.length ? '<div class="bench">'+bench.map(function(id){return benchHTML(id,live);}).join('')+'</div>'
                   : '<div class="empty">Everyone present is on the field.</div>';

  if(live && showRoster){
    var away=t.players.filter(function(p){ return g.present.indexOf(p.id)<0; });
    h+='<div class="panel" style="margin-top:14px"><h2>Who\u2019s available</h2>'+
       '<div class="sub">Add someone who turned up late, or take out anyone who has to go.</div>';
    if(away.length){
      h+='<div class="field-lbl">Not playing \u2014 tap to add</div><div class="attgrid">';
      away.forEach(function(p){
        var mins=g.time[p.id]&&g.time[p.id].total>0 ? ' \u00b7 left at '+mmss(g.departed[p.id]||0) : '';
        h+='<button class="att" onclick="arriveLate(\''+p.id+'\')">'+
           '<span class="tick">+</span><span>'+esc(p.name)+mins+'</span></button>';
      });
      h+='</div>';
    } else h+='<div class="note" style="margin-bottom:11px">Everyone on the roster is playing.</div>';
    h+='<div class="row" style="margin:11px 0">'+
       '<input class="inp num" id="guestNum" placeholder="#" style="width:60px" inputmode="numeric">'+
       '<input class="inp" id="guestName" placeholder="Guest player" style="flex:1;min-width:110px">'+
       '<button class="btn sm" onclick="addGuest()">Add guest</button></div>';
    h+='<div class="field-lbl">Playing \u2014 tap to take out</div><div class="attgrid">';
    g.present.forEach(function(id){
      h+='<button class="att" aria-pressed="true" onclick="leaveEarly(\''+id+'\')">'+
         '<span class="tick">\u2713</span><span>'+esc(nameOf(id))+
         (g.arrived[id]!==undefined?' \u00b7 on at '+mmss(g.arrived[id]):'')+'</span></button>';
    });
    h+='</div></div>';
  }

  h+='<div class="row" style="margin-top:14px">';
  h+= live ? '<button class="btn'+(showRoster?' primary':'')+'" onclick="toggleRoster()">'+
             (showRoster?'Done with roster':'Late or leaving')+'</button>'+
             '<button class="btn" onclick="undo()">Undo last change</button>'+
             '<button class="btn danger" onclick="endGame()">End game</button>'
           : '<button class="btn primary" onclick="kickoff()">Ready \u2014 go to the clock</button>'+
             '<button class="btn" onclick="backToAttendance()">Back to attendance</button>';
  h+='</div>';
  el.innerHTML=h;
}
function periodLabel(){
  var n=periodNow(), p=T().periods;
  if(p===2) return n===1?'First half':'Second half';
  if(p===4) return ['First','Second','Third','Fourth'][n-1]+' quarter';
  return 'Period '+n;
}
function clearNudge(){ G().nudge=false; save(); render(); }

function chipHTML(s,live){
  var g=G(), pid=g.onField[s.id];
  var isSel=sel&&sel.kind==='slot'&&sel.id===s.id;
  if(!pid) return '<button class="chip vacant '+(isSel?'sel':'')+'" onclick="pick(\'slot\',\''+s.id+'\')">'+
    '<span class="pos">'+s.label+'</span><span class="who">Empty</span></button>';
  var tot=playerTotal(pid), cnt=live?playedCounted(pid):0, exp=live?fairMs(pid):0, cls='';
  var inGoal=T().excludeGK && s.group==='GK';
  if(live && !inGoal){
    if(cnt>exp+60000) cls='over'; else if(cnt<exp-60000) cls='under';
  }
  var stint=g.stintSince[pid]||0;
  var lng=T().longShift>0&&stint>=T().longShift*60000;
  var d=cnt-exp;
  var delta = !live ? ''
    : inGoal ? 'in goal \u2014 not counted'
    : (Math.abs(d)<60000 ? 'fair '+mmss(exp)
       : (d>0 ? '+'+mmss(d)+' over' : mmss(-d)+' owed'));
  var tgt=playerById(pid); tgt = tgt&&tgt.target>0 ? tgt.target : 0;
  return '<button class="chip '+cls+' '+(isSel?'sel':'')+'" onclick="pick(\'slot\',\''+s.id+'\')">'+
    '<span class="pos">'+s.label+'</span>'+
    '<span class="who">'+esc(nameOf(pid))+(isGuest(pid)?'<i class="gst">G</i>':'')+'</span>'+
    (live?'<span class="mins num"><b>'+mmss(tot)+'</b> played'+(tgt?' / '+tgt+'m':'')+'</span>':'')+
    (live?'<span class="stint '+(lng?'longstint':'')+'">this shift '+mmss(stint)+'</span>':'')+
    (live&&!inGoal?fairBar(cnt,exp,cls):'')+
    (live?'<span class="delta num">'+delta+'</span>':'')+'</button>';
}
/* Played against fair-share-so-far. The tick is always "an even share
   right now"; the fill is what they've actually had. */
function fairBar(tot,fair,cls){
  var anchor=62;                       // where the tick sits, in %
  var ratio = fair>1000 ? tot/fair : 0;
  var fill = Math.min(100, anchor*ratio);
  return '<span class="bar '+cls+'"><i style="width:'+fill.toFixed(1)+'%"></i>'+
         '<u style="left:'+anchor+'%"></u></span>';
}

function benchHTML(id,live){
  var g=G(), isSel=sel&&sel.kind==='bench'&&sel.id===id;
  var tot=playerTotal(id), cnt=live?playedCounted(id):0, exp=live?fairMs(id):0;
  var due=live&&cnt<exp-60000, cls='';
  if(live){ if(cnt>exp+60000) cls='over'; else if(due) cls='under'; }
  return '<button class="benchcard '+(due?'due':'')+' '+(isSel?'sel':'')+'" onclick="pick(\'bench\',\''+id+'\')">'+
    '<span class="who">'+esc(nameOf(id))+(isGuest(id)?'<i class="gst">G</i>':'')+'</span>'+
    (live?'<span class="mins num '+cls+'"><b>'+mmss(tot)+'</b> played</span>':'')+
    (live?fairBar(cnt,exp,cls):'')+
    (live?'<span class="wait num">'+(due?mmss(exp-tot)+' owed':'off '+mmss(g.benchSince[id]||0))+'</span>':'')+
    '</button>';
}

function opt(v,cur,label){ return '<option value="'+v+'"'+(Number(cur)===v?' selected':'')+'>'+label+'</option>'; }
function setNum(key,val){
  var n=parseInt(val,10); if(isNaN(n)) return;
  if(key==='periodLength') n=Math.max(1,Math.min(45,n));
  T()[key]=n; save(); render();
}
function addPlayer(){
  var n=document.getElementById('newName').value.trim(), num=document.getElementById('newNum').value.trim();
  if(!n){ toast('Give the player a name.'); return; }
  var np={id:uid(),name:n,num:num};
  T().players.push(np);
  var g=G(); if(g&&g.stage!=='done') g.time[np.id]={total:0,GK:0,DEF:0,MID:0,FWD:0};
  save(); render();
  var f=document.getElementById('newNum'); if(f) f.focus();
}

function setTarget(id,val){
  var p=playerById(id); if(!p) return;
  var n=parseInt(val,10);
  if(isNaN(n)||n<=0) delete p.target; else p.target=Math.min(200,n);
  save(); render();
}
function removePlayer(id){
  var p=playerById(id); if(!p) return;
  if(!confirm('Remove '+p.name+' from the roster?')) return;
  T().players=T().players.filter(function(x){ return x.id!==id; });
  save(); render();
}
function restoreRoster(){
  var t=T(), have={};
  t.players.forEach(function(p){ have[p.name.toLowerCase()]=true; });
  var added=0;
  BOBCATS.forEach(function(r){
    if(!have[r[1].toLowerCase()]){ t.players.push({id:uid(),num:r[0],name:r[1]}); added++; }
  });
  save(); render();
  toast(added? added+' player'+(added>1?'s':'')+' restored' : 'They were all already there');
}

/* ---------- minutes ---------- */
function renderStats(){
  var el=document.getElementById('s-stats'), g=G(), h='';

      '<div class="empty">Numbers appear here once the game clock is running.</div></div>';

  var done=g.stage==='done';
  var ids=gameIds().sort(function(a,b){ return playerTotal(b)-playerTotal(a); });
  h='<div class="panel"><h2>'+(done?'Final minutes':'This game')+'</h2>'+

    (T().excludeGK?' Keeper minutes sit outside the share.':'')+'</div>'+
    table(ids)+'<div class="row" style="margin-top:12px">'+
    '<button class="btn" onclick="exportCSV()">Save as spreadsheet</button>'+

    '</div></div>';

function table(ids){
  var g=G(), ex=T().excludeGK;
  var h='<table><thead><tr><th>Player</th><th>Played</th><th>Poss.</th><th>Share</th>'+
        '<th>GK</th><th>Def</th><th>Mid</th><th>Fwd</th></tr></thead><tbody>';
  ids.forEach(function(id){
    var t=g.time[id]||{total:0,GK:0,DEF:0,MID:0,FWD:0};
    var cnt=ex?Math.max(0,t.total-(t.GK||0)):t.total, poss=fairMs(id);
    var pct=poss>60000?Math.round(cnt/poss*100)+'%':'\u2013';
    var tone=poss>60000?(cnt>poss*1.15?'over':(cnt<poss*0.85?'under':'')):'';
    h+='<tr><td>'+esc(nameOf(id))+(isGuest(id)?'<i class="gst">G</i>':'')+'</td>'+
       '<td class="num">'+mins1(t.total)+'</td>'+
       '<td class="num soft">'+(poss>1000?mins1(poss):'\u2013')+'</td>'+
       '<td class="num '+tone+'">'+pct+'</td>'+
       cell(t.GK)+cell(t.DEF)+cell(t.MID)+cell(t.FWD)+'</tr>';
  });
  return h+'</tbody></table>';
}
function cell(ms){ return '<td class="num'+(ms<1000?' zero':'')+'">'+(ms<1000?'\u2013':mins1(ms))+'</td>'; }

/* ---------- files ---------- */
function download(name,text,type){
  var b=new Blob([text],{type:type||'text/plain'}), u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(u);},2000);
}

/* One team, without its game in progress — that's today's business, not
   something worth carrying to another phone. */
function teamPayload(){
  var t=JSON.parse(JSON.stringify(T()));
  delete t.game;
  return {kind:'sideline-team', version:2, exported:new Date().toISOString(), team:t};
}
function teamFilename(){
  return (T().name||'team').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-sideline.json';
}

/* ---------------------------------------------------------------
   Sharing the app. Whoever you send this to gets their own copy with
   its own storage — nothing is synced, and their roster is theirs.
   --------------------------------------------------------------- */
function appURL(){
  return location.href.split('#')[0].split('?')[0];
}
function shareApp(){
  var url=appURL(), t={
    title:'Sideline', text:'A playing-time tracker for youth soccer. Works offline.', url:url
  };
  if(navigator.share){ navigator.share(t).catch(function(){}); return; }
  copyText(url, 'Link copied \u2014 paste it into a message');
}
function emailApp(){
  var url=appURL();
  window.location.href='mailto:?subject='+encodeURIComponent('Sideline \u2014 soccer playing-time tracker')+
    '&body='+encodeURIComponent(
      'This tracks who has played how long, and in what position.\n\n'+url+
      '\n\nOpen it on your phone, then use Share \u2192 Add to Home Screen. '+
      'It works with no signal once it is there.');
}
function textApp(){
  var url=appURL();
  window.location.href='sms:?&body='+encodeURIComponent('Sideline \u2014 soccer sub tracker: '+url);
}
function copyText(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); },
      function(){ fallbackCopy(text, function(){ toast(msg); }); });
  } else fallbackCopy(text, function(){ toast(msg); });
}

/* Browsers evict site storage after a stretch of not visiting. A bye
   week is long enough, so nudge once a fortnight if games have happened
   and nothing has been backed up. */
function backupOverdue(){
  var last=Number(store.get('sideline.lastBackup')||0);
  var played=S.teams.some(function(t){ return t.game && t.game.stage==='done'; });
  return played && (Date.now()-last > 14*86400000);
}
function markBackedUp(){ store.set('sideline.lastBackup', String(Date.now())); }
function exportTeam(){
  download(teamFilename(), JSON.stringify(teamPayload(),null,2), 'application/json');
  markBackedUp();
  toast('Saved \u2014 attach it to an email or put it in your files');
}
function copyTeam(){
  var text=JSON.stringify(teamPayload());
  var done=function(){ toast('Copied \u2014 paste it into an email to yourself'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text,done); });
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  var a=document.createElement('textarea');
  a.value=text; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Couldn\u2019t copy \u2014 use Save this team instead.'); }
  document.body.removeChild(a);
}
/* Mail clients cap URL length, so the file is the reliable route and the
   message says so. Short rosters travel fine in the body. */
function emailTeam(){
  var t=T(), payload=JSON.stringify(teamPayload());
  var body='Sideline setup for '+t.name+'.\n\n'+
    'To restore it: open Sideline, go to the Team tab, tap Load a file, and pick the '+
    'attached file. Or copy the text below into a file called '+teamFilename()+'.\n\n';
  var url='mailto:?subject='+encodeURIComponent('Sideline setup \u2014 '+t.name)+
          '&body='+encodeURIComponent(body+payload);
  if(url.length>1800){
    exportTeam();
    toast('Roster is too big to email inline \u2014 saved a file to attach instead.');
    return;
  }
  window.location.href=url;
}
function exportAll(){
  download('sideline-backup.json', JSON.stringify(S,null,2), 'application/json');
  markBackedUp(); toast('Backup saved');
}
function importAll(ev){
  var f=ev.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result), added=0;
      if(d.kind==='sideline-team' && d.team){
        d.team.id=uid(); d.team.game=null;
        S.teams.push(d.team); S.active=S.teams.length-1; added=1;
      } else if(d.teams&&d.teams.length){
        d.teams.forEach(function(t){ t.id=uid(); S.teams.push(t); added++; });
        S.active=S.teams.length-1;
      } else if(d.players){
        var t=newTeam(d.teamName||'Imported team',7,false);
        t.players=d.players; S.teams.push(t); S.active=S.teams.length-1; added=1;
      } else throw 0;
      sel=null; undoStack=[]; save(); render();
      toast(added===1?'Team added':added+' teams added');
    }catch(e){ toast('That file isn\u2019t a Sideline backup.'); }
  };
  r.readAsText(f); ev.target.value='';
}
function exportCSV(){
  var g=G(); if(!g){ toast('No game to export.'); return; }
  var ids=gameIds().sort(function(a,b){ return playerTotal(b)-playerTotal(a); });
  var ex=T().excludeGK;
  var out='Date,Opponent,Player,Jersey,Guest,Target,Minutes played,Counted minutes,Possible minutes,Share,GK,Defense,Midfield,Forward\n';
  ids.forEach(function(id){
    var t=g.time[id]||{total:0,GK:0,DEF:0,MID:0,FWD:0}, p=playerById(id);
    var cnt=ex?Math.max(0,t.total-(t.GK||0)):t.total, poss=fairMs(id);
    out+=new Date().toISOString().slice(0,10)+',"'+(g.opponent||'').replace(/"/g,'""')+'",'+
         '"'+nameOf(id).replace(/"/g,'""')+'",'+((p&&p.num)||'')+','+(isGuest(id)?'yes':'')+','+
         ((p&&p.target>0)?p.target:'')+','+
         mins1(t.total)+','+mins1(cnt)+','+mins1(poss)+','+
         (poss>1000?(cnt/poss).toFixed(3):'')+','+
         mins1(t.GK)+','+mins1(t.DEF)+','+mins1(t.MID)+','+mins1(t.FWD)+'\n';
  });
  download(T().name.replace(/\s+/g,'-').toLowerCase()+'-'+g.label.replace(/[ ,]+/g,'-').toLowerCase()+'.csv',
           out,'text/csv');
  toast('Spreadsheet saved');
}

/* ---------- misc ---------- */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },2200);
}
function show(which){
  ['game','team','stats'].forEach(function(k){
    document.getElementById('s-'+k).classList.toggle('on',k===which);
    document.getElementById('tab-'+k).setAttribute('aria-selected',k===which);
  });
  try{ window.scrollTo(0,0); }catch(e){}
}
window.addEventListener('beforeunload',function(e){
  if(G()&&G().stage==='live'){ e.preventDefault(); e.returnValue=''; }
});

/* ---------- boot ---------- */
load();
S.teams.forEach(function(t){ if(t.game&&t.game.running) t.game.running=false; });
lastTick=Date.now();
render();
</script>
