<script>
window.RG_CONTENT = {"files":{"CLAUDE.md":"# Standing instructions for my Paper 1 folder\n\n- This is my paper. Keep my voice. Diagnose before you change anything.\n- Never edit drafts/draft1.md. Put revisions in a new file, drafts/draft2.md.\n- Show me your plan and ask before making any change.\n- Never invent a source or a statistic. Every number must match sources/annotated_bibliography.md. If something can't be verified, mark it [CITE?].\n- Don't write my thinking for me. Where an argument needs my analysis, leave a [YOUR THINKING: …] note.\n- Style: no \"In today's…\", \"it is important to note\", or \"at the end of the day\".\n- Keep a revision log (revision_log.md): each suggestion, my decision, and my reason.\n","assignment/prompt.md":"# Paper 1: AI and Your Education\n\n**Focus.** Analyze how AI's existence should affect your studies at Brandeis University. Your paper must address three questions:\n\n1. **When and where should you use AI in your studies?**\n2. **When and where should you *not* use it?**\n3. **How should you prepare for a world in which work often uses AI?**\n\n**Length.** 5–6 pages, double-spaced, 12-point font.\n\n**Style.** Non-technical academic prose, in the spirit of accessible papers like those in the *Journal of Economic Perspectives*.\n\n**Requirements.** 15–20 citations; annotated bibliography submitted separately.\n\n**Emphasis.** Clear, concise argumentation; logical structure; well-reasoned arguments supported by evidence. No complex mathematical or statistical analysis needed.\n\n*(In the game, the draft is a condensed ~2-page version with 5 sources; the game says so.)*\n","drafts/draft1.md":"# AI and My Education\n\n**¶1.** In today's rapidly changing world, artificial intelligence is everywhere, and it is important to note that it is changing education in many ways. OpenAI released ChatGPT in November 2022. It became one of the fastest-growing consumer apps in history, and it reached an estimated 100 million users in only about two months (Hu 2023). Now other companies like Google and Anthropic have their own AI models too. These tools can write essays, solve math problems, and answer questions on almost any topic. Because of all of this, AI has both benefits and drawbacks, and students need to use it responsibly.\n\n**¶2.** AI is also going to change the workforce that students like me are preparing to enter. About 90% of employers now say they want to hire people with AI skills. This means that students need to learn how to use AI so they can get jobs and be competitive in the job market. At the end of the day, students who do not learn AI will be left behind.\n\n**¶3.** There are a lot of times when it makes sense for students to use AI. Noy and Zhang (2023) did an experiment with professionals doing writing tasks. They found that ChatGPT cut the time they took by 40%, and it also raised the quality of their writing by 18%. Another study is by Dell'Acqua et al. (2023), who studied consultants at Boston Consulting Group. The consultants using AI finished 12.2% more tasks, worked 25.1% faster, and their work was more than 40% higher in quality. However, on a task outside of what the AI was good at, consultants using AI were 19 percentage points less likely to get the right answer. These studies show that AI can be very helpful.\n\n**¶4.** As I mentioned before, AI is changing jobs. Brynjolfsson, Li, and Raymond (2023) studied customer support workers who were given an AI assistant. The workers resolved 14% more customer issues per hour, and the least experienced workers improved by 34%. This shows again that AI is changing the workforce and that students need to be ready for it.\n\n**¶5.** At Brandeis, there are many classes where AI could be useful. For example, AI could help students in writing classes, and it could help in science classes too. It could also help students study for exams and understand difficult concepts. Students should use AI in a way that helps them learn and not in a way that hurts their learning.\n\n**¶6.** Another interesting study is by Bastani et al. (2025). They gave nearly 1,000 high school math students in Turkey access to GPT-4 while they did practice problems. Students who used a regular version of GPT-4 did 48% better on the practice problems. But on the exam afterward they did not have the AI anymore, and they did 17% worse than students who never had it. I think this is like paying someone to go to the gym for you. If the point of an assignment is the finished product, like formatting a bibliography, then using AI is fine. But if the point is the practice, like writing a paper or working through a problem set, then using AI defeats the whole purpose.\n\n**¶7.** In conclusion, AI has many benefits and drawbacks for students. Students should use AI responsibly, and they should also prepare for a world where many jobs use AI. Students should also be careful about privacy, because AI companies collect a lot of data about the people who use them. Overall, AI is a powerful tool, and it is up to students to use it wisely.\n\n## References\n\nBastani, Hamsa, Osbert Bastani, Alp Sungu, Haosen Ge, Özge Kabakcı, and Rei Mariman. 2025. \"Generative AI without Guardrails Can Harm Learning: Evidence from High School Mathematics.\" *Proceedings of the National Academy of Sciences* 122 (26): e2422633122.\n\nBrynjolfsson, Erik, Danielle Li, and Lindsey R. Raymond. 2023. \"Generative AI at Work.\" NBER Working Paper 31161. Cambridge, MA: National Bureau of Economic Research.\n\nDell'Acqua, Fabrizio, Edward McFowland III, Ethan R. Mollick, Hila Lifshitz-Assaf, Katherine Kellogg, Saran Rajendran, Lisa Krayer, François Candelon, and Karim R. Lakhani. 2023. \"Navigating the Jagged Technological Frontier: Field Experimental Evidence of the Effects of AI on Knowledge Worker Productivity and Quality.\" Harvard Business School Working Paper 24-013.\n\nHu, Krystal. 2023. \"ChatGPT Sets Record for Fastest-Growing User Base – Analyst Note.\" *Reuters*, February 2, 2023.\n\nNoy, Shakked, and Whitney Zhang. 2023. \"Experimental Evidence on the Productivity Effects of Generative Artificial Intelligence.\" *Science* 381 (6654): 187–92.\n","peer_reviews/writer_framing.md":"# Peer Review Worksheet, Part 1: Writer (my framing)\n\n- **My main claim is:** Students should use AI when the finished product is what matters, but not when the practice is the point, and we should learn AI skills for our careers.\n- **The part I feel best about is:** The gym comparison in the paragraph about the math study.\n- **The part I'm least sure about is:** Whether my paragraphs are in the right order.\n- **The feedback I most want is:** Is my argument clear?\n","peer_reviews/reviewer_A.md":"# Peer Review Worksheet: Paper 1 Draft (Day 11)\n\nReviewer: A\n\n*Higher-order concerns first: argument, then evidence, then structure, then style.*\n\n**Thesis test.** *Restated:* \"Students should use AI responsibly because it has benefits and drawbacks.\" **☒ Partial match.** *Where's the confusion:* Your Part 1 claim (product vs. practice) is much more interesting than what your intro says. I only found it in ¶6, almost at the end. \"Benefits and drawbacks\" could be anyone's thesis.\n\n**Argument.** Once I got to ¶6 it's arguable. Before that, it's mostly description.\n\n**Evidence & analysis.** ¶3 summarizes two studies back to back and then just says \"AI can be very helpful.\" But the most interesting finding, that consultants did 19 points *worse* on the task AI was bad at, gets no explanation. What does it mean for a Brandeis student? And doesn't it cut against your last sentence?\n\n**Structure.** **Move ¶6 up, right after the intro.** It's your best idea, and right now it's buried behind three paragraphs of background. **Then go straight to the jobs part (¶2 and ¶4).** Employers want people who are ready to work with AI, but your math study says AI can also make you worse at things. Put those two next to each other and I think you have a bigger point: AI sometimes helps you get ready for work and sometimes hurts. Then the rest of the paper can sort out when and where.\n\n**Style & concision.** *Too wordy:* the first sentence (\"In today's rapidly changing world… it is important to note…\"). *Too compressed:* ¶6 jumps from the gym comparison straight to the rule. Explain *why* practice matters for learning.\n\n**What's working.** The gym comparison. I'll remember it.\n","peer_reviews/reviewer_B.md":"# Peer Review Worksheet: Paper 1 Draft (Day 11)\n\nReviewer: B\n\n*Higher-order concerns first: argument, then evidence, then structure, then style.*\n\n**Thesis test.** *Restated:* \"Students should use AI, but be careful with it.\" **☒ Partial match.**\n\n**Argument.** The prompt asks when we should NOT use AI, and I don't think the paper ever really answers that. **You should add a section on it.** Also, I think you should **add a paragraph explaining how ChatGPT actually works** (neural networks, training data), so the reader understands the technology.\n\n**Evidence & analysis.** Where does the \"90% of employers\" statistic in ¶2 come from? It needs a source.\n\n**Structure.** ¶2 and ¶4 are both about jobs. **Merge them.**\n\n**Style & concision.** *Too wordy:* \"At the end of the day, students who do not learn AI will be left behind\" sounds like a cliché. *Too compressed:* ¶5, \"Students should use AI in a way that helps them learn.\" How?\n\n**What's working.** The Brynjolfsson study is really convincing.\n","peer_reviews/reviewer_C.md":"# Peer Review Worksheet: Paper 1 Draft (Day 11)\n\nReviewer: C\n\n*Higher-order concerns first: argument, then evidence, then structure, then style.*\n\n**Thesis test.** *Restated:* \"AI is good for students, and we need to learn it for our careers.\" **☒ Mismatch.** *Where's the confusion:* Most of the paper is about jobs and how helpful AI is, so that's what I thought the point was.\n\n**Argument.** It's clear, but kind of obvious. Everyone agrees AI is useful.\n\n**Evidence & analysis.** ¶5 about Brandeis is really generic. Name actual classes or assignments: a problem set, a lab report, this seminar.\n\n**Structure.** **Start with the jobs paragraphs.** That's what makes a reader care. **Cut the ChatGPT history** at the start; everyone already knows it.\n\n**Style & concision.** *Too wordy:* \"As I mentioned before, AI is changing jobs\" (¶4). *Too compressed:* the conclusion brings up privacy out of nowhere. Either cut it or make it part of the paper.\n\n**What's working.** It's easy to read. Short sentences.\n","sources/annotated_bibliography.md":"# Annotated Bibliography: Paper 1\n\n*(All five sources are real. Every number below was checked against the published study on 2026-10-05.)*\n\n**Bastani, Hamsa, Osbert Bastani, Alp Sungu, Haosen Ge, Özge Kabakcı, and Rei Mariman. 2025.** \"Generative AI without Guardrails Can Harm Learning: Evidence from High School Mathematics.\" *Proceedings of the National Academy of Sciences* 122 (26): e2422633122.\nField experiment with nearly 1,000 high school math students in Turkey. One group got a ChatGPT-like GPT-4 interface (\"GPT Base\"); another got a \"GPT Tutor\" designed with teachers to give hints rather than answers; a control group had no AI. During practice, GPT Base students did 48% better and GPT Tutor students 127% better than the control group. On the exam afterward, without AI, GPT Base students did 17% *worse* than the control group, while GPT Tutor students did about the same as the control group.\n*How I'll use it:* main evidence for when NOT to use AI, when the practice is the point. **Note to self: the Tutor version didn't hurt. Use this?**\n\n**Brynjolfsson, Erik, Danielle Li, and Lindsey R. Raymond. 2023.** \"Generative AI at Work.\" NBER Working Paper 31161.\nStudied 5,179 customer-support agents given an AI assistant. Productivity (issues resolved per hour) rose 14% on average, and 34% for novice and low-skilled workers, with minimal impact on the most experienced and skilled workers.\n*How I'll use it:* AI is changing jobs; who benefits.\n\n**Dell'Acqua, Fabrizio, Edward McFowland III, Ethan R. Mollick, Hila Lifshitz-Assaf, Katherine Kellogg, Saran Rajendran, Lisa Krayer, François Candelon, and Karim R. Lakhani. 2023.** \"Navigating the Jagged Technological Frontier: Field Experimental Evidence of the Effects of AI on Knowledge Worker Productivity and Quality.\" Harvard Business School Working Paper 24-013.\n758 Boston Consulting Group consultants. On tasks inside AI's capabilities, consultants using GPT-4 completed 12.2% more tasks, worked 25.1% faster, and produced more than 40% higher-quality work. On a task outside AI's capabilities, consultants using AI were 19 percentage points less likely to get the right answer. The authors call this uneven boundary the \"jagged technological frontier.\"\n*How I'll use it:* AI helps, but not everywhere, and you have to know where.\n\n**Hu, Krystal. 2023.** \"ChatGPT Sets Record for Fastest-Growing User Base – Analyst Note.\" *Reuters*, February 2, 2023.\nReports a UBS estimate that ChatGPT reached 100 million monthly active users in January 2023, about two months after launch, making it the fastest-growing consumer app in history.\n*How I'll use it:* background, how fast this happened.\n\n**Noy, Shakked, and Whitney Zhang. 2023.** \"Experimental Evidence on the Productivity Effects of Generative Artificial Intelligence.\" *Science* 381 (6654): 187–92.\nExperiment with 453 college-educated professionals doing occupation-specific writing tasks. Access to ChatGPT cut the average time taken by 40% and raised output quality by 18%.\n*How I'll use it:* when the finished product is what matters, AI helps a lot.\n","notes/brainstorm.md":"# Paper 1 brainstorm (early notes)\n\n- main idea?? AI is fine for the PRODUCT, bad for the PRACTICE\n- gym analogy = main point?? (paying someone to lift weights for you)\n- examples from my own classes:\n  - intro econ problem sets → practice (no AI)\n  - formatting my bibliography for this paper → product (AI fine)\n  - UWS essay drafts → practice\n  - chem lab report formatting → product?\n  - studying for midterms: AI quiz questions OK? practice, but AI as a coach, not a doer\n- jobs: employers want AI skills... I heard 90%?? find source\n- Bastani: the TUTOR version didn't hurt! (hints, not answers). Use this?\n- careers, what skills actually? knowing WHEN to trust AI (jagged frontier!) — you only learn that if you can do the work yourself\n- don't start with \"In today's world\" (cliché)\n"},"draft1":{"title":"AI and My Education","paras":["In today's rapidly changing world, artificial intelligence is everywhere, and it is important to note that it is changing education in many ways. OpenAI released ChatGPT in November 2022. It became one of the fastest-growing consumer apps in history, and it reached an estimated 100 million users in only about two months (Hu 2023). Now other companies like Google and Anthropic have their own AI models too. These tools can write essays, solve math problems, and answer questions on almost any topic. Because of all of this, AI has both benefits and drawbacks, and students need to use it responsibly.","AI is also going to change the workforce that students like me are preparing to enter. About 90% of employers now say they want to hire people with AI skills. This means that students need to learn how to use AI so they can get jobs and be competitive in the job market. At the end of the day, students who do not learn AI will be left behind.","There are a lot of times when it makes sense for students to use AI. Noy and Zhang (2023) did an experiment with professionals doing writing tasks. They found that ChatGPT cut the time they took by 40%, and it also raised the quality of their writing by 18%. Another study is by Dell'Acqua et al. (2023), who studied consultants at Boston Consulting Group. The consultants using AI finished 12.2% more tasks, worked 25.1% faster, and their work was more than 40% higher in quality. However, on a task outside of what the AI was good at, consultants using AI were 19 percentage points less likely to get the right answer. These studies show that AI can be very helpful.","As I mentioned before, AI is changing jobs. Brynjolfsson, Li, and Raymond (2023) studied customer support workers who were given an AI assistant. The workers resolved 14% more customer issues per hour, and the least experienced workers improved by 34%. This shows again that AI is changing the workforce and that students need to be ready for it.","At Brandeis, there are many classes where AI could be useful. For example, AI could help students in writing classes, and it could help in science classes too. It could also help students study for exams and understand difficult concepts. Students should use AI in a way that helps them learn and not in a way that hurts their learning.","Another interesting study is by Bastani et al. (2025). They gave nearly 1,000 high school math students in Turkey access to GPT-4 while they did practice problems. Students who used a regular version of GPT-4 did 48% better on the practice problems. But on the exam afterward they did not have the AI anymore, and they did 17% worse than students who never had it. I think this is like paying someone to go to the gym for you. If the point of an assignment is the finished product, like formatting a bibliography, then using AI is fine. But if the point is the practice, like writing a paper or working through a problem set, then using AI defeats the whole purpose.","In conclusion, AI has many benefits and drawbacks for students. Students should use AI responsibly, and they should also prepare for a world where many jobs use AI. Students should also be careful about privacy, because AI companies collect a lot of data about the people who use them. Overall, AI is a powerful tool, and it is up to students to use it wisely."],"refs":["Bastani, Hamsa, Osbert Bastani, Alp Sungu, Haosen Ge, Özge Kabakcı, and Rei Mariman. 2025. \"Generative AI without Guardrails Can Harm Learning: Evidence from High School Mathematics.\" *Proceedings of the National Academy of Sciences* 122 (26): e2422633122.","Brynjolfsson, Erik, Danielle Li, and Lindsey R. Raymond. 2023. \"Generative AI at Work.\" NBER Working Paper 31161. Cambridge, MA: National Bureau of Economic Research.","Dell'Acqua, Fabrizio, Edward McFowland III, Ethan R. Mollick, Hila Lifshitz-Assaf, Katherine Kellogg, Saran Rajendran, Lisa Krayer, François Candelon, and Karim R. Lakhani. 2023. \"Navigating the Jagged Technological Frontier: Field Experimental Evidence of the Effects of AI on Knowledge Worker Productivity and Quality.\" Harvard Business School Working Paper 24-013.","Hu, Krystal. 2023. \"ChatGPT Sets Record for Fastest-Growing User Base – Analyst Note.\" *Reuters*, February 2, 2023.","Noy, Shakked, and Whitney Zhang. 2023. \"Experimental Evidence on the Productivity Effects of Generative Artificial Intelligence.\" *Science* 381 (6654): 187–92."]},"lazy":{"title":"Navigating the AI Revolution: Why Mastering AI Is Essential for Students","blocks":[{"heading":false,"text":"In an era defined by rapid technological change, artificial intelligence has emerged as one of the most transformative forces shaping the modern workforce. Employers increasingly seek candidates who can leverage AI tools effectively; indeed, roughly 90% of employers now report that they want to hire people with AI skills (Johnson 2024). This paper argues that mastering AI is essential for students' future careers, while recognizing that it must be used responsibly.","pins":[{"n":5,"note":"","at":338},{"n":3,"note":"","at":469}]},{"heading":false,"text":"The evidence that AI is reshaping work is compelling. Brynjolfsson, Li, and Raymond (2023) found that customer-support workers equipped with an AI assistant resolved 14% more issues per hour, with the least experienced workers improving by an impressive 34%. These findings underscore a crucial point: students who fail to develop AI fluency risk being left behind in an increasingly competitive job market.","pins":[{"n":2,"note":"Reviewer C's order","at":407}]},{"heading":false,"text":"At the same time, AI is not without its drawbacks. Bastani et al. (2025) found that high school students who used GPT-4 during practice performed 48% better on practice problems but 17% worse on the exam that followed. Much like outsourcing one's workout, relying on AI during practice can undermine the very skills students seek to build.","pins":[{"n":2,"note":"Reviewer A's move","at":339},{"n":4,"note":"","at":339}]},{"heading":false,"text":"To understand both the promise and the limits of these tools, it helps to understand how they work. Large language models such as ChatGPT are neural networks trained on vast amounts of text. During training, the model learns to predict the next word in a sequence, adjusting billions of internal parameters to improve those predictions. Models are then refined using human feedback so that their responses are more helpful. Because they generate text by predicting likely words rather than looking up facts, they can produce confident but incorrect answers, often called \"hallucinations.\"","pins":[{"n":6,"note":"","at":588}]},{"heading":false,"text":"There are numerous situations in which AI can meaningfully enhance students' work. Noy and Zhang (2023) demonstrated that ChatGPT reduced the time professionals spent on writing tasks by 40% while increasing quality by 18%. Similarly, Dell'Acqua et al. (2023) found that consultants at Boston Consulting Group who used AI completed 12.2% more tasks, worked 25.1% faster, and produced work of more than 40% higher quality. While AI users were 19 percentage points less likely to answer correctly on a task outside the AI's capabilities, the overall evidence clearly demonstrates AI's value.","pins":[{"n":11,"note":"","at":589}]},{"heading":false,"text":"Brandeis University offers a particularly rich environment in which to apply these tools. Across its rigorous academic programs, from the sciences to the humanities, students can harness AI to deepen their understanding of complex material, prepare more efficiently for exams, and engage more thoughtfully with course content.","pins":[{"n":8,"note":"","at":326}]},{"heading":true,"text":"When Students Should Not Use AI","pins":[{"n":7,"note":"","at":31}]},{"heading":false,"text":"There are also important situations in which students should avoid AI. When the goal of an assignment is to build skills through practice, such as writing a paper or completing a problem set, relying on AI can undermine learning. As research on practice problems suggests, students who lean on AI may perform worse when they must work independently.","pins":[]},{"heading":false,"text":"In conclusion, AI represents both a tremendous opportunity and a significant responsibility for students. By developing AI skills, students can position themselves for success in a rapidly evolving job market. At the same time, students must remain mindful of privacy, as AI companies collect substantial amounts of user data, raising important questions about consent, security, and data ownership. Ultimately, the key lies in striking the right balance: embracing AI's potential while navigating its challenges thoughtfully.","pins":[{"n":10,"note":"","at":399}]}],"refs":[{"text":"Bastani, Hamsa, Osbert Bastani, Alp Sungu, Haosen Ge, Özge Kabakcı, and Rei Mariman. 2025. \"Generative AI without Guardrails Can Harm Learning: Evidence from High School Mathematics.\" *Proceedings of the National Academy of Sciences* 122 (26): e2422633122.","pins":[]},{"text":"Brynjolfsson, Erik, Danielle Li, and Lindsey R. Raymond. 2023. \"Generative AI at Work.\" NBER Working Paper 31161.","pins":[]},{"text":"Dell'Acqua, Fabrizio, et al. 2023. \"Navigating the Jagged Technological Frontier: Field Experimental Evidence of the Effects of AI on Knowledge Worker Productivity and Quality.\" Harvard Business School Working Paper 24-013.","pins":[]},{"text":"Hu, Krystal. 2023. \"ChatGPT Sets Record for Fastest-Growing User Base – Analyst Note.\" *Reuters*, February 2, 2023.","pins":[]},{"text":"Johnson, Mark. 2024. \"The AI Skills Gap: What Employers Want.\" *Workforce Insights Report*.","pins":[{"n":5,"note":"invented: appears nowhere in the writer's sources","at":91}]},{"text":"Noy, Shakked, and Whitney Zhang. 2023. \"Experimental Evidence on the Productivity Effects of Generative Artificial Intelligence.\" *Science* 381 (6654): 187–92.","pins":[]}],"note":"(The paragraph that cited Hu 2023 was deleted, but its reference entry was left in the list. The cut was never checked against the rest of the paper.)","activity":["> Revise my paper using the peer reviews.","","  thinking: Three reviews with several suggestions. I'll apply all of them.","● Read(drafts/draft1.md)","● Read(peer_reviews/reviewer_A.md)","● Read(peer_reviews/reviewer_B.md)","● Read(peer_reviews/reviewer_C.md)","","  ┌ Edit file: drafts/draft1.md ───────────────────────────────┐","  │ Do you want to make this edit to draft1.md?                 │","  │ › 1. Yes                                                    │","  │   2. Yes, allow all edits during this session               │","  │   3. No, and tell Claude what to do differently             │","  └─────────────────────────────────────────────────────────────┘","  (Game caption: \"You picked 2 without reading the change.\")","","● Edit(drafts/draft1.md)  — 14 changes, 594 → 559 words, ~95% of sentences reworded","","✓ Done! I've revised your paper to address all of the reviewers' feedback:","  ✓ Moved the career discussion to the front (Reviewer C)","  ✓ Moved the Bastani study earlier (Reviewer A)","  ✓ Merged the two paragraphs about jobs (Reviewer B)","  ✓ Added a source for the 90% statistic (Reviewer B)","  ✓ Added an explanation of how ChatGPT works (Reviewer B)","  ✓ Added a section on agraph; ✓ banned phrases. **Teaching point:** generic AI prose (\"In an era defined by…\") passes, because a checker only catches what you told it to look for.","Invented sources: **1**","Opposite suggestions both applied: **yes**","Sentences still in your words: **about 5%**"]},"banned":["In today's","it is important to note","at the end of the day"],"bibliography":"# Annotated Bibliography: Paper 1\n\n*(All five sources are real. Every number below was checked against the published study on 2026-10-05.)*\n\n**Bastani, Hamsa, Osbert Bastani, Alp Sungu, Haosen Ge, Özge Kabakcı, and Rei Mariman. 2025.** \"Generative AI without Guardrails Can Harm Learning: Evidence from High School Mathematics.\" *Proceedings of the National Academy of Sciences* 122 (26): e2422633122.\nField experiment with nearly 1,000 high school math students in Turkey. One group got a ChatGPT-like GPT-4 interface (\"GPT Base\"); another got a \"GPT Tutor\" designed with teachers to give hints rather than answers; a control group had no AI. During practice, GPT Base students did 48% better and GPT Tutor students 127% better than the control group. On the exam afterward, without AI, GPT Base students did 17% *worse* than the control group, while GPT Tutor students did about the same as the control group.\n*How I'll use it:* main evidence for when NOT to use AI, when the practice is the point. **Note to self: the Tutor version didn't hurt. Use this?**\n\n**Brynjolfsson, Erik, Danielle Li, and Lindsey R. Raymond. 2023.** \"Generative AI at Work.\" NBER Working Paper 31161.\nStudied 5,179 customer-support agents given an AI assistant. Productivity (issues resolved per hour) rose 14% on average, and 34% for novice and low-skilled workers, with minimal impact on the most experienced and skilled workers.\n*How I'll use it:* AI is changing jobs; who benefits.\n\n**Dell'Acqua, Fabrizio, Edward McFowland III, Ethan R. Mollick, Hila Lifshitz-Assaf, Katherine Kellogg, Saran Rajendran, Lisa Krayer, François Candelon, and Karim R. Lakhani. 2023.** \"Navigating the Jagged Technological Frontier: Field Experimental Evidence of the Effects of AI on Knowledge Worker Productivity and Quality.\" Harvard Business School Working Paper 24-013.\n758 Boston Consulting Group consultants. On tasks inside AI's capabilities, consultants using GPT-4 completed 12.2% more tasks, worked 25.1% faster, and produced more than 40% higher-quality work. On a task outside AI's capabilities, consultants using AI were 19 percentage points less likely to get the right answer. The authors call this uneven boundary the \"jagged technological frontier.\"\n*How I'll use it:* AI helps, but not everywhere, and you have to know where.\n\n**Hu, Krystal. 2023.** \"ChatGPT Sets Record for Fastest-Growing User Base – Analyst Note.\" *Reuters*, February 2, 2023.\nReports a UBS estimate that ChatGPT reached 100 million monthly active users in January 2023, about two months after launch, making it the fastest-growing consumer app in history.\n*How I'll use it:* background, how fast this happened.\n\n**Noy, Shakked, and Whitney Zhang. 2023.** \"Experimental Evidence on the Productivity Effects of Generative Artificial Intelligence.\" *Science* 381 (6654): 187–92.\nExperiment with 453 college-educated professionals doing occupation-specific writing tasks. Access to ChatGPT cut the average time taken by 40% and raised output quality by 18%.\n*How I'll use it:* when the finished product is what matters, AI helps a lot.\n"};

  var hv = HOST.v[v.id] || { open: false, revealed: false };
  var cur = { d1: G.d1, lazy: G.guess, s4: G.agree, d2a: G.picked.d2a, d2b: G.picked.d2b, d2c: G.picked.d2c, d2d: G.picked.d2d, d3: G.picked.d3, d4: G.picked.d4, s8: G.s8 }[v.id] || null;
  var out = { id: v.id, q: v.q.replace(/\*/g, ''), options: v.options.map(function (o) { return { id: o.id, label: o.label }; }), open: !!hv.open, revealed: !!hv.revealed, chosen: cur };
  if (hv.revealed) { var t = tally(v); out.counts = t.by; out.total = t.total; }
  return out;
}
var syncTimer = null;
function hostSync() {
  if (MODE !== 'host' || !HOST || !HOST.code || !HOST.online) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function () {
    var st = { step: G.at, title: STEPS[G.at] ? STEPS[G.at].title : 'Getting ready', vote: view ? voteState(view.vote) : null, changedAt: Date.now() };
    NET.publish(HOST.code, st).catch(function () { setOnline(false); });
  }, 120);
}
function setOnline(on) {
  if (!HOST) return;
  HOST.online = on;
  paintHostbar();
}
function paintHostbar() {
  var b = $('hostbar');
  if (MODE !== 'host' || !HOST) { b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = (HOST.code ? '<span>Session <span class="code">' + esc(HOST.code) + '</span></span><span class="mono">' + esc(joinUrl(HOST.code).replace(/^https?:\/\//, '')) + '</span>' : '<span>No session: hand counts only</span>') +
    '<span><span class="dot' + (HOST.online ? '' : ' off') + '"></span>' + (HOST.online ? 'connected' : 'offline') + '</span><span style="flex:1"></span>' +
    (HOST.code ? '<button data-act="showQR">Show QR code</button><button data-act="endSession">Delete session</button>' : '<button data-act="hostCreate">Create a session</button>');
}
function qrSheet(code) {
  var url = joinUrl(code);
  return '<div class="qrwrap"><div class="qr">' + QR.svg(url, { label: 'QR code for ' + url }) + '</div><div><div class="fine">Phones out. No account needed.</div>' +
    '<div class="bigcode">' + esc(code) + '</div><div class="mono" style="overflow-wrap:anywhere">' + esc(url.replace(/^https?:\/\//, '').replace(/\?g=.*/, '')) + '</div>' +
    '<p class="fine">Scan the code, or open the address and type the 4 letters.</p></div></div>';
}
ACT.showQR = function () {
  var o = document.createElement('div');
  o.className = 'overlay'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', 'Join this session');
  o.innerHTML = '<div class="sheet"><h1>Join this session</h1>' + qrSheet(HOST.code) + '<div class="row" style="margin-top:.6rem"><button class="btn primary" data-act="closeOverlay">Close</button></div></div>';
  document.body.appendChild(o);
  o.querySelector('button').focus();
};
ACT.closeOverlay = function () { var o = document.querySelector('.overlay'); if (o) o.parentNode.removeChild(o); };
ACT.voteOpen = function (id) {
  var hv = HOST.v[id]; hv.open = true; hv.revealed = false; hv.votes = hv.votes || {};
  if (HOST.unwatch) HOST.unwatch();
  HOST.unwatch = NET.watchVotes(HOST.code, id, function (votes) {
    hv.votes = votes || {};
    var el = $('vc-' + id), d = view && view.vote; if (el) el.textContent = d && d.id === id ? tally(d).phones : Object.keys(hv.votes).length;
    save();
  });
  render();
};
ACT.voteClose = function (id) {
  var hv = HOST.v[id]; hv.open = false; hv.revealed = true;
  if (HOST.unwatch) { HOST.unwatch(); HOST.unwatch = null; }
  render();
};
ACT.endSession = function () {
  if (!window.confirm('Delete session ' + HOST.code + '? Phones will be disconnected. The game on this screen keeps going with hand counts.')) return;
  var code = HOST.code;
  if (HOST.unwatch) { HOST.unwatch(); HOST.unwatch = null; }
  HOST.code = null; HOST.online = false;
  NET.removeSession(code).then(function () { toast('Session ' + code + ' deleted.'); }, function () { toast('Could not reach the database. The session was not deleted.'); });
  paintHostbar(); save(); render();
};
function showHostCreate(msg) {
  showFull('<div class="sheet"><h1>Run a class session</h1><p>Students join on their phones and vote at each decision. You drive the game on this screen.</p>' +
    (msg ? '<div class="banner red">' + esc(msg) + '</div>' : '') +
    '<div class="row"><button class="btn primary" data-act="hostCreate">Create a session</button><button class="btn" data-act="hostOffline">Run with hand counts only</button></div>' +
    '<p class="fine">Controls at each decision: Open voting · Close &amp; reveal · Apply majority (or click any option yourself). Hand counts work with or without the connection. About 15–20 minutes.</p></div>');
}
ACT.hostOffline = function () { HOST.code = null; HOST.online = false; G = fresh(); G.at = 'folder'; shown = {}; paintHostbar(); render(); };
ACT.hostCreate = function () {
  toast('Connecting…');
  NET.connect().then(function () { return NET.createSession(); }).then(function (code) {
    HOST.code = code; HOST.online = true; HOST.v = {};
    if (!G || G.at === 'start') { G = fresh(); }
    watchConnection(); paintHostbar(); save();
    showFull('<div class="sheet"><h1>Join this session</h1>' + qrSheet(code) + '<div class="row" style="margin-top:.8rem"><button class="btn primary" data-act="hostBegin">Start the game</button></div></div>');
    hostLobby();
  }).catch(function () { showHostCreate('Could not reach the class database. You can still run the game with hand counts.'); });
};
function hostLobby() { NET.publish(HOST.code, { step: 'lobby', title: 'Waiting for the presenter to start', vote: null, changedAt: Date.now() }).catch(function () { setOnline(false); }); }
ACT.hostBegin = function () { if (G.at === 'start') G.at = 'folder'; render(); };
function watchConnection() { NET.onConnection(function (on) { setOnline(on); if (on) hostSync(); }); }

/* ---------- class mode: a student's phone ---------- */
var REMOTE = null;
function joinSession(code) {
  toast('Joining…');
  NET.connect().then(function () { return NET.sessionExists(code); }).then(function (ok) {
    if (!ok) { var er = $('join-err'); if (er) er.textContent = 'No session with that code. Check the big screen.'; else showRemoteMsg('No session with the code ' + code + '. Check the big screen.'); return; }
    MODE = 'remote';
    var mine = {}; try { var s = JSON.parse(localStorage.getItem('rev_remote_v1') || 'null'); if (s && s.code === code) mine = s.mine || {}; } catch (e) { /* ignore */ }
    REMOTE = { code: code, state: null, mine: mine };
    NET.watchState(code, function (st) { REMOTE.state = st; paintRemote(); });
    paintRemote();
  }).catch(function () { var er = $('join-err'); var m = 'Can\'t connect right now. Follow on the big screen.'; if (er) er.textContent = m; else showRemoteMsg(m); });
}
function showRemoteMsg(msg) {
  MODE = 'remote';
  showFull('<div class="sheet"><h1>' + esc(T.title) + '</h1><p>' + esc(msg) + '</p><div class="row"><a class="btn" href="' + esc(location.pathname) + '">Play solo instead</a></div></div>');
}
function paintRemote() {
  var st = REMOTE.state, h = '<div class="sheet remote"><p class="fine" style="margin:0">Session <b class="mono">' + esc(REMOTE.code) + '</b></p>';
  if (!st) h += '<h1>This session has ended</h1><p>' + esc(T.s11.solo) + '</p><div class="row"><a class="btn primary" href="' + esc(location.pathname) + '">Play solo</a></div>';
  else {
    var v = st.vote, mine = v ? REMOTE.mine[v.id] : null, voting = v && (v.open || v.revealed);
    h += voting ? '<p class="fine" style="margin:.4rem 0 0">' + esc(st.title || '') + '</p><h1>' + esc(v.q) + '</h1>' : '<h1>' + esc(st.title || '') + '</h1>';
    if (v && v.open) {
      h += '<div class="opts">' + v.options.map(function (o) {
        return '<button class="opt' + (mine === o.id ? ' on' : '') + '" data-act="rvote" data-arg="' + esc(v.id + ':' + o.id) + '" aria-pressed="' + (mine === o.id) + '">' + esc(o.label) + '</button>';
      }).join('') + '</div><p class="fine" role="status">' + (mine ? 'Your vote is in. You can change it until voting closes.' : 'Tap your choice.') + '</p>';
    } else if (v && v.revealed) {
      h += '<div class="opts">' + v.options.map(function (o) {
        var n = (v.counts || {})[o.id] || 0;
        return '<div class="opt' + (v.chosen === o.id ? ' on' : '') + '"><span class="cnt">' + n + '</span>' + esc(o.label) + (mine === o.id ? ' <span class="fine">(your vote)</span>' : '') +
          '<span class="tally" style="width:' + (v.total ? Math.round(100 * n / v.total) : 0) + '%"></span></div>';
      }).join('') + '</div><p class="fine">' + (v.chosen ? 'The class went with the highlighted option. ' : '') + 'Follow on the big screen.</p>';
    } else h += '<p>' + (v ? 'A vote is coming. Watch the big screen.' : 'Follow on the big screen.') + '</p>';
    if (st.step === 's11') h += '<h2>' + esc(T.s11.solo) + '</h2><div class="row"><a class="btn primary" href="' + esc(location.pathname) + '">Play solo</a></div>';
  }
  showFull(h + '</div>');
  $('where').innerHTML = '<b>Class session</b>';
}
ACT.rvote = function (arg) {
  var k = arg.split(':');
  REMOTE.mine[k[0]] = k[1];
  try { localStorage.setItem('rev_remote_v1', JSON.stringify({ code: REMOTE.code, mine: REMOTE.mine })); } catch (e) { /* ignore */ }
  paintRemote();
  NET.vote(REMOTE.code, k[0], k[1]).catch(function () { toast('Vote not sent. Check your connection.'); });
};

/* ---------- start-up ---------- */
function boot() {
  var qs = new URLSearchParams(location.search), font = null;
  $('ill').textContent = T.illustrative;
  if (qs.get('host') != null) {
    MODE = 'host';
    document.documentElement.classList.add('host');
    var saved = load('host');
    HOST = { code: null, online: false, v: {}, unwatch: null };
    G = fresh();
    if (saved && saved.G.at !== 'start') {
      G = upgrade(saved.G); G.ui = {};
      HOST.v = (saved.host && saved.host.v) || {};
      Object.keys(HOST.v).forEach(function (k) { HOST.v[k].open = false; });
      var code = saved.host && saved.host.code;
      paintHostbar();
      render();
      if (code) {
        NET.connect().then(function () { return NET.sessionExists(code); }).then(function (ok) {
          if (ok) { HOST.code = code; HOST.online = true; watchConnection(); paintHostbar(); hostSync(); toast('Reconnected to session ' + code + '.'); }
        }).catch(function () { paintHostbar(); });
      }
    } else showHostCreate();
    paintHostbar();
  } else if (qs.get('g')) {
    MODE = 'remote';
    showFull('<div class="sheet"><h1>' + esc(T.title) + '</h1><p>Joining session ' + esc(qs.get('g').toUpperCase().slice(0, 4)) + '…</p></div>');
    joinSession(qs.get('g').toUpperCase().slice(0, 4));
  } else {
    MODE = 'solo';
    G = fresh();
    showStart();
  }
  try { font = parseFloat(localStorage.getItem('rev_font_' + MODE)); } catch (e) { /* ignore */ }
  if (font) document.documentElement.style.fontSize = font + 'px';
  $('tools').hidden = MODE === 'remote';
}
boot();

})();

</script>
</body>
