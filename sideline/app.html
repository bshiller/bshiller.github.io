<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Sideline...</title>
  
  <script>
    // Detect if the user is on an iOS device
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (isIOS) {
      // Force open the native App Store app on iOS
      window.location.replace("itms-apps://apps.apple.com/us/app/sideline-subs-playing-time/id6811663392");
    } else {
      // Fallback: Open the App Store website in the browser (or change this to your own site)
      window.location.replace("https://apps.apple.com/us/app/sideline-subs-playing-time/id6811663392");
    }
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
  <p>Redirecting you to Sideline...</p>
  <p>If you are not redirected automatically, <a href="https://apps.apple.com/us/app/sideline-subs-playing-time/id6811663392">click here</a>.</p>
</body>
</html>
