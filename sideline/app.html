/* ---------- the once-a-second housekeeping ---------- */

function startTimer() { if (!timer) timer = setInterval(tick, 1000); }

/** Deliberately separate from the clock itself: it may miss ticks without
    costing a single minute. It stops any clock that has run past the end of
    its period — every team, not just the one on screen — and buzzes for
    shifts running long. */
function tick() {
  let whistle = false;
  for (const t of S.teams) {
    if (t.game && E.isRunning(t.game) && E.settleBoundaries(t.game)) whistle = true;
  }
  if (whistle) { save(); beep(); }

  const t = team(), g = game();
  if (g && g.stage === 'live' && E.isRunning(g)) {
    const t0 = E.elapsed(g);
    if (t.longShiftMinutes > 0) {
      const limit = t.longShiftMinutes * 60;
      let fresh = false;
      for (const pid of Object.values(E.onField(g))) {
        const run = E.firstStintOfShift(pid, g);
        if (run && t0 - run.start >= limit && !buzzed.has(run.id)) { buzzed.add(run.id); fresh = true; }
      }
      if (fresh) beep();
    }
    if (t.nudgeMinutes > 0) {
      const every = t.nudgeMinutes * 60;
      if (t0 - lastNudge >= every) {
        lastNudge = Math.floor(t0 / every) * every;
        beep();
        toast('Time to look at subs');
      }
    }
  }
  // Only redraw when something can have changed: a running clock, or a
  // whistle just blown. A paused screen holds still, which keeps the page
  // cheap and stops it fighting with whatever you are typing.
  if (whistle || (g && g.stage === 'live' && E.isRunning(g))) {
    renderGame();
    if (scope === 0) renderStats();
  }
}

async function requestWake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
  catch { /* not supported, or the tab isn't visible */ }
}
function releaseWake() { try { wakeLock?.release(); } catch { } wakeLock = null; }

/* ---------- drawing without losing your place ----------

   Every screen is described as one HTML string. The first version wrote it
   with innerHTML, which throws away every node on the page and builds new
   ones — once a second while the clock runs. On a phone scrolled to the
   bench that meant the page was momentarily shorter, Safari clamped the
   scroll position, and the screen leapt back to the clock in the middle of
   planning a substitution. patch() parses the new markup and reconciles it
   against what is already on screen: text and attributes that changed are
   updated in place, nothing else is touched, and the scroll position, the
   focused field and the caret all stay put. */

const scratch = document.createElement('template');

function patch(el, html) {
  scratch.innerHTML = html;
  morphChildren(el, scratch.content);
}

function morphChildren(have, want) {
  const ours = have.childNodes, theirs = want.childNodes;
  for (let i = 0; i < theirs.length; i++) {
    const w = theirs[i], h = ours[i];
    if (!h) { have.appendChild(w.cloneNode(true)); continue; }
    if (h.nodeType === w.nodeType && h.nodeName === w.nodeName) morph(h, w);
    else have.replaceChild(w.cloneNode(true), h);
  }
  while (ours.length > theirs.length) have.removeChild(have.lastChild);
}

function morph(h, w) {
  if (h.nodeType === Node.TEXT_NODE) {
    if (h.data !== w.data) h.data = w.data;
    return;
  }
  if (h.nodeType !== Node.ELEMENT_NODE) return;
  for (const a of Array.from(h.attributes)) if (!w.hasAttribute(a.name)) h.removeAttribute(a.name);
  for (const a of Array.from(w.attributes)) if (h.getAttribute(a.name) !== a.value) h.setAttribute(a.name, a.value);
  // What's typed into a field lives in properties, not attributes. A field
  // being typed in is left alone; any other is brought up to date.
  const tag = h.nodeName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
    if (document.activeElement !== h) {
      if (tag === 'INPUT' && (h.type === 'checkbox' || h.type === 'radio')) {
        if (h.checked !== w.checked) h.checked = w.checked;
      } else if (h.value !== w.value) {
        h.value = w.value;
      }
    }
    if (tag === 'TEXTAREA' && document.activeElement === h) return;
  }
  morphChildren(h, w);
}

/* ---------- render ---------- */

function render() {
  document.getElementById('chrome').hidden = !!onboarding || !S.teams.length;
  renderTeamBar();
  // patch() keeps the focused field in place; this covers the rare redraw
  // that replaces it (a row added above it, say), without scrolling to it.
  const active = document.activeElement;
  const id = active && active.id ? active.id : null;
  const caret = id && active.selectionStart != null ? active.selectionStart : null;
  renderGame(); renderTeam(); renderStats();
  if (id && document.activeElement !== document.getElementById(id)) {
    const back = document.getElementById(id);
    if (back) {
      try { back.focus({ preventScroll: true }); } catch { back.focus(); }
      if (caret != null && back.setSelectionRange) {
        try { back.setSelectionRange(caret, caret); } catch { }
      }
    }
  }
}

function renderTeamBar() {
  let h = '';
  S.teams.forEach((t, i) => {
    const live = t.game && t.game.stage === 'live';
    h += `<button class="teampill ${i === S.active ? 'on' : ''}" onclick="SL.pickTeam(${i})"
      aria-label="${esc(t.name)}, ${t.squadSize} a side${live ? ', game in progress' : ''}">
      ${live ? '<span class="dot"></span>' : ''}<span>${esc(t.name)}</span>
      <span class="sz">${t.squadSize}v${t.squadSize}</span></button>`;
  });
  h += '<button class="addteam" onclick="SL.addTeam()">+ Team</button>';
  patch(document.getElementById('teamBar'), h);
}

function show(which) {
  tab = which;
  for (const k of ['game', 'team', 'stats']) {
    document.getElementById('s-' + k).classList.toggle('on', k === which);
    document.getElementById('tab-' + k).setAttribute('aria-selected', String(k === which));
  }
  window.scrollTo(0, 0);
}

/* ---------- handlers, reached from the markup ---------- */

const SL = {
  show,
  help(key) { helpOpen = helpOpen === key ? null : key; render(); },
  legend(open) { store.set('sideline.legend', open ? 'open' : 'shut'); },
  scope(n) { scope = n; renderStats(); },
  pickSeason(i) { seasonIndex = Number(i); renderStats(); },

  /* teams */
  pickTeam(i) {
    if (i === S.active) return;
    S.active = i; sel = null; undoStack = []; plan = [];
    save(); render(); show('game');
  },
  addTeam() {
    S.teams.push(newTeam());
    S.active = S.teams.length - 1;
    sel = null; undoStack = [];
    save(); render(); show('team');
  },
  deleteTeam() {
    const t = team();
    if (!confirm(`Delete ${t.name}? The roster, seasons and any game in progress go with it.`)) return;
    S.teams.splice(S.active, 1);
    S.active = 0; sel = null; undoStack = [];
    if (!S.teams.length) onboarding = { step: 0, size: 7, formation: E.defaultKey(7), name: '', periods: 2, periodMinutes: 30, rosterText: '' };
    save(); render(); show('game');
  },
  setName(v) { team().name = v; save(); renderTeamBar(); },
  setSize(n) {
    const t = team();
    if (n === t.squadSize) return;
    t.squadSize = n; t.formationKey = E.defaultKey(n);
    if (t.game && t.game.stage === 'attendance') {
      t.game.squadSize = n; t.game.formationKey = t.formationKey;
    }
    save(); render();
  },
  setTeamFormation(k) {
    const t = team();
    t.formationKey = k;
    if (t.game && t.game.stage === 'attendance') t.game.formationKey = k;
    save(); render();
  },
  setExcludeGK(on) { team().excludeGK = on; save(); render(); },
  setTrackAssists(on) { team().trackAssists = on; save(); render(); },
  setNum(key, v) {
    const n = parseInt(v, 10);
    if (Number.isNaN(n)) return;
    team()[key] = key === 'periodMinutes' ? Math.min(45, Math.max(5, n)) : n;
    save(); render();
  },
  clearUsual() { team().defaultLineup = null; save(); render(); },

  /* roster */
  addPlayer() {
    const name = document.getElementById('newName').value.trim();
    const jersey = document.getElementById('newNum').value.trim();
    if (!name) { toast('Give the player a name.'); return; }
    team().players.push({ id: E.uid(), name, jersey, target: null });
    save(); render();
    document.getElementById('newNum')?.focus();
  },
  setTarget(id, v) {
    const p = team().players.find(p => p.id === id);
    if (!p) return;
    const n = parseInt(v, 10);
    p.target = Number.isNaN(n) || n <= 0 ? null : Math.min(200, n);
    save(); render();
  },
  renamePlayer(id, v) {
    const t = team();
    const p = t.players.find(p => p.id === id);
    const name = String(v || '').trim();
    if (!p) return;
    if (!name || name === p.name) { render(); return; }
    p.name = name;
    // Season records copy names in, so they'd otherwise show the old one.
    for (const s of t.seasons) for (const g of s.games) for (const l of g.lines) {
      if (l.playerID === id) l.name = name;
    }
    save(); render();
  },
  removePlayer(id) {
    const t = team();
    const p = t.players.find(p => p.id === id);
    if (!p || !confirm(`Remove ${p.name} from the roster?`)) return;
    t.players = t.players.filter(x => x.id !== id);
    if (t.game && t.game.stage === 'attendance') {
      t.game.checkedIn = t.game.checkedIn.filter(x => x !== id);
    }
    save(); render();
  },
  pasteRoster() {
    const text = prompt('One player per line, jersey number first if you have it.');
    if (!text) return;
    const added = E.parseRoster(text);
    if (!added.length) { toast('Nothing recognised in that list.'); return; }
    team().players.push(...added);
    save(); render();
    toast(`${added.length} player${added.length === 1 ? '' : 's'} added`);
  },

  /* seasons */
  renameSeason(v) { team().seasons.at(-1).name = v; save(); },
  newSeason() {
    if (!confirm('Start a new season? Minutes start again from zero. The current season is kept.')) return;
    const t = team();
    const last = t.seasons.at(-1);
    if (E.isCurrentSeason(last)) last.endedAt = new Date().toISOString();
    t.seasons.push(E.makeSeason(E.suggestedSeasonName()));
    seasonIndex = null;
    save(); render();
    toast('New season started');
  },

  /* game flow */
  newGame() {
    const t = team();
    t.game = E.beginGame(t);
    sel = null; undoStack = []; plan = []; showRoster = false; scorerPick = null;
    buzzed.clear(); lastNudge = 0;
    save(); render(); show('game');
  },
  scrapGame() {
    if (!confirm('Discard this game? No minutes are recorded.')) return;
    team().game = null; sel = null; undoStack = [];
    save(); render();
  },
  setOpponent(v) { mutate(g => { g.opponent = v; }); },
  togglePresent(id) {
    mutate(g => {
      const i = g.checkedIn.indexOf(id);
      if (i >= 0) g.checkedIn.splice(i, 1); else g.checkedIn.push(id);
    });
  },
  toLineup() {
    const g = game();
    if (!g.checkedIn.length) { toast('Tick at least one player.'); return; }
    mutate(gg => { E.autoFill(gg, E.everyone(team()), team().defaultLineup); gg.stage = 'lineup'; });
  },
  autoFill(useUsual) {
    mutate(g => E.autoFill(g, E.everyone(team()), useUsual ? team().defaultLineup : null));
  },
  saveUsual() {
    team().defaultLineup = E.captureLineup(game());
    save(); render();
    toast('Saved as this team’s usual lineup');
  },
  kickoff() {
    const t = team();
    mutate(g => {
      // The clock hasn't run yet, so pick up any format change made since.
      g.periods = t.periods; g.periodMinutes = t.periodMinutes;
      E.kickoff(g);
    });
    startTimer();
  },
  backToAttendance() { mutate(g => { g.stage = 'attendance'; }); },
  clock() {
    const g = game();
    if (E.isFullTime(g)) { SL.endGame(); return; }
    if (E.isRunning(g)) { E.pause(g); releaseWake(); }
    else { E.start(g); startTimer(); requestWake(); }
    save(); render();
  },
  nudge(secs) { mutate(g => E.nudge(g, secs)); },
  addTime(mins) { mutate(g => E.addTime(g, mins)); },
  endPeriod() { mutate(g => E.endPeriodNow(g)); },
  endGame() {
    if (!confirm('End the game? The minutes stay on screen until you start the next one.')) return;
    const t = team();
    mutate(g => E.endGame(g));
    const g = game();
    const summary = E.summarize(g, E.everyone(t), rules());
    if (!E.isCurrentSeason(t.seasons.at(-1))) t.seasons.push(E.makeSeason(E.suggestedSeasonName()));
    t.seasons.at(-1).games.push(summary);
    showRoster = false; plan = []; sel = null; scorerPick = null;
    releaseWake();
    save(); render(); show('stats');
    beep();
  },

  /* goals */
  goalFor() {
    const g = game();
    if (!g) return;
    scorerPick = { at: E.elapsed(g) };       // stamped now, not when the name is picked
    render();
  },
  goalBy(id) {
    if (!scorerPick) return;
    // With assists on, a named scorer brings up the second question.
    if (id && team().trackAssists) { scorerPick = { ...scorerPick, scorer: id }; render(); return; }
    recordGoal(id || null, null);
  },
  assistBy(id) {
    if (!scorerPick || !scorerPick.scorer) return;
    recordGoal(scorerPick.scorer, id || null);
  },
  goalCancel() { scorerPick = null; render(); },
  goalAgainst() {
    mutate(g => E.addGoal(g, { ours: false, at: E.elapsed(g) }));
    toast('Goal for them');
  },
  removeGoal(id) {
    const g = game();
    const x = g && g.goals.find(x => x.id === id);
    if (!x) return;
    const who = goalLabel(x, g.opponent || 'them');
    if (!confirm(`Take back the goal at ${E.clockText(x.at)} (${who})?`)) return;
    mutate(gg => E.removeGoal(gg, id));
    toast('Goal removed');
  },
  toggleRoster() { showRoster = !showRoster; render(); },
  undo() {
    if (!undoStack.length) { toast('Nothing to undo.'); return; }
    const last = JSON.parse(undoStack.pop());
    mutate(g => {
      g.stints = last.stints; g.spells = last.spells;
      g.guests = last.guests; g.formationKey = last.formationKey;
    });
    team().formationKey = last.formationKey;
    sel = null; plan = [];
    save(); render();
    toast('Undone');
  },
  setFormation(k) {
    const g = game();
    if (k === g.formationKey) return;
    checkpoint();
    mutate(gg => E.changeFormation(gg, k, E.elapsed(gg)));
    // Slot IDs mean nothing across shapes, so a plan made in the old one
    // would put people in the wrong places.
    plan = [];
    team().formationKey = k;
    save(); render();
    toast(`Switched to ${k} — nobody left the field`);
  },
  addGuest(live) {
    const name = document.getElementById('guestName').value.trim();
    const jersey = document.getElementById('guestNum').value.trim();
    if (!name) { toast('Give the guest a name.'); return; }
    if (live) checkpoint();
    mutate(g => E.addGuest(g, { name, jersey, at: E.elapsed(g), live }));
    toast(`${name} added for today`);
  },
  arriveLate(id) {
    checkpoint();
    mutate(g => E.arriveLate(g, id, E.elapsed(g)));
    toast(`${nameOf(id)} is available`);
  },
  leaveEarly(id) {
    checkpoint();
    let replaced = null;
    mutate(g => { replaced = E.leaveEarly(g, id, E.elapsed(g), rules()); });
    toast(`${nameOf(id)} out for the day${replaced ? ` — ${nameOf(replaced)} on` : ''}`);
  },

  /* tapping shirts */
  tap(kind, id) {
    const g = game();
    if (!g) return;
    const next = { kind, id };
    if (sel && sel.kind === kind && sel.id === id) { sel = null; render(); return; }
    // Once the clock is on, a substitution is always lined up first.
    if (g.stage === 'live') { planTap(next); return; }
    if (!sel) { sel = next; render(); return; }
    const t0 = E.elapsed(g);
    if (sel.kind === 'slot' && kind === 'bench') {
      checkpoint();
      const slotID = sel.id;
      mutate(gg => E.sub(gg, { slotID, incoming: id, at: t0 }));
      sel = null; render();
    } else if (sel.kind === 'bench' && kind === 'slot') {
      checkpoint();
      const incoming = sel.id;
      mutate(gg => E.sub(gg, { slotID: id, incoming, at: t0 }));
      sel = null; render();
    } else if (sel.kind === 'slot' && kind === 'slot') {
      const on = E.onField(g);
      if (!on[sel.id] && !on[id]) { sel = null; render(); return; }
      checkpoint();
      const slotA = sel.id;
      mutate(gg => E.swapPositions(gg, { slotA, slotB: id, at: t0 }));
      sel = null; render();
    } else {
      sel = next; render();
    }
  },

  /* planned subs */
  clearPlan() { plan = []; sel = null; render(); },
  executePlan() {
    const g = game();
    const onBench = new Set(E.bench(g, E.elapsed(g)));
    const ready = plannedSubs().filter(p => onBench.has(p.incoming));
    if (!ready.length) { toast('Nothing to make.'); return; }
    checkpoint();
    mutate(gg => {
      const t0 = E.elapsed(gg);
      for (const p of ready) E.sub(gg, { slotID: p.slotID, incoming: p.incoming, at: t0 });
    });
    plan = []; sel = null;
    save(); render();
    beep();
    toast(`${ready.length} sub${ready.length === 1 ? '' : 's'} made`);
  },

  /* onboarding */
  ob(key, v) {
    if (key === 'size') { onboarding.size = v; onboarding.formation = E.defaultKey(v); }
    else if (key === 'periodMinutes') onboarding.periodMinutes = Math.min(45, Math.max(5, parseInt(v, 10) || 30));
    else onboarding[key] = v;
    renderGame();
  },
  obSample() { onboarding.rosterText = SAMPLE; renderGame(); },
  obStep(d) {
    const o = onboarding;
    if (d > 0 && o.step === 3) {
      const t = newTeam(o.name.trim() || 'My team', o.size);
      t.formationKey = o.formation;
      t.periods = o.periods;
      t.periodMinutes = o.periodMinutes;
      t.players = E.parseRoster(o.rosterText);
      S.teams.push(t);
      S.active = S.teams.length - 1;
      onboarding = null;
      save(); render(); show('game');
      return;
    }
    o.step = Math.max(0, Math.min(3, o.step + d));
    renderGame();
  },

  /* files */
  exportTeam() {
    const t = team();
    const payload = {
      kind: 'sideline-team', version: 2, exported: new Date().toISOString(),
      name: t.name, squadSize: t.squadSize, formationKey: t.formationKey,
      periods: t.periods, periodMinutes: t.periodMinutes,
      longShiftMinutes: t.longShiftMinutes, nudgeMinutes: t.nudgeMinutes,
      excludeGoalkeeperTime: t.excludeGK, trackAssists: !!t.trackAssists, defaultLineup: t.defaultLineup,
      players: t.players, seasons: t.seasons
    };
    download(`${E.fileSlug(t.name)}-sideline.json`, JSON.stringify(payload, null, 2), 'application/json');
    toast('Saved — attach it to an email or keep it in your files');
  },
  loadTeam() { document.getElementById('teamFile').click(); },
  importTeam(ev) {
    const f = ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (d.kind !== 'sideline-team') throw new Error('not a team file');
        const size = E.SIZES.includes(d.squadSize) ? d.squadSize : 7;
        const t = newTeam(d.name || 'Imported team', size);
        if (E.formationKeys(size).includes(d.formationKey)) t.formationKey = d.formationKey;
        t.periods = [2, 3, 4].includes(d.periods) ? d.periods : 2;
        t.periodMinutes = Math.min(45, Math.max(5, d.periodMinutes || 30));
        t.longShiftMinutes = d.longShiftMinutes ?? 8;
        t.nudgeMinutes = d.nudgeMinutes ?? 0;
        t.excludeGK = d.excludeGoalkeeperTime !== false;
        t.trackAssists = d.trackAssists === true;
        t.defaultLineup = d.defaultLineup || null;
        t.players = (d.players || []).map(p => ({
          id: p.id || E.uid(), name: p.name || 'Player',
          jersey: p.jersey || '', target: p.target > 0 ? p.target : null
        }));
        if (Array.isArray(d.seasons) && d.seasons.length) t.seasons = d.seasons;
        S.teams.push(t);
        S.active = S.teams.length - 1;
        save(); render(); show('team');
        toast(`${t.name} added`);
      } catch {
        toast('That file isn’t a Sideline team.');
      }
    };
    r.readAsText(f);
    ev.target.value = '';
  },
  exportGame() {
    const t = team(), g = t.game;
    const summary = E.summarize(g, E.everyone(t), rules());
    let out = CSV_HEAD;
    for (const l of [...summary.lines].sort((a, b) => E.groupTotal(b.played) - E.groupTotal(a.played))) {
      out += csvRow(l.name, l.jersey, 1, l.played, l.possible, l.goals, l.assists);
    }
    download(`${E.fileSlug(t.name)}-game.csv`, out, 'text/csv');
    toast('Spreadsheet saved');
  },
  exportSeason(i) {
    const t = team(), s = t.seasons[i];
    let out = CSV_HEAD;
    for (const l of E.seasonTotals(s)) out += csvRow(l.name, l.jersey, l.games, l.played, l.possible, l.goals, l.assists);
    download(`${E.fileSlug(t.name)}-${E.fileSlug(s.name, 'season')}.csv`, out, 'text/csv');
    toast('Spreadsheet saved');
  },
  exportEveryGame(i) {
    const t = team(), s = t.seasons[i];
    let out = 'Date,Opponent,Goals for,Goals against,' + CSV_HEAD;
    const games = [...s.games].sort((a, b) => String(a.date).localeCompare(String(b.date)));
    for (const game of games) {
      const gf = game.goalsFor ?? '', ga = game.goalsAgainst ?? '';
      for (const l of [...game.lines].sort((a, b) => E.groupTotal(b.played) - E.groupTotal(a.played))) {
        out += String(game.date).slice(0, 10) + ',' + q(game.opponent) + `,${gf},${ga},` +
          csvRow(l.name, l.jersey, 1, l.played, l.possible, l.goals, l.assists);
      }
    }
    download(`${E.fileSlug(t.name)}-by-game.csv`, out, 'text/csv');
    toast('Spreadsheet saved');
  },
  shareApp() {
    const url = location.href.split('#')[0].split('?')[0];
    const text = 'Sideline — a playing-time tracker for youth soccer. Works offline.';
    if (navigator.share) { navigator.share({ title: 'Sideline', text, url }).catch(() => { }); return; }
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(url).then(() => toast('Link copied — paste it into a message'),
        () => toast(url));
      return;
    }
    toast(url);
  }
};

/** During a game, a tap pairs a position with a bench player instead of
    substituting on the spot; Execute makes the changes. Tapping either shirt
    of a pair drops it. Two positions swap straight away. */
function planTap(next) {
  if (sel && sel.kind === 'slot' && next.kind === 'bench') {
    addToPlan(sel.id, next.id);
  } else if (sel && sel.kind === 'bench' && next.kind === 'slot') {
    addToPlan(next.id, sel.id);
  } else if (!sel && next.kind === 'slot') {
    const i = plan.findIndex(p => p.slot === next.id);
    if (i >= 0) plan.splice(i, 1); else sel = next;
    render();
  } else if (!sel && next.kind === 'bench') {
    const i = plan.findIndex(p => p.incoming === next.id);
    if (i >= 0) plan.splice(i, 1); else sel = next;
    render();
  } else if (sel && sel.kind === 'slot' && next.kind === 'slot') {
    const a = sel.id, b = next.id;
    sel = null;
    const on = E.onField(game());
    if (!on[a] && !on[b]) { render(); return; }
    checkpoint();
    mutate(g => E.swapPositions(g, { slotA: a, slotB: b, at: E.elapsed(g) }));
    // A lined-up change follows the player it takes off.
    plan = plan.map(p => ({ ...p, slot: p.slot === a ? b : p.slot === b ? a : p.slot }));
    render();
  } else {
    // Two bench players: not a substitution, so the second becomes the pick.
    sel = next;
    render();
  }
}

function recordGoal(scorer, assist) {
  const at = scorerPick.at;
  scorerPick = null;
  mutate(g => E.addGoal(g, { ours: true, scorer, assist, at }));
  beep();
  toast(scorer ? `Goal — ${nameOf(scorer)}${assist ? `, assist ${nameOf(assist)}` : ''}` : 'Goal for us');
}

function addToPlan(slot, incoming) {
  // One sub per position, and nobody comes on twice.
  plan = plan.filter(p => p.slot !== slot && p.incoming !== incoming);
  plan.push({ slot, incoming });
  sel = null;
  render();
}

/* ---------- boot ---------- */

window.SL = SL;
load();

if (!S.teams.length) {
  onboarding = { step: 0, size: 7, formation: E.defaultKey(7), name: '', periods: 2, periodMinutes: 30, rosterText: '' };
}

for (const k of ['game', 'team', 'stats']) {
  document.getElementById('tab-' + k).addEventListener('click', () => show(k));
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  // The clock needs no catching up — it is derived from a stored instant —
  // but a game that ran past the end of a period while we were away should
  // stop cleanly.
  let whistle = false;
  for (const t of S.teams) {
    if (t.game && E.isRunning(t.game) && E.settleBoundaries(t.game)) whistle = true;
  }
  if (whistle) save();
  render();
  if (game() && E.isRunning(game())) requestWake();
});

window.addEventListener('beforeunload', e => {
  if (game() && game().stage === 'live') { e.preventDefault(); e.returnValue = ''; }
});

render();
startTimer();

if (!storageOK) {
  const w = document.getElementById('warn');
  w.hidden = false;
  w.innerHTML = '<b>Nothing will be saved.</b> This browser blocks storage for pages opened ' +
    'directly from disk, so your roster disappears when you reload. Put the page on a web address, ' +
    'or run <code>python3 -m http.server</code> in the folder and open ' +
    '<code>http://localhost:8000/app.html</code>.';
} else if (migratedNote) {
  const w = document.getElementById('warn');
  w.hidden = false;
  w.textContent = migratedNote;
}

})();
</script>
</body>
</html>
