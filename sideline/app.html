<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C6E4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Sideline — fair playing time for youth soccer coaches. Works offline; nothing leaves your phone.">
<title>Sideline</title>
<style>
/* Sideline — the look, matching the iOS app: light only, pitch green, white
   shirts with a yellow keeper. The palette is the app's Theme.swift. */

:root{
  --pitch:#2C6E4A; --pitch-dark:#235739; --line:rgba(255,255,255,.40);
  --ink:#101713; --shell:#EEF0EB; --card:#FFFFFF; --edge:#D3D8D1; --muted:#6B7570;
  --amber:#B0700B; --amber-bg:#FBEDD3; --blue:#24557E; --blue-bg:#DDE8F3; --red:#A8321F;
  --keeper:#FDDA3A;
  --pair1:#DC2680; --pair2:#0099CC; --pair3:#8440D1; --pair4:#C71F38;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--shell);color:var(--ink);font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

.wrap{max-width:640px;margin:0 auto;padding:0 14px 90px}
header{position:sticky;top:0;z-index:40;background:var(--shell);padding:10px 14px 0;max-width:640px;margin:0 auto}
.brand{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.brand span{color:var(--pitch)}

.teams{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.teams::-webkit-scrollbar{display:none}
.teampill{flex:none;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;
  background:var(--card);border:1.5px solid var(--edge);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.teampill.on{background:var(--pitch);border-color:var(--pitch-dark);color:#fff}
.teampill .sz{font-size:11.5px;opacity:.72;font-weight:500}
.teampill .dot{width:6px;height:6px;border-radius:50%;background:#E8A800;flex:none}
.addteam{flex:none;padding:7px 13px;border-radius:20px;border:1.5px dashed #B9C0B8;color:var(--muted);
  font-size:14px;font-weight:600;background:transparent}

nav{display:flex;gap:4px;background:#E1E4DE;padding:3px;border-radius:11px}
nav button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.screen{display:none;padding-top:14px}
.screen.on{display:block}

/* ---------- panels, buttons, fields ---------- */

.panel{background:var(--card);border:1px solid var(--edge);border-radius:13px;padding:14px;margin-bottom:12px}
.panel h2{font-size:15px;margin-bottom:3px}
.panel .sub{font-size:13px;color:var(--muted);margin-bottom:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 15px;border-radius:9px;
  font-weight:620;font-size:15px;background:#E4E7E2;border:1px solid var(--edge)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pitch);color:#fff;border-color:var(--pitch-dark)}
.btn.danger{background:#fff;color:var(--red);border-color:#E2C4BE}
.btn.wide{width:100%}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field-lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--edge);border-radius:8px;background:#FAFBFA}
textarea.inp{min-height:200px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;
  border:1px dashed var(--edge);border-radius:11px;background:#F7F8F6}
.inp:focus-visible,.btn:focus-visible,nav button:focus-visible,.token:focus-visible,
.benchcard:focus-visible,.teampill:focus-visible,.addteam:focus-visible,.info:focus-visible,
.att:focus-visible,.shapebtn:focus-visible,.fix:focus-visible{outline:3px solid #1B7FD4;outline-offset:2px}

/* the ⓘ that opens a short explanation */
.info{width:26px;height:26px;border-radius:50%;border:1px solid var(--edge);color:var(--muted);
  font-size:13px;font-weight:700;line-height:1;flex:none;background:var(--card)}
.info[aria-expanded="true"]{background:var(--pitch);color:#fff;border-color:var(--pitch-dark)}
.help{margin:8px 0 0;padding:11px 13px;border-radius:10px;background:#F3F6F2;border:1px solid var(--edge);
  font-size:13px;line-height:1.5;color:var(--ink)}
.help b{display:block;margin-bottom:3px}
.headrow{display:flex;align-items:center;gap:6px;justify-content:space-between}
.headrow h2{flex:1;min-width:0}

/* ---------- roster rows ---------- */

.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
.prow{display:flex;align-items:center;gap:9px;padding:8px 10px;background:#F7F8F6;border:1px solid var(--edge);border-radius:9px}
.numbadge{min-width:30px;height:30px;padding:0 5px;border-radius:7px;background:var(--pitch);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.numbadge.blank{background:#C7CDC6;color:#5A625A}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}
.tgt{width:52px;padding:5px 6px;border:1px solid var(--edge);border-radius:7px;background:#fff;
  text-align:center;font-size:13px;flex:none}
.chk{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:560}
.chk input{width:20px;height:20px;accent-color:var(--pitch)}
.x{padding:5px 9px;color:var(--muted);font-size:19px;line-height:1;border-radius:6px}
.x:hover{background:#E8EAE6;color:var(--red)}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-bottom:12px}
.att{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;border:1.5px solid var(--edge);
  background:#F7F8F6;text-align:left;font-size:14.5px;font-weight:560}
.att[aria-pressed="true"]{border-color:var(--pitch);background:#E9F2EC}
.tick{width:19px;height:19px;border-radius:5px;border:1.5px solid #B9C0B8;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800}
.att[aria-pressed="true"] .tick{background:var(--pitch);border-color:var(--pitch)}
.gst{font-style:normal;font-size:8.5px;font-weight:800;color:#fff;background:var(--blue);
  border-radius:3px;padding:1px 3px;margin-left:3px;vertical-align:middle}

/* ---------- the clock ---------- */

.clockbar{position:sticky;top:0;z-index:30;background:var(--pitch);color:#fff;border-radius:13px;
  padding:11px 13px;margin-bottom:11px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(16,23,19,.16)}
.clockbar .time{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap;flex:none}
.clockbar .meta{flex:1;min-width:0;font-size:12.5px;opacity:.85;line-height:1.3}
.clockbar .meta b{display:block;font-size:13.5px;font-weight:650;opacity:1}
.clockbtn{padding:11px 16px;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;font-weight:650;
  border:1px solid rgba(255,255,255,.28);font-size:15px;flex:none}
.clockbtn.go{background:#fff;color:var(--pitch-dark)}
.fixrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:-4px 0 11px}
.fix{padding:5px 9px;border-radius:7px;font-size:12.5px;font-weight:620;background:var(--card);
  border:1px solid var(--edge);color:var(--muted)}
.fix.warn{background:var(--amber-bg);border-color:#E7C98E;color:#7A4E06}
.fixlbl{font-size:11px;color:var(--muted)}
.banner{background:var(--amber-bg);border:1px solid #E7C98E;color:#7A4E06;border-radius:10px;padding:9px 12px;
  font-size:14px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- our half of the pitch ---------- */

.pitch{position:relative;overflow:hidden;border-radius:13px;margin-bottom:12px;
  padding:16px 10px 26px;
  background:repeating-linear-gradient(0deg,var(--pitch) 0 34px,#2A6847 34px 68px)}
.pitch .field{position:absolute;inset:8px;border:2px solid var(--line);border-radius:4px;pointer-events:none}
/* the halfway line is the top edge; half the centre circle hangs below it */
.pitch .circle{position:absolute;left:50%;top:8px;width:30%;aspect-ratio:2/1;transform:translateX(-50%);
  border:2px solid var(--line);border-top:none;border-radius:0 0 999px 999px;pointer-events:none}
.pitch .box{position:absolute;left:50%;bottom:8px;width:62%;height:19%;max-height:100px;transform:translateX(-50%);
  border:2px solid var(--line);border-bottom:none;pointer-events:none}
.pitch .sixbox{position:absolute;left:50%;bottom:8px;width:30%;height:7%;max-height:36px;transform:translateX(-50%);
  border:2px solid var(--line);border-bottom:none;pointer-events:none}
.pitch .goal{position:absolute;left:50%;bottom:2px;width:14%;height:6px;transform:translateX(-50%);
  border:2px solid var(--line);border-bottom:none;pointer-events:none}
.prow-slots{position:relative;z-index:2;display:flex;align-items:flex-start;gap:0;margin-bottom:10px}
.prow-slots:last-child{margin-bottom:0}

/* a player as a shirt: name across the shoulders, number below */
.token{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none}
.token .pos{font-size:9.5px;font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.85)}
/* container-type lets the name and number scale with the shirt's own width
   (cqw units below) rather than with the surrounding font size */
.shirt{position:relative;width:58px;container-type:inline-size;
  --fill:#fff;--ring:rgba(0,0,0,.15);--ringw:1px}
.prow-slots.tight .shirt{width:46px}
.prow-slots.four .shirt{width:52px}
.shirt svg{display:block;width:100%;height:auto;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.22))}
.shirt svg path{fill:var(--fill);stroke:var(--ring);stroke-width:var(--ringw);stroke-linejoin:round;
  vector-effect:non-scaling-stroke}
.shirt.keeper{--fill:var(--keeper)}
.shirt.sel{--ring:#E8A800;--ringw:3px}
.shirt.empty svg path{fill:rgba(255,255,255,.16);stroke:rgba(255,255,255,.6);stroke-dasharray:4 3}
.shirt.empty.sel svg path{stroke:#E8A800;stroke-width:3px}
.shirt .nm,.shirt .no{position:absolute;left:50%;transform:translateX(-50%);text-align:center;
  color:var(--pitch-dark);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:clip}
.shirt .nm{top:26%;width:74%;font-size:13cqw;font-weight:700;letter-spacing:.02em}
.shirt .no{top:41%;width:58%;font-size:34cqw;font-weight:800;line-height:1}
.shirt .emptylbl{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:9px;font-weight:600;
  color:rgba(255,255,255,.85)}
.shirt .gst{position:absolute;top:-2px;right:-4px;margin:0}
/* OFF on the pitch, the position on the bench: one tag per planned pair */
.pairchip{position:absolute;top:-2px;left:-4px;font-size:8.5px;font-weight:800;color:#fff;
  padding:1px 4px;border-radius:999px;line-height:1.3}

/* the small white label under a shirt: minutes, bar, shift */
.tag{background:rgba(255,255,255,.95);border-radius:6px;padding:3px 4px;display:flex;flex-direction:column;
  align-items:center;gap:2px;min-width:0;width:calc(100% - 4px);max-width:74px}
.tag .mins{font-size:12px;font-weight:700;line-height:1.1;white-space:nowrap}
.tag .mins small{font-size:9px;font-weight:500;color:var(--muted)}
.tag .shift{font-size:8.5px;color:var(--muted);line-height:1.1;white-space:nowrap}
.tag .shift.long{color:var(--red);font-weight:700}
.tag .ingoal{font-size:9px;color:var(--muted);line-height:1.1}
.over{color:var(--amber)} .under{color:var(--blue)}

/* played against fair share: the fill is minutes, the mark is the share */
.bar{position:relative;display:block;width:100%;height:5px;border-radius:3px;background:#DEE2DD;margin:2px 0}
.bar i{display:block;height:100%;border-radius:3px;background:var(--pitch)}
.bar u{position:absolute;top:-2px;width:1.5px;height:9px;background:rgba(0,0,0,.5);text-decoration:none}
.bar.over i{background:var(--amber)} .bar.under i{background:var(--blue)}

/* ---------- shape, bench, planned subs ---------- */

.shaperow{display:flex;align-items:center;gap:5px;margin:0 0 12px;flex-wrap:wrap}
.shapelbl{font-size:12.5px;color:var(--muted)}
.shapebtn{padding:6px 10px;border-radius:7px;font-size:13px;font-weight:620;background:var(--card);
  border:1.5px solid var(--edge);color:var(--muted)}
.shapebtn.on{background:var(--pitch);border-color:var(--pitch-dark);color:#fff}

.benchhead{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.benchhead h2{font-size:15px}
.benchhead .hint{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.benchcard{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px;background:none}
.benchcard .shirt{width:54px;--ring:var(--edge)}
.benchcard.due .shirt{--ring:var(--blue);--ringw:2.5px}
.benchcard.sel .shirt{--ring:#E8A800;--ringw:2.5px}
.benchcard .mins{font-size:12px;font-weight:700;line-height:1.1;white-space:nowrap}
.benchcard .mins small{font-size:9px;font-weight:500;color:var(--muted)}
.benchcard .wait{font-size:9px;color:var(--muted);line-height:1.1;white-space:nowrap}
.benchcard .wait.due{color:var(--blue)}

.planentry{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.planentry .note{flex:1;min-width:120px}
.planrow{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:4px}
.planrow .pairdot{width:9px;height:9px;border-radius:50%;flex:none}
.planrow .arrow{color:var(--muted);font-weight:400}
.planrow .where{font-size:11px;color:var(--muted);font-weight:500}

.legend .samples{display:flex;gap:12px;margin-top:9px}
.legend .sample{flex:1;min-width:0}
.legend .sample b{display:block;font-size:12px;margin:4px 0 2px}
.legend .sample span{font-size:10.5px;color:var(--muted);line-height:1.35;display:block}
.legend summary{cursor:pointer;font-size:13.5px;font-weight:650;list-style:none}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:"▸ ";color:var(--muted)}
.legend[open] summary::before{content:"▾ "}

/* ---------- the score ---------- */

.score{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--edge);
  border-radius:13px;padding:10px 13px;margin-bottom:11px}
/* the score takes a whole row on a phone; on anything wider the buttons
   sit beside it when they fit */
.score .line{display:flex;align-items:center;gap:9px;flex:1 1 100%;min-width:0}
.score .line .info{margin-left:auto}
.score .who{font-size:13px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:0 1 auto;min-width:0}
.score .digits{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1;white-space:nowrap;flex:none}
.goalbtns{display:flex;gap:8px;flex:none}
.goalbtn{padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:650;background:#E4E7E2;
  border:1px solid var(--edge);white-space:nowrap;flex:none}
.goalbtn.us{background:var(--pitch);color:#fff;border-color:var(--pitch-dark)}
.goalbtn:focus-visible{outline:3px solid #1B7FD4;outline-offset:2px}
.goallist{width:100%;display:flex;flex-wrap:wrap;gap:5px}
.goalchip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 9px;border-radius:999px;
  font-size:12.5px;font-weight:600;background:#EAF2EC;border:1px solid #C9DCCF;color:var(--pitch-dark)}
.goalchip.them{background:#F6EEEE;border-color:#E2C4BE;color:var(--red)}
.goalchip .x{padding:0 5px;font-size:15px;color:inherit;opacity:.7}
.goalchip .x:hover{background:rgba(0,0,0,.06);opacity:1}
.scorer{width:100%;padding:10px 12px;border-radius:10px;background:#F3F6F2;border:1px solid var(--edge)}
.scorer .lbl{font-size:13px;font-weight:650;margin-bottom:7px}
.scorer .opts{display:flex;flex-wrap:wrap;gap:6px}
.results{display:flex;flex-direction:column;gap:4px;margin:4px 0 12px}
.result{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px solid #E7EAE6}
.result:last-child{border-bottom:none}
.result .date{color:var(--muted);font-size:12.5px;width:58px;flex:none}
.result .opp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}
.result .sc{font-weight:700;padding:1px 8px;border-radius:6px;background:#EEF0EB}
.result .sc.w{background:#E4F0E7;color:var(--pitch-dark)}
.result .sc.l{background:#F6E9E6;color:var(--red)}

/* a roster name is a field, so a player can be renamed in place */
.prow input.nm{padding:5px 8px;border:1px solid transparent;border-radius:7px;background:transparent;
  font-weight:560;width:100%}
.prow input.nm:hover{border-color:var(--edge)}
.prow input.nm:focus{background:#fff;border-color:var(--edge);outline:none}

/* ---------- tables ---------- */

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 5px;text-align:right;border-bottom:1px solid #E7EAE6;white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:650}
th:first-child,td:first-child{text-align:left;font-weight:600;position:sticky;left:0;background:var(--card)}
tbody tr:last-child td{border-bottom:none}
td.zero{color:#B4BAB3}
td.soft{color:var(--muted)}
td.over{color:var(--amber);font-weight:650} td.under{color:var(--blue);font-weight:650}

/* ---------- chrome ---------- */

#warn{background:var(--amber-bg);border:1px solid #E7C98E;color:#7A4E06;border-radius:11px;
  padding:11px 13px;font-size:13.5px;line-height:1.5;margin:0 auto 10px;max-width:640px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:9px;font-size:14px;font-weight:560;z-index:90;opacity:0;pointer-events:none;
  transition:opacity .18s;max-width:88vw;text-align:center}
.toast.show{opacity:.96}
.steps{display:flex;gap:5px;margin:8px 0 16px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--edge)}
.steps i.on{background:var(--pitch)}
/* ---------- wider screens: an iPad, or a laptop on the touchline ----------
   The game screen splits into two columns — clock, score and pitch on the
   left; shape, planned subs and bench on the right — so a substitution
   never needs a scroll. On a phone the wrappers vanish (display:contents)
   and everything stacks as before. */

.cols{display:contents}
@media (min-width:768px){
  .wrap,header,#warn{max-width:1180px}
  .wrap{padding:0 20px 90px}
  header{padding:10px 20px 0}
  .cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 20px}
  .cols>div{min-width:0}
  .attgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}
/* landscape iPad and laptops: room for bigger shirts */
@media (min-width:1000px){
  .shirt{width:70px} .prow-slots.four .shirt{width:64px} .prow-slots.tight .shirt{width:58px}
  .tag{max-width:88px}
  .tag .mins{font-size:13px} .tag .shift{font-size:9.5px}
  .benchcard .shirt{width:62px}
  .bench{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .pitch{padding:24px 14px 34px}
  .pitch .box{max-height:130px}
  .prow-slots{margin-bottom:18px}
  .clockbar .time{font-size:40px}
  .clockbar .meta{font-size:13.5px} .clockbar .meta b{font-size:14.5px}
  .score .digits{font-size:30px}
  .score .line{flex:1 1 260px}
  table{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header id="chrome">
  <div class="brand">Side<span>line</span></div>
  <div class="teams" id="teamBar" aria-label="Teams"></div>
  <nav role="tablist">
    <button role="tab" id="tab-game" aria-selected="true">Game</button>
    <button role="tab" id="tab-team" aria-selected="false">Team</button>
    <button role="tab" id="tab-stats" aria-selected="false">Minutes</button>
  </nav>
</header>

<div id="warn" hidden></div>

<div class="wrap">
  <section class="screen on" id="s-game"></section>
  <section class="screen" id="s-team"></section>
  <section class="screen" id="s-stats"></section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SLEngine = (() => {
/* Sideline — the engine, ported from the iOS app's Swift (Model/*.swift).
   No DOM in here: every number the page shows is derived from a small event
   log, so the same functions can be tested under Node.

   Two event kinds:
     stints — this player held this slot between these two clock times
     spells — this player was at the game between these two clock times

   Nothing is incremented on a tick. That is the whole trick behind the
   clock surviving a locked screen or a backgrounded tab: there is no
   counter to fall behind.

   Units: clock times and durations are SECONDS of game time. Wall-clock
   instants are milliseconds (Date.now()), and only `runStartedAt` holds one. */

const GROUPS = ['GK', 'DEF', 'MID', 'FWD'];
const SIZES = [5, 7, 9, 11];

/* ---------- formations: row -> [label, group], goalkeeper first ---------- */

const TABLE = {
  5: {
    '1-2-1': [[['GK', 'GK']], [['CB', 'DEF']], [['LM', 'MID'], ['RM', 'MID']], [['ST', 'FWD']]],
    '2-1-1': [[['GK', 'GK']], [['LB', 'DEF'], ['RB', 'DEF']], [['CM', 'MID']], [['ST', 'FWD']]],
    '2-2':   [[['GK', 'GK']], [['LB', 'DEF'], ['RB', 'DEF']], [['LS', 'FWD'], ['RS', 'FWD']]]
  },
  7: {
    '2-3-1':   [[['GK', 'GK']], [['LB', 'DEF'], ['RB', 'DEF']],
                [['LM', 'MID'], ['CM', 'MID'], ['RM', 'MID']], [['ST', 'FWD']]],
    '3-2-1':   [[['GK', 'GK']], [['LB', 'DEF'], ['CB', 'DEF'], ['RB', 'DEF']],
                [['LM', 'MID'], ['RM', 'MID']], [['ST', 'FWD']]],
    '2-1-2-1': [[['GK', 'GK']], [['LB', 'DEF'], ['RB', 'DEF']], [['CDM', 'MID']],
                [['LM', 'MID'], ['RM', 'MID']], [['ST', 'FWD']]],
    '3-1-2':   [[['GK', 'GK']], [['LB', 'DEF'], ['CB', 'DEF'], ['RB', 'DEF']],
                [['CM', 'MID']], [['LS', 'FWD'], ['RS', 'FWD']]]
  },
  9: {
    '3-3-2': [[['GK', 'GK']], [['LB', 'DEF'], ['CB', 'DEF'], ['RB', 'DEF']],
              [['LM', 'MID'], ['CM', 'MID'], ['RM', 'MID']], [['LS', 'FWD'], ['RS', 'FWD']]],
    '3-2-3': [[['GK', 'GK']], [['LB', 'DEF'], ['CB', 'DEF'], ['RB', 'DEF']],
              [['LCM', 'MID'], ['RCM', 'MID']],
              [['LW', 'FWD'], ['ST', 'FWD'], ['RW', 'FWD']]],
    '2-3-3': [[['GK', 'GK']], [['LB', 'DEF'], ['RB', 'DEF']],
              [['LM', 'MID'], ['CM', 'MID'], ['RM', 'MID']],
              [['LW', 'FWD'], ['ST', 'FWD'], ['RW', 'FWD']]],
    '3-4-1': [[['GK', 'GK']], [['LB', 'DEF'], ['CB', 'DEF'], ['RB', 'DEF']],
              [['LM', 'MID'], ['LCM', 'MID'], ['RCM', 'MID'], ['RM', 'MID']], [['ST', 'FWD']]]
  },
  11: {
    '4-4-2':   [[['GK', 'GK']], [['LB', 'DEF'], ['LCB', 'DEF'], ['RCB', 'DEF'], ['RB', 'DEF']],
                [['LM', 'MID'], ['LCM', 'MID'], ['RCM', 'MID'], ['RM', 'MID']],
                [['LS', 'FWD'], ['RS', 'FWD']]],
    '4-3-3':   [[['GK', 'GK']], [['LB', 'DEF'], ['LCB', 'DEF'], ['RCB', 'DEF'], ['RB', 'DEF']],
                [['LCM', 'MID'], ['CM', 'MID'], ['RCM', 'MID']],
                [['LW', 'FWD'], ['ST', 'FWD'], ['RW', 'FWD']]],
    '4-2-3-1': [[['GK', 'GK']], [['LB', 'DEF'], ['LCB', 'DEF'], ['RCB', 'DEF'], ['RB', 'DEF']],
                [['LDM', 'MID'], ['RDM', 'MID']],
                [['LAM', 'MID'], ['CAM', 'MID'], ['RAM', 'MID']], [['ST', 'FWD']]],
    '3-5-2':   [[['GK', 'GK']], [['LCB', 'DEF'], ['CB', 'DEF'], ['RCB', 'DEF']],
                [['LWB', 'MID'], ['LCM', 'MID'], ['CM', 'MID'], ['RCM', 'MID'], ['RWB', 'MID']],
                [['LS', 'FWD'], ['RS', 'FWD']]]
  }
};

function formationKeys(size) {
  return Object.keys(TABLE[size] || {}).sort();
}

function defaultKey(size) {
  switch (size) {
    case 5:  return '1-2-1';
    case 7:  return '2-3-1';
    case 9:  return '3-3-2';
    default: return '4-4-2';
  }
}

/** Rows of slots, goalkeeper row first. Slot IDs are stable within a shape
    and mean nothing across shapes. */
function rows(size, key) {
  const set = TABLE[size] || {};
  const shape = set[key] || set[defaultKey(size)] || [];
  return shape.map((row, r) => row.map(([label, group], c) => ({
    id: `r${r}s${c}`, label, group, row: r
  })));
}

function slots(size, key) {
  return rows(size, key).flat();
}

const slotsOf = g => slots(g.squadSize, g.formationKey);
const rowsOf  = g => rows(g.squadSize, g.formationKey);

/* ---------- minutes split by position ---------- */

const newGroupMinutes = () => ({ GK: 0, DEF: 0, MID: 0, FWD: 0 });
const groupTotal = gm => GROUPS.reduce((a, k) => a + (gm[k] || 0), 0);
const addGroupMinutes = (a, b) => {
  const out = newGroupMinutes();
  for (const k of GROUPS) out[k] = (a[k] || 0) + (b[k] || 0);
  return out;
};

/* ---------- the game ---------- */

let seq = 0;
/** UUID-shaped, so ids line up with the app's (which uses UUIDs) and nothing
    collides between devices sharing a team file. */
function uid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  seq += 1;
  return 'i' + Date.now().toString(36) + seq.toString(36) + Math.random().toString(36).slice(2, 7);
}

function makeGame({ squadSize = 7, formationKey, periods = 2, periodMinutes = 30,
                           checkedIn = [] } = {}) {
  return {
    id: uid(),
    date: new Date().toISOString(),
    stage: 'attendance',                 // attendance | lineup | live | done
    squadSize,
    formationKey: formationKey || defaultKey(squadSize),
    periods,
    periodMinutes,
    /** Clock seconds banked from every previous running interval. */
    accumulated: 0,
    /** Wall-clock ms the clock was last started; null while paused. */
    runStartedAt: null,
    guests: [],
    opponent: '',
    extraSeconds: [],                    // added time, per period
    checkedIn: checkedIn.slice(),
    stints: [],
    spells: [],
    goals: []                            // ours and theirs, each with the clock time
  };
}

function beginGame(team) {
  return makeGame({
    squadSize: team.squadSize,
    formationKey: team.formationKey,
    periods: team.periods,
    periodMinutes: team.periodMinutes,
    checkedIn: team.players.map(p => p.id)
  });
}

function fairnessRules(team) {
  const targets = {};
  for (const p of everyone(team)) if ((p.target || 0) > 0) targets[p.id] = p.target;
  return { excludeGK: team.excludeGK !== false, targets };
}

/** Roster plus anyone borrowed for the game in progress. */
function everyone(team) {
  const guests = team.game && team.game.guests ? team.game.guests : [];
  return guests.length ? team.players.concat(guests) : team.players;
}

/* ---------- the clock ---------- */

/** Cumulative end of each period, added time included. */
function periodEnds(g) {
  const out = [];
  let acc = 0;
  for (let i = 0; i < g.periods; i++) {
    acc += g.periodMinutes * 60 + (g.extraSeconds[i] || 0);
    out.push(acc);
  }
  return out;
}

const totalDuration = g => {
  const e = periodEnds(g);
  return e.length ? e[e.length - 1] : 0;
};

const isRunning = g => g.runStartedAt != null;

/** Seconds of game played so far. Never past full time, and while running
    never past the end of the period in play — the same boundary
    `settleBoundaries` parks on, so a tab read during the break shows 30:00. */
function elapsed(g, wallMs = Date.now()) {
  const live = g.runStartedAt == null ? 0 : (wallMs - g.runStartedAt) / 1000;
  const cap = g.runStartedAt == null
    ? totalDuration(g)
    : (periodEnds(g).find(e => e > g.accumulated + 0.5) ?? totalDuration(g));
  return Math.min(cap, Math.max(0, g.accumulated + live));
}

const isFullTime = (g, wallMs = Date.now()) => elapsed(g, wallMs) >= totalDuration(g);

function period(g, t) {
  const ends = periodEnds(g);
  for (let i = 0; i < ends.length; i++) if (t < ends[i]) return i + 1;
  return Math.max(1, ends.length);
}

function remainingInPeriod(g, t) {
  for (const end of periodEnds(g)) if (t < end) return end - t;
  return 0;
}

/** True when `t` sits (within half a second) on the end of a period. */
const isAtPeriodEnd = (g, t) => periodEnds(g).some(e => Math.abs(e - t) < 0.5);

/** Which period added time belongs to: normally the one in play, but with
    the clock stopped exactly on a boundary, the one that just ended. */
function addedTimePeriod(g, t) {
  const ends = periodEnds(g);
  if (!isRunning(g)) {
    const i = ends.findIndex(e => Math.abs(e - t) < 0.5);
    if (i >= 0 && i < ends.length - 1) return i;
  }
  return period(g, t) - 1;
}

function start(g, wallMs = Date.now()) {
  if (g.runStartedAt != null || isFullTime(g, wallMs)) return;
  g.runStartedAt = wallMs;
}

function pause(g, wallMs = Date.now()) {
  if (g.runStartedAt == null) return;
  g.accumulated = elapsed(g, wallMs);
  g.runStartedAt = null;
}

/** Stops the clock at the end of a period or at full time, banking exactly
    the playable seconds rather than the wall-clock gap. Returns true if it
    just stopped the clock, so the caller can blow the whistle. */
function settleBoundaries(g, wallMs = Date.now()) {
  if (g.runStartedAt == null) return false;
  const raw = g.accumulated + (wallMs - g.runStartedAt) / 1000;
  const ends = periodEnds(g);
  if (!ends.length) return false;
  const boundary = ends.find(e => e > g.accumulated + 0.5) ?? totalDuration(g);
  if (raw >= boundary) {
    g.accumulated = boundary;
    g.runStartedAt = null;
    return true;
  }
  return false;
}

/** Nudge the clock. Because elapsed is derived and stints live in clock
    coordinates, this shifts every player's minutes by the same amount. */
function nudge(g, seconds, wallMs = Date.now()) {
  if (g.runStartedAt != null) {
    const e = elapsed(g, wallMs);
    g.accumulated = e;
    g.runStartedAt = isAtPeriodEnd(g, e) ? null : wallMs;
  }
  const before = g.accumulated;
  let after = Math.max(0, Math.min(totalDuration(g), before + seconds));
  // Never run through a whistle: a forward nudge stops on the first period
  // end it reaches, and stops the clock there.
  if (after > before) {
    const end = periodEnds(g).find(e => e > before + 0.5);
    if (end != null && after >= end) {
      after = end;
      g.runStartedAt = null;
    }
  }
  g.accumulated = after;
}

/** Extend the period in play (or the one that just ended). */
function addTime(g, minutes, wallMs = Date.now()) {
  settleBoundaries(g, wallMs);
  const e = elapsed(g, wallMs);
  const i = addedTimePeriod(g, e);
  while (g.extraSeconds.length < g.periods) g.extraSeconds.push(0);
  if (i < 0 || i >= g.extraSeconds.length) return;
  // Added time already played can't be taken back: that would rewind the
  // clock and clip every open stint.
  const alreadyPlayed = Math.max(0, e - (periodEnds(g)[i] - g.extraSeconds[i]));
  const kept = Math.max(alreadyPlayed, g.extraSeconds[i] + minutes * 60);
  g.extraSeconds[i] = kept < 1 ? 0 : kept;
}

/** The referee blew early: jump a paused clock to the end of the period in
    play, so Resume starts the next one. */
function endPeriodNow(g) {
  if (g.runStartedAt != null || isFullTime(g) || isAtPeriodEnd(g, g.accumulated)) return;
  const end = periodEnds(g).find(e => e > g.accumulated + 0.5);
  if (end == null) return;
  g.accumulated = Math.min(totalDuration(g), end);
}

/* ---------- reading the field ---------- */

/** slotID -> playerID, from whichever stints are still open. */
function onField(g) {
  const out = {};
  for (const s of g.stints) if (s.end == null) out[s.slotID] = s.playerID;
  return out;
}

function slotOf(playerID, g) {
  const s = g.stints.find(s => s.playerID === playerID && s.end == null);
  return s ? s.slotID : null;
}

const covers = (sp, t) => t >= sp.from && (sp.to == null || t < sp.to);

/** Everyone available to play at `t`. Before kickoff nobody has a spell
    yet, so attendance is the authority. */
function available(g, t) {
  if (g.stage === 'attendance' || g.stage === 'lineup') return g.checkedIn.slice();
  const seen = new Set(), out = [];
  for (const sp of g.spells) {
    if (covers(sp, t) && !seen.has(sp.playerID)) { seen.add(sp.playerID); out.push(sp.playerID); }
  }
  return out;
}

function bench(g, t) {
  const on = new Set(Object.values(onField(g)));
  return available(g, t).filter(id => !on.has(id));
}

/** Anyone this game touched: still here, or here earlier. */
function participants(g, t) {
  const seen = new Set(), out = [];
  for (const sp of g.spells) {
    if (sp.from <= t && !seen.has(sp.playerID)) { seen.add(sp.playerID); out.push(sp.playerID); }
  }
  return out;
}

/* ---------- minutes ---------- */

/** Clipped at `now` even when closed, so "minutes at half time" is a real
    question and a backwards clock nudge can't credit anyone past the clock. */
const stintDuration = (s, now) => Math.max(0, Math.min(s.end ?? now, now) - s.start);

function played(playerID, g, t) {
  return g.stints.filter(s => s.playerID === playerID)
                 .reduce((a, s) => a + stintDuration(s, t), 0);
}

function playedByGroup(playerID, g, t) {
  const out = newGroupMinutes();
  for (const s of g.stints) if (s.playerID === playerID) out[s.group] += stintDuration(s, t);
  return out;
}

/** The stint that began a player's current unbroken run on the field, or
    null if they're on the bench. A shape change or a position swap closes
    one stint and opens the next at the same instant; the player never left
    the field, so the run carries on through it. Coming off ends it. */
function firstStintOfShift(playerID, g) {
  let first = g.stints.find(s => s.playerID === playerID && s.end == null);
  if (!first) return null;
  for (;;) {
    const earlier = g.stints.find(s => s.playerID === playerID &&
                                       s.end === first.start && s.start < first.start);
    if (!earlier) return first;
    first = earlier;
  }
}

function currentShift(playerID, g, t) {
  const s = firstStintOfShift(playerID, g);
  return s ? Math.max(0, t - s.start) : 0;
}

/** How long a player was at the game and available to be picked. */
function availableDuration(playerID, g, t) {
  return g.spells.filter(sp => sp.playerID === playerID)
                 .reduce((a, sp) => a + Math.max(0, Math.min(sp.to ?? t, t) - sp.from), 0);
}

/** Minutes that count toward fairness — keeper time optionally removed. */
function countedPlayed(playerID, g, t, rules) {
  const by = playedByGroup(playerID, g, t);
  const total = groupTotal(by);
  return rules.excludeGK ? Math.max(0, total - by.GK) : total;
}

/** Whoever is between the posts right now. */
function keeper(g) {
  const s = g.stints.find(s => s.end == null && s.group === 'GK');
  return s ? s.playerID : null;
}

/** Relative claim on the minutes for the people present in one segment.
    Everyone is equal unless a target is set; those who have one claim their
    target (stretched by `scale` over the time they're at the game), and the
    rest split the remainder of what the open slots hold over the whole game.
    With no targets this collapses back to an even split exactly. */
function fairWeights({ here, open, duration, rules, scale = {} }) {
  const capacity = duration * Math.max(1, open);
  const targets = rules.targets || {};
  const aimed = here.filter(p => (targets[p] || 0) > 0);
  const rest = here.length - aimed.length;
  const claimed = aimed.reduce((a, p) => a + (targets[p] || 0) * 60 * (scale[p] ?? 1), 0);
  // If the targets ask for more than the game holds, leave a sliver for
  // everyone else rather than going negative.
  const left = Math.max(capacity * 0.05, capacity - claimed);
  const average = rest === 0 ? 1 : left / rest;

  const w = {};
  for (const p of here) {
    const target = (targets[p] || 0) * 60 * (scale[p] ?? 1);
    w[p] = target > 0 ? target : average;
  }
  return w;
}

/** Splits `open` slots among `here` in proportion to weight, with nobody
    claiming more than one whole slot. Anything a capped player can't take is
    re-shared, so the slots stay fully allocated and sum(possible) stays
    equal to sum(played). */
function shares(open, here, weights) {
  const claims = {};
  let pool = here.slice();
  let slotsLeft = open;
  while (pool.length && slotsLeft > 0) {
    const sum = pool.reduce((a, p) => a + (weights[p] ?? 1), 0);
    if (!(sum > 0)) break;
    const capped = pool.filter(p => slotsLeft * (weights[p] ?? 1) / sum >= 1);
    if (!capped.length) {
      for (const p of pool) claims[p] = slotsLeft * (weights[p] ?? 1) / sum;
      break;
    }
    for (const p of capped) claims[p] = 1;
    slotsLeft -= capped.length;
    pool = pool.filter(p => !capped.includes(p));
  }
  return claims;
}

/** Minutes a player could reasonably have expected, split by position group
    — integrated over both who was available and what shape was on the field,
    so a formation change mid-game is accounted for.

    Summed across groups this is the same number as `fairShares`, and summed
    across players it equals the minutes actually played. */
function possibleByGroup(g, t, rules = { excludeGK: true, targets: {} }) {
  const out = {};
  if (!(t > 0)) return out;

  const cuts = new Set([0, t]);
  for (const sp of g.spells) {
    if (sp.from > 0 && sp.from < t) cuts.add(sp.from);
    if (sp.to != null && sp.to > 0 && sp.to < t) cuts.add(sp.to);
  }
  for (const st of g.stints) {                       // formation changes land here
    if (st.start > 0 && st.start < t) cuts.add(st.start);
    if (st.end != null && st.end > 0 && st.end < t) cuts.add(st.end);
  }
  const marks = [...cuts].sort((a, b) => a - b);
  const duration = totalDuration(g);

  // A target is minutes for the game, so it is stretched over the time that
  // player is (or was) actually here.
  const scale = {};
  for (const p of Object.keys(rules.targets || {})) {
    const planned = g.spells.filter(sp => sp.playerID === p)
      .reduce((a, sp) => a + Math.max(0, Math.min(sp.to ?? duration, duration) - sp.from), 0);
    if (planned > 0) scale[p] = duration / planned;
  }

  for (let i = 0; i < marks.length - 1; i++) {
    const a = marks[i], b = marks[i + 1], span = b - a;
    if (!(span > 0)) continue;
    const mid = a + span / 2;

    const counts = newGroupMinutes();                // reused as a slot tally
    let open = 0, keeperID = null;
    for (const st of g.stints) {
      if (!(st.start <= mid && (st.end ?? Infinity) > mid)) continue;
      if (st.group === 'GK') {
        keeperID = st.playerID;
        if (rules.excludeGK) continue;               // the goal isn't in the pool
      }
      counts[st.group] += 1;
      open += 1;
    }
    if (open === 0) continue;

    // Whoever is in goal isn't competing for outfield minutes, so they
    // accrue nothing while they're there.
    let here = available(g, mid);
    if (rules.excludeGK && keeperID) here = here.filter(p => p !== keeperID);
    if (!here.length) continue;

    const weights = fairWeights({ here, open, duration, rules, scale });
    const claims = shares(open, here, weights);

    for (const p of here) {
      const claim = claims[p] || 0;
      const gm = out[p] || (out[p] = newGroupMinutes());
      for (const grp of GROUPS) if (counts[grp] > 0) gm[grp] += span * claim * counts[grp] / open;
    }
  }
  return out;
}

/** Minutes a player was owed, integrated over who was actually available. */
function fairShares(g, t, rules = { excludeGK: true, targets: {} }) {
  const out = {};
  const by = possibleByGroup(g, t, rules);
  for (const id of Object.keys(by)) out[id] = groupTotal(by[id]);
  return out;
}

/* ---------- setting up ---------- */

/** Saved lineup first, then roster order for whatever's left. */
function autoFill(g, roster, usual = null) {
  const order = roster.map(p => p.id);
  const rank = id => {
    const i = order.indexOf(id);
    return i < 0 ? Number.MAX_SAFE_INTEGER : i;
  };
  let pool = g.checkedIn.slice().sort((a, b) => rank(a) - rank(b));
  g.stints = [];

  const placed = {};
  if (usual && usual.formationKey === g.formationKey) {
    for (const s of slotsOf(g)) {
      const pid = usual.slots[s.id];
      const at = pid ? pool.indexOf(pid) : -1;
      if (at >= 0) { placed[s.id] = pid; pool.splice(at, 1); }
    }
  }
  for (const s of slotsOf(g)) {
    const pid = placed[s.id] ?? (pool.length ? pool.shift() : null);
    if (pid) g.stints.push({ id: uid(), playerID: pid, slotID: s.id, group: s.group, start: 0, end: null });
  }
}

/** Freeze the current shape as this team's usual lineup. */
const captureLineup = g => ({ formationKey: g.formationKey, slots: onField(g) });

/** Borrow a player for this game only. */
function addGuest(g, { name, jersey = '', at = 0, live = false }) {
  const p = { id: uid(), name, jersey, isGuest: true };
  g.guests.push(p);
  if (live) g.spells.push({ id: uid(), playerID: p.id, from: at, to: null });
  else g.checkedIn.push(p.id);
  return p;
}

function kickoff(g) {
  g.spells = g.checkedIn.map(id => ({ id: uid(), playerID: id, from: 0, to: null }));
  g.stage = 'live';
}

/* ---------- substitutions ---------- */

function sub(g, { slotID, incoming, at }) {
  const s = slotsOf(g).find(s => s.id === slotID);
  if (!s) return;
  for (const st of g.stints) if (st.slotID === slotID && st.end == null) st.end = at;
  g.stints.push({ id: uid(), playerID: incoming, slotID, group: s.group, start: at, end: null });
}

/** Two slots trade occupants. Both stints are closed and reopened so
    position minutes split at exactly the right instant. One slot may be
    empty, which simply moves the other player across. */
function swapPositions(g, { slotA, slotB, at }) {
  const on = onField(g);
  const pa = on[slotA], pb = on[slotB];
  const sa = slotsOf(g).find(s => s.id === slotA);
  const sb = slotsOf(g).find(s => s.id === slotB);
  if (slotA === slotB || (!pa && !pb) || !sa || !sb) return false;
  for (const st of g.stints) {
    if (st.end == null && (st.slotID === slotA || st.slotID === slotB)) st.end = at;
  }
  if (pb) g.stints.push({ id: uid(), playerID: pb, slotID: slotA, group: sa.group, start: at, end: null });
  if (pa) g.stints.push({ id: uid(), playerID: pa, slotID: slotB, group: sb.group, start: at, end: null });

/** Change shape without anyone leaving the field. Players keep their role

  const previous = slotsOf(g);
  const on = onField(g);
  const pool = [];
  for (const s of previous) if (on[s.id]) pool.push({ group: s.group, player: on[s.id] });

  for (const st of g.stints) if (st.end == null) st.end = at;
  g.formationKey = key;

  const used = new Set();
  const assigned = [];
  const target = slotsOf(g);

  for (const s of target) {                          // same role first
    const i = pool.findIndex((c, idx) => !used.has(idx) && c.group === s.group);
    if (i >= 0) { used.add(i); assigned.push([s, pool[i].player]); }
  }
  for (const s of target) {
    if (assigned.some(([slot]) => slot.id === s.id)) continue;
    const i = pool.findIndex((c, idx) => !used.has(idx));
    if (i >= 0) { used.add(i); assigned.push([s, pool[i].player]); }
  }
  for (const [s, p] of assigned) {
    g.stints.push({ id: uid(), playerID: p, slotID: s.id, group: s.group, start: at, end: null });

        at.name = line.name;
        at.jersey = line.jersey;

    `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${SHIRT}"/></svg>` +
    label +
    (guest ? '<i class="gst">G</i>' : '') +
    (pair ? `<span class="pairchip" style="background:${pair}">${esc(pairText)}</span>` : '') +
    '</span>';
}

/* ---------- planned substitutions ---------- */

const PAIRS = ['var(--pair1)', 'var(--pair2)', 'var(--pair3)', 'var(--pair4)'];

/** The plan as the pitch and bench draw it: a colour per pair and the
    position each bench player is going into. A pair whose slot no longer
    exists (the shape changed under it) is dropped here. */
function plannedSubs() {
  const g = game();
  if (!g) return [];
  const labels = {};
  for (const s of E.slotsOf(g)) labels[s.id] = s.label;
  return plan.map((p, i) => (labels[p.slot] ? {
    slotID: p.slot, incoming: p.incoming, label: labels[p.slot], color: PAIRS[i % PAIRS.length]
  } : null)).filter(Boolean);
}

const plannedForSlot = id => plannedSubs().find(p => p.slotID === id) || null;
const plannedForPlayer = id => plannedSubs().find(p => p.incoming === id) || null;

/* ---------- the game screen ---------- */

function renderGame() {
  const el = document.getElementById('s-game');
  if (onboarding) { patch(el, onboardingHTML()); return; }
  const t = team(), g = t ? t.game : null;
  if (!t) { patch(el, ''); return; }

  if (!g) { patch(el, idleHTML(t)); return; }
  if (g.stage === 'done') {
    const sc = E.score(g);
    patch(el, `<div class="panel"><h2>Full time</h2>
      <div class="score" style="margin-top:10px"><div class="line"><span class="who">${esc(t.name)}</span>
        <span class="digits num">${sc.us} – ${sc.them}</span>
        <span class="who">${esc(g.opponent || 'Them')}</span></div></div>
      <div class="sub">Filed to ${esc(t.seasons.at(-1).name)}. Both this game and the season totals
      are on the Minutes tab.</div>
      <button class="btn primary wide" onclick="SL.newGame()">Start next game</button></div>`);
    return;
  }
  if (g.stage === 'attendance') { patch(el, attendanceHTML(t, g)); return; }

  const live = g.stage === 'live';
  const t0 = live ? E.elapsed(g) : 0;
  // Two columns on a wide screen, one stack on a phone (see .cols).
  let a = '', b = '';

  if (live) a += clockHTML(g, t0) + fixesHTML(g, t0) + scoreHTML(t, g, t0);
  else a += lineupHeaderHTML(t);

  a += pitchHTML(g, t0, live);
  if (live) a += legendHTML(t);
  b += shapeRowHTML(t, g);
  if (live) b += planBarHTML(g);
  b += benchHTML(g, t0, live);
  if (live && showRoster) b += rosterChangesHTML(t, g, t0);
  b += controlsHTML(live);
  patch(el, `<div class="cols"><div>${a}</div><div>${b}</div></div>`);
}

function idleHTML(t) {
  return `<div class="panel">
    <div class="headrow"><h2>${esc(t.name)}</h2>${info('squadSize')}</div>
    ${helpPanel('squadSize')}
    <div class="sub">${t.squadSize} on the field · ${t.periods}×${t.periodMinutes} min ·
      ${t.players.length} on the roster</div>
    ${t.players.length
      ? (t.players.length < t.squadSize
          ? `<div class="note" style="color:var(--amber);margin-bottom:10px">Only ${t.players.length}
             on the roster for ${t.squadSize} a side. You can still play — positions that can’t be
             filled stay empty.</div>` : '') +
        '<button class="btn primary wide" onclick="SL.newGame()">Start a game</button>'
      : '<div class="empty">Add your players on the Team tab first.</div>'}
    </div>`;
}

function attendanceHTML(t, g) {
  const short = g.checkedIn.length < t.squadSize;
  let h = `<div class="panel">
    <div class="headrow"><h2>Who’s here today?</h2>${info('guests')}</div>
    ${helpPanel('guests')}
    <div class="sub">Tap anyone who didn’t make it to take them out.</div><div class="attgrid">`;
  for (const p of E.everyone(t)) {
    const on = g.checkedIn.includes(p.id);
    h += `<button class="att" aria-pressed="${on}" onclick="SL.togglePresent('${p.id}')">
      <span class="tick">${on ? '✓' : ''}</span>
      <span>${esc(p.name)}${p.isGuest ? '<i class="gst">G</i>' : ''}
      ${p.jersey ? `<span class="num" style="color:var(--muted);font-size:12.5px">${esc(p.jersey)}</span>` : ''}
      </span></button>`;
  }
  h += `</div>
    <label class="field-lbl" for="oppo">Playing against (optional)</label>
    <input class="inp" id="oppo" value="${esc(g.opponent)}" placeholder="e.g. Concord Green"
      onchange="SL.setOpponent(this.value)" style="margin-bottom:11px">
    ${guestRowHTML(false)}
    ${short && g.checkedIn.length
      ? `<div class="note" style="color:var(--amber);margin-bottom:11px">Only ${g.checkedIn.length}
         of ${t.squadSize}. You can still go ahead — positions that can’t be filled stay empty.</div>` : ''}
    <div class="row">
      <button class="btn primary" onclick="SL.toLineup()">${g.checkedIn.length} here — set the lineup</button>
      <button class="btn danger" onclick="SL.scrapGame()">Cancel</button>
    </div></div>`;
  return h;
}

function guestRowHTML(live) {
  return `<div class="row" style="margin-bottom:8px">
      <input class="inp num" id="guestNum" placeholder="#" style="width:64px" inputmode="numeric">
      <input class="inp" id="guestName" placeholder="Guest player" style="flex:1;min-width:110px">
      <button class="btn sm" onclick="SL.addGuest(${live})">Add</button>
    </div>
    <div class="note" style="margin-bottom:11px">Guests play today only. They never join the roster.</div>`;
}

function lineupHeaderHTML(t) {
  const usual = t.defaultLineup && t.defaultLineup.formationKey === t.formationKey;
  return `<div class="panel">
    <div class="headrow"><h2>Starting lineup</h2>${info('usualLineup')}</div>
    ${helpPanel('usualLineup')}
    <div class="sub">${usual ? 'Filled from your usual lineup.' : 'Pre-filled in roster order.'}
      Tap two players to swap them, or a bench player then a position.</div>
    <div class="row">
      ${usual ? '<button class="btn sm" onclick="SL.autoFill(true)">Use usual</button>' : ''}
      <button class="btn sm" onclick="SL.autoFill(false)">Roster order</button>
      <button class="btn sm" onclick="SL.saveUsual()">Save as usual</button>
    </div></div>`;
}

function clockHTML(g, t0) {
  const full = t0 >= E.totalDuration(g);
  const running = E.isRunning(g);
  const n = E.period(g, t0), p = g.periods;
  const ordinal = ['First', 'Second', 'Third', 'Fourth'][Math.min(n, 4) - 1];
  const label = p === 2 ? (n === 1 ? 'First half' : 'Second half')
              : p === 3 ? `${ordinal} third`
              : p === 4 ? `${ordinal} quarter` : `Period ${n}`;
  return `<div class="clockbar">
    <div class="time num">${E.clockText(t0)}</div>
    <div class="meta"><b>${full ? 'Full time' : label}</b>
      ${full ? '' : `${E.clockText(E.remainingInPeriod(g, t0))} left in this one`}</div>
    <button class="clockbtn ${running ? '' : 'go'}" onclick="SL.clock()">
      ${full ? 'End game' : running ? 'Pause' : (t0 > 0 ? 'Resume' : 'Start')}</button>
  </div>`;
}

function fixesHTML(g, t0) {
  const i = E.addedTimePeriod(g, t0);
  const added = g.extraSeconds[i] || 0;
  const noun = g.periods === 2 ? 'half' : g.periods === 3 ? 'third' : g.periods === 4 ? 'quarter' : 'period';
  const ends = E.periodEnds(g);
  return `<div class="fixrow">
    ${info('clockFixes')}
    <button class="fix" onclick="SL.nudge(-30)">−30s</button>
    <button class="fix" onclick="SL.nudge(30)">+30s</button>
    ${!E.isRunning(g) && t0 < E.totalDuration(g) && !E.isAtPeriodEnd(g, t0)
      ? `<button class="fix" onclick="SL.endPeriod()">End ${noun} now</button>` : ''}
    <span class="fixlbl">clock</span>
    <button class="fix" onclick="SL.addTime(1)">+1 min</button>
    <button class="fix" onclick="SL.addTime(5)">+5 min</button>
    ${added > 0 && t0 < ends[i] - 0.5
      ? `<button class="fix warn" onclick="SL.addTime(${-added / 60})">${E.clockText(added)} added ×</button>` : ''}
    <span class="fixlbl">this period</span>
  </div>${helpPanel('clockFixes')}`;
}

/** The score, right under the clock: who's playing, the goals so far, and a
    button per side. Tapping ours asks who scored. */
function scoreHTML(t, g, t0) {
  const sc = E.score(g);
  const them = g.opponent || 'Them';
  let h = `<div class="score">
    <div class="line"><span class="who">${esc(t.name)}</span>
      <span class="digits num" aria-label="Score ${sc.us} to ${sc.them}">${sc.us} – ${sc.them}</span>
      <span class="who">${esc(them)}</span>${info('goals')}</div>
    <div class="goalbtns">
      <button class="goalbtn us" onclick="SL.goalFor()">+ Goal ${esc(shortName(t.name))}</button>
      <button class="goalbtn" onclick="SL.goalAgainst()">+ Goal ${esc(shortName(them))}</button>
    </div>`;
  if (scorerPick) h += scorerHTML(g, t0);
  if (g.goals.length) {
    h += '<div class="goallist">';
    for (const x of g.goals) {
      h += `<span class="goalchip ${x.ours ? '' : 'them'}"><span class="num">${E.clockText(x.at)}</span>
        ${esc(goalLabel(x, them))}
        <button class="x" aria-label="Remove this goal" onclick="SL.removeGoal('${x.id}')">×</button></span>`;
    }
    h += '</div>';
  }
  return h + '</div>' + helpPanel('goals');
}

/** "Lincoln Bobcats" -> "Bobcats", so the buttons fit on a phone. */
function shortName(name) {
  const words = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return 'Us';
  const last = words[words.length - 1];
  return last.length >= 3 ? last : words.join(' ');
}

/** "Cam (Luc)" for a goal with an assist, "Cam" without, "Us" if nobody's sure. */
function goalLabel(x, them) {
  if (!x.ours) return them;
  const who = x.scorer ? nameOf(x.scorer) : 'Us';
  return x.assist ? `${who} (${nameOf(x.assist)})` : who;
}

/** Who scored, then — with assists on — who set it up. Players on the field
    first, in pitch order, then the bench. */
function scorerHTML(g, t0) {
  const on = Object.values(E.onField(g));
  let ids = on.concat(E.available(g, t0).filter(id => !on.includes(id)));
  const assisting = !!scorerPick.scorer;
  if (assisting) ids = ids.filter(id => id !== scorerPick.scorer);
  const act = assisting ? 'SL.assistBy' : 'SL.goalBy';
  return `<div class="scorer"><div class="lbl">${assisting
      ? `Who assisted ${esc(nameOf(scorerPick.scorer))}?` : 'Who scored?'}
      <span class="num" style="color:var(--muted);font-weight:500">${E.clockText(scorerPick.at)}</span></div>
    <div class="opts">
      ${ids.map(id => `<button class="btn sm" onclick="${act}('${id}')">${esc(nameOf(id))}</button>`).join('')}
      <button class="btn sm" onclick="${act}(null)">${assisting ? 'No assist' : 'Not sure'}</button>
      <button class="btn sm" style="color:var(--muted)" onclick="SL.goalCancel()">Cancel</button>
    </div></div>`;
}

function pitchHTML(g, t0, live) {
  const fair = live ? E.fairShares(g, t0, rules()) : {};
  const rows = E.rowsOf(g);
  const widest = Math.max(...rows.map(r => r.length));
  const on = E.onField(g);
  let h = '<div class="pitch"><div class="field"></div><div class="circle"></div>' +
          '<div class="box"></div><div class="sixbox"></div><div class="goal"></div>';
  // forwards at the top by the halfway line, keeper at the bottom
  for (const row of [...rows].reverse()) {
    h += `<div class="prow-slots${widest >= 5 ? ' tight' : widest === 4 ? ' four' : ''}">`;
    for (const s of row) h += tokenHTML(s, on[s.id], g, t0, live, fair);
    h += '</div>';
  }
  return h + '</div>';
}

function tokenHTML(slot, pid, g, t0, live, fair) {
  const selected = sel && sel.kind === 'slot' && sel.id === slot.id;
  const pair = plannedForSlot(slot.id);
  const p = pid ? playerById(pid) : null;
  let h = `<button class="token" onclick="SL.tap('slot','${slot.id}')"
    aria-label="${esc(slot.label)}, ${p ? esc(p.name) : 'empty'}${pair ? ', planned to come off' : ''}">
    <span class="pos">${esc(slot.label)}</span>`;
  if (!p) {
    h += shirtHTML({ empty: true, selected, pair: pair ? pair.color : null, pairText: 'IN' });
    return h + '</button>';
  }
  h += shirtHTML({
    name: p.name, jersey: p.jersey, keeper: slot.group === 'GK', selected,
    guest: !!p.isGuest, pair: pair ? pair.color : null, pairText: 'OFF'
  });
  if (live) {
    const played = E.played(pid, g, t0);
    const counted = E.countedPlayed(pid, g, t0, rules());
    const owed = fair[pid] || 0;
    const inGoal = rules().excludeGK && slot.group === 'GK';
    const shift = E.currentShift(pid, g, t0);
    const long = team().longShiftMinutes > 0 && shift >= team().longShiftMinutes * 60;
    h += `<span class="tag">
      <span class="mins num ${inGoal ? '' : tone(counted, owed)}">${E.clockText(played)}
        ${p.target > 0 ? `<small>/${p.target}m</small>` : ''}</span>
      ${inGoal ? '<span class="ingoal">in goal</span>' : barHTML(counted, owed)}
      <span class="shift num ${long ? 'long' : ''}">shift ${E.clockText(shift)}</span>
    </span>`;
  }
  return h + '</button>';
}

const tone = (played, fair) => played > fair + 60 ? 'over' : played < fair - 60 ? 'under' : '';

function barHTML(played, fair) {
  const anchor = 62;                                  // where the mark sits, in %
  const ratio = fair > 1 ? played / fair : 0;
  const fill = Math.min(100, anchor * ratio);
  return `<span class="bar ${tone(played, fair)}"><i style="width:${fill.toFixed(1)}%"></i>` +
         `<u style="left:${anchor}%"></u></span>`;
}

function legendHTML(t) {
  const open = store.get('sideline.legend') !== 'shut';
  const sample = (label, played, note) => `<div class="sample">${barHTML(played, 600)}
    <b class="${tone(played, 600)}">${label}</b><span>${note}</span></div>`;
  return `<details class="panel legend"${open ? ' open' : ''} ontoggle="SL.legend(this.open)">
    <summary>What the bars mean ${info('pitch')}</summary>
    <div class="note" style="margin-top:8px">The fill is the minutes a player has played. The black
      mark is their fair share of the game so far: the minutes played so far, split evenly among
      everyone who has been here, for the time they were here.${t.excludeGK
        ? ' Time in goal counts for neither, so the keeper shows “in goal” instead of a bar.' : ''}
      A minutes target on the Team tab moves that player’s mark.</div>
    <div class="samples">
      ${sample('Owed', 300, 'More than a minute short of the mark. Bring them on first.')}
      ${sample('Even', 600, 'Within a minute of the mark.')}
      ${sample('Over', 900, 'More than a minute past the mark.')}
    </div>
    ${helpPanel('pitch')}
  </details>`;
}

function shapeRowHTML(t, g) {
  let h = `<div class="shaperow"><span class="shapelbl">Shape</span>${info('shape')}`;
  for (const k of E.formationKeys(t.squadSize)) {
    h += `<button class="shapebtn ${k === g.formationKey ? 'on' : ''}"
      onclick="SL.setFormation('${k}')">${k}</button>`;
  }
  return h + '</div>' + helpPanel('shape');
}

function planBarHTML(g) {
  const planned = plannedSubs();
  const on = E.onField(g);
  let h = `<div class="panel">
    <div class="headrow"><h2>Substitutions</h2>${info('plannedSubs')}</div>
    ${helpPanel('plannedSubs')}`;
  if (!planned.length) {
    h += `<div class="note">Tap a player on the pitch, then who comes on for them. Line up one change
      or several — each pair gets its own outline colour, and nothing changes until you tap Execute.</div>`;
  } else {
    for (const p of planned) {
      h += `<div class="planrow"><span class="pairdot" style="background:${p.color}"></span>
        <span>${esc(on[p.slotID] ? nameOf(on[p.slotID]) : 'Empty')}</span>
        <span class="arrow">→</span><span>${esc(nameOf(p.incoming))}</span>
        <span class="where">${esc(p.label)}</span></div>`;
    }
  }
  h += `<div class="row" style="margin-top:10px">
      <button class="btn primary" onclick="SL.executePlan()" ${planned.length ? '' : 'disabled'}>
        Execute ${planned.length === 1 ? '1 sub' : `${planned.length} subs`}</button>
      <button class="btn" onclick="SL.clearPlan()" ${planned.length ? '' : 'disabled'}>Clear</button>
    </div></div>`;
  return h;
}

function benchHTML(g, t0, live) {
  const r = rules();
  const fair = live ? E.fairShares(g, t0, r) : {};
  const counted = id => live ? E.countedPlayed(id, g, t0, r) : 0;
  const bench = E.bench(g, t0).slice()
    .sort((a, b) => ((fair[b] || 0) - counted(b)) - ((fair[a] || 0) - counted(a)));
  const hint = live
    ? (sel ? (sel.kind === 'bench' ? 'Now tap who they replace' : 'Now tap who comes on')
           : 'Pair a player on the pitch with their sub')
    : (sel ? (sel.kind === 'bench' ? 'Now tap a position' : 'Now tap who comes on')
           : 'Tap a player on, then a player off');

  let h = `<div class="benchhead"><h2>Bench</h2>${info('bench')}
    <span class="hint">${hint}</span></div>${helpPanel('bench')}`;
  if (!bench.length) return h + '<div class="empty">Everyone available is on the field.</div>';

  h += '<div class="bench">';
  for (const id of bench) {
    const p = playerById(id);
    const owed = fair[id] || 0, cnt = counted(id);
    const due = live && cnt < owed - 60;
    const selected = sel && sel.kind === 'bench' && sel.id === id;
    const pair = plannedForPlayer(id);
    h += `<button class="benchcard ${due ? 'due' : ''} ${selected ? 'sel' : ''}"
      onclick="SL.tap('bench','${id}')"
      aria-label="${esc(p ? p.name : 'Player')}, on the bench${pair ? `, planned to come on at ${esc(pair.label)}` : ''}">
      ${shirtHTML({ name: p ? p.name : '—', jersey: p ? p.jersey : '', selected,
                    guest: !!(p && p.isGuest), pair: pair ? pair.color : null,
                    pairText: pair ? pair.label : '' })}
      ${live ? `<span class="mins num ${tone(cnt, owed)}">${E.clockText(E.played(id, g, t0))}
          ${p && p.target > 0 ? `<small>/${p.target}m</small>` : ''}</span>
        ${barHTML(cnt, owed)}
        <span class="wait num ${due ? 'due' : ''}">${due
          ? `${E.clockText(owed - cnt)} owed` : `fair ${E.clockText(owed)}`}</span>` : ''}
    </button>`;
  }
  return h + '</div>';
}

function rosterChangesHTML(t, g, t0) {
  const here = E.available(g, t0);
  // Guests included, so one who left early can be brought back.
  const away = E.everyone(t).filter(p => !here.includes(p.id));
  let h = `<div class="panel" style="margin-top:14px">
    <div class="headrow"><h2>Who’s available</h2>${info('lateLeaving')}</div>
    ${helpPanel('lateLeaving')}
    <div class="sub">Add someone who turned up late, or take out anyone who has to go.</div>`;
  if (away.length) {
    h += '<div class="field-lbl">Not playing — tap to add</div><div class="attgrid">';
    for (const p of away) {
      h += `<button class="att" onclick="SL.arriveLate('${p.id}')">
        <span class="tick">+</span><span>${esc(p.name)}${p.isGuest ? '<i class="gst">G</i>' : ''}</span></button>`;
    }
    h += '</div>';
  }
  h += guestRowHTML(true);
  h += '<div class="field-lbl">Playing — tap to take out</div><div class="attgrid">';
  for (const id of here) {
    const p = playerById(id);
    h += `<button class="att" aria-pressed="true" onclick="SL.leaveEarly('${id}')">
      <span class="tick">✓</span><span>${esc(p ? p.name : '—')}${p && p.isGuest ? '<i class="gst">G</i>' : ''}</span></button>`;
  }
  return h + '</div></div>';
}

function controlsHTML(live) {
  if (!live) {
    return `<div class="row" style="margin-top:14px">
      <button class="btn primary" onclick="SL.kickoff()">Ready — go to the clock</button>
      <button class="btn" onclick="SL.backToAttendance()">Back</button></div>`;
  }
  return `<div class="row" style="margin-top:14px">
    <button class="btn ${showRoster ? 'primary' : ''}" onclick="SL.toggleRoster()">
      ${showRoster ? 'Done with roster' : 'Late or leaving'}</button>
    <button class="btn" onclick="SL.undo()" ${undoStack.length ? '' : 'disabled'}>Undo</button>
    <button class="btn danger" onclick="SL.endGame()">End game</button></div>`;
}

/* ---------- onboarding ---------- */

const SAMPLE = `4 Arjun
7 Theo
9 Marcus
11 Elias
14 Nico
16 Owen
21 Rafael
23 Dmitri
27 Kofi
30 Sebastian
33 Tomas
44 Caleb
52 Isaac`;

function onboardingHTML() {
  const o = onboarding;
  const steps = `<div class="steps">${[0, 1, 2, 3]
    .map(i => `<i class="${i <= o.step ? 'on' : ''}"></i>`).join('')}</div>`;
  let body = '';
  if (o.step === 0) {
    body = `<h2 style="font-size:22px">How many play at once?</h2>
      <div class="note" style="margin:6px 0 12px">Counting the goalkeeper. Each team you add keeps its own.</div>
      <div class="row">${E.SIZES.map(n => `<button class="btn ${o.size === n ? 'primary' : ''}"
        onclick="SL.ob('size',${n})">${n} v ${n}</button>`).join('')}</div>`;
  } else if (o.step === 1) {
    body = `<h2 style="font-size:22px">Starting shape</h2>
      <div class="note" style="margin:6px 0 12px">Switchable mid-game without anyone leaving the field.</div>
      ${E.formationKeys(o.size).map(k => `<button class="btn wide ${o.formation === k ? 'primary' : ''}"
        style="margin-bottom:7px;justify-content:flex-start"
        onclick="SL.ob('formation','${k}')">${k}
        <span style="opacity:.7;font-size:12px">${E.slots(o.size, k).map(s => s.label).join(' · ')}</span>
      </button>`).join('')}`;
  } else if (o.step === 2) {
    body = `<h2 style="font-size:22px">What’s the team called?</h2>
      <input class="inp" id="obName" value="${esc(o.name)}" placeholder="e.g. Riverside Rovers"
        style="margin:10px 0 14px" oninput="SL.ob('name',this.value)">
      <div class="field-lbl">Game format</div>
      <div class="row">${[2, 3, 4].map(n => `<button class="btn sm ${o.periods === n ? 'primary' : ''}"
        onclick="SL.ob('periods',${n})">${n === 2 ? '2 halves' : n === 3 ? '3 thirds' : '4 quarters'}</button>`).join('')}</div>
      <div class="row" style="margin-top:10px"><span class="note">Minutes each</span>
        <input class="inp num" type="number" min="5" max="45" value="${o.periodMinutes}"
          style="width:80px" oninput="SL.ob('periodMinutes',this.value)"></div>`;
  } else {
    const n = E.parseRoster(o.rosterText).length;

function thisGameHTML(t) {

/** Wins, draws and losses for the games that have a score. */
function recordText(s) {
  let w = 0, d = 0, l = 0;
  for (const g of s.games) {
    if (g.goalsFor == null) continue;
    if (g.goalsFor > g.goalsAgainst) w += 1; else if (g.goalsFor < g.goalsAgainst) l += 1; else d += 1;
  }
  return w + d + l ? ` — ${w} won, ${d} drawn, ${l} lost` : '';
}

const shortDate = iso => {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
};

function resultsHTML(s) {
  const games = s.games.filter(g => g.goalsFor != null)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
  if (!games.length) return '';
  return `<div class="results">${games.map(g => {
    const tn = g.goalsFor > g.goalsAgainst ? 'w' : g.goalsFor < g.goalsAgainst ? 'l' : '';
    return `<div class="result"><span class="date">${esc(shortDate(g.date))}</span>
      <span class="opp">${g.opponent ? 'v ' + esc(g.opponent) : 'Game'}</span>
      <span class="sc num ${tn}">${g.goalsFor} – ${g.goalsAgainst}</span></div>`;
  }).join('')}</div>`;
}

function tableHTML(rows, t) {
  const gp = rows.length && rows[0].games !== undefined;
  const ast = !!t.trackAssists || rows.some(r => r.assists);
  let h = `<div class="tablewrap"><table><thead><tr><th>Player</th>${gp ? '<th>GP</th>' : ''}
    <th>Goals</th>${ast ? '<th>Assists</th>' : ''}<th>Played</th><th>Poss.</th><th>Share</th><th>GK</th><th>Def</th><th>Mid</th><th>Fwd</th>
    </tr></thead><tbody>`;
  for (const r of rows) {
    const played = E.groupTotal(r.played), poss = E.groupTotal(r.possible);
    const share = r.share ?? (poss > 0 ? played / poss : 0);
    const tn = poss > 0 ? (share > 1.15 ? 'over' : share < 0.85 ? 'under' : '') : '';
    h += `<tr><td>${esc(r.name)}${r.guest ? '<i class="gst">G</i>' : ''}</td>
      ${gp ? `<td class="num">${r.games}</td>` : ''}
      <td class="num ${r.goals ? '' : 'zero'}">${r.goals || '–'}</td>
      ${ast ? `<td class="num ${r.assists ? '' : 'zero'}">${r.assists || '–'}</td>` : ''}
      <td class="num">${played < 1 ? '–' : E.minutesText(played)}</td>
      <td class="num soft">${poss < 1 ? '–' : E.minutesText(poss)}</td>
      <td class="num ${poss > 0 ? tn : ''}">${poss > 0 ? Math.round(share * 100) + '%' : '–'}</td>
      ${ratioCell(r.played.GK, r.possible.GK, t.excludeGK)}
      ${ratioCell(r.played.DEF, r.possible.DEF, false)}
      ${ratioCell(r.played.MID, r.possible.MID, false)}
      ${ratioCell(r.played.FWD, r.possible.FWD, false)}</tr>`;
  }
  return h + '</tbody></table></div>';
}

/** played over possible, so an unused position shows as 0.0/6.7. With keeper
    time kept out of the split there is no possible in goal, so that column is
    just time in goal. */
function ratioCell(played, possible, goalExcluded) {
  if (goalExcluded) {
    return `<td class="num ${played < 1 ? 'zero' : ''}">${played < 1 ? '–' : E.minutesText(played)}</td>`;
  }
  if (possible < 1 && played < 1) return '<td class="num zero">–</td>';
  return `<td class="num ${played < 1 ? 'over' : ''}">${E.minutesText(played)}/${E.minutesText(possible)}</td>`;
}

function download(name, text, type = 'text/plain') {
  const b = new Blob([text], { type });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
}

  'GK played,GK possible,Def played,Def possible,Mid played,Mid possible,Fwd played,Fwd possible\n';
const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';

function csvRow(name, jersey, games, played, possible, goals = 0, assists = 0) {
  const p = E.groupTotal(played), ps = E.groupTotal(possible);
  return `${q(name)},${q(jersey)},${games},${goals || 0},${assists || 0},${E.minutesText(p)},${E.minutesText(ps)},` +
    `${ps > 0 ? (p / ps).toFixed(3) : ''},` +
    `${E.minutesText(played.GK)},${E.minutesText(possible.GK)},` +
