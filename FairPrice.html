    return head + (S.draft ? `<p>The class ${pieceName()}, drafted by AI from your reasons, your clauses and your votes. Read it with a critical eye: what did it leave out or smooth over?</p><div class="draft">${esc(S.draft)}</div>` : `<section class="panel teal"><p>Your instructor is turning the class's reasons, clauses and votes into one ${pieceName()}. It will appear here.</p></section>`);
  }

  if (r === "red") {
    const mine = Object.values(resp("red")[ctx.pid] || {}).filter((x) => x && x.text);
    const all = shown ? loopholes() : [];
    return head + `<p><b>You now work for the seller's pricing team.</b> Find a way to keep charging different people different prices while obeying every word of this law.</p>` +
      (S.draft ? `<details open><summary><b>The class draft</b></summary><div class="draft" style="margin-top:.5rem">${esc(S.draft)}</div></details>` : `<p class="muted">The class draft has not been posted yet.</p>`) +
      `<section class="panel" style="margin-top:1rem"><h3>Our loophole</h3><textarea id="redText" data-bind="red.text" maxlength="${MAXLEN}" placeholder="The law says… so we would…"></textarea><p style="margin-top:.6rem"><button class="go" onclick="A.sendLoop()">Add loophole</button></p>` +
      (mine.length ? `<p class="small muted">Sent from this device:</p><ul class="loops">${mine.map((x) => `<li>${esc(x.text)}</li>`).join("")}</ul>` : "") + `</section>` +
      (shown ? `<section class="panel"><h2>Every loophole the class found (${all.length})</h2><ul class="loops">${all.map((x) => `<li>${esc(x.text)}</li>`).join("")}</ul></section>` : "");
  }
  if (r === "sign") {
    if (!S.draft) return head + `<section class="panel teal"><p>The final text has not been posted yet.</p></section>`;
    const names = signers(), cur = me && (me.v || 0) === draftV() ? me : null, stale = me && !cur && me.sign === true;
    let box;
    if (cur && cur.sign === true) box = `<section class="panel teal"><h2>You signed</h2><p>Your name appears under the ${pieceName()} as <b>${esc(cur.name)}</b>, and you will be copied when it is sent.</p><button class="secondary" onclick="A.unsign()">Remove my signature</button></section>`;
    else if (cur && cur.sign === false) box = `<section class="panel"><h2>You chose not to sign</h2><p>That is a legitimate choice, and it is not shown to the class.</p><button class="secondary" onclick="A.unsign()">I changed my mind</button></section>`;
    else box = `<section class="panel gold"><h2>Will you put your name on this?</h2>${stale ? `<p class="warn">The text changed after you signed. Read it again, then sign again if you still agree.</p>` : ""}
      <p>Signing is your choice. You sign as yourself, not for Brandeis. If you sign, your name goes under the text and your email address is copied when it is sent.</p>
      <h3>Your full name, as it should appear</h3><input id="signName" type="text" maxlength="60" data-bind="sign.name" autocomplete="name">
      <h3>Your email address</h3><input id="signEmail" type="text" inputmode="email" maxlength="100" data-bind="sign.email" autocomplete="email" autocapitalize="off">
      <p id="signErr" class="warn small"></p><div class="row"><button class="go" onclick="A.sign(true)">Sign it</button><button class="secondary" onclick="A.sign(false)">I'd rather not sign</button></div></section>`;
    return head + `<p>Read the final ${pieceName()} before you decide.</p><div class="draft">${esc(signedText())}</div><div style="height:1rem"></div>` + box;
  }
  return head;
}

function joinURL() { return (location.host + location.pathname).replace(/\/index\.html$/, "/") + "?code=" + ctx.code; }
function hostHTML() {

  h += `<section class="hero ${r === "lobby" ? "lobby" : ""}"><div><div class="lab">Join at</div><div class="url">${esc(joinURL())}</div></div><div style="text-align:right"><div class="lab">Session code</div><div class="bigcode">${esc(ctx.code)}</div></div></section>`;
  h += `<nav class="rounds" aria-label="Rounds"><button class="${r === "lobby" ? "on" : ""}" onclick="A.go('lobby')">Lobby</button>${ROUNDS.map((x, k) => `<button class="${x.id === r ? "on" : ""}" onclick="A.go('${x.id}')"><span class="n">${k + 1}</span>${esc(x.name)}</button>`).join("")}</nav>`;
  h += `<section class="panel">${hostPanel(r, n)}</section>`;
  const next = ROUNDS[i + 1];
  h += `<div class="row spread">${next ? `<button onclick="A.go('${next.id}')">${r === "lobby" ? "Start round 1" : "Next round"}: ${esc(next.name)} →</button>` : "<span></span>"}<span class="row">${r !== "lobby" && r !== "prompt" ? `<button class="link small" onclick="A.clearRound('${r}')">Clear this round's answers</button>` : ""}<button class="link small" onclick="A.exportData()">Download session data</button></span></div>`;
  return h;
}
function statusLine(r, n) {
  const got = Object.keys(resp(r)).length, miss = Object.keys(players()).filter((p) => !resp(r)[p]).map((p) => players()[p].name);
  return `<div class="row spread" style="margin:.6rem 0"><div class="count">${got}<small>of ${n} in</small></div><div class="row">${miss.length && got ? `<button class="link small" onclick="A.ui('missing')">${hostUI.missing ? "Hide" : "Who's missing?"}</button>` : ""}<button class="${revealed(r) ? "secondary" : "go"}" onclick="A.reveal('${r}',${!revealed(r)})">${revealed(r) ? "Hide results" : "Show results"}</button></div></div>` +
    (hostUI.missing && miss.length && got ? `<p class="small muted">Not in yet: ${miss.map(esc).join(", ")}</p>` : "");
}
function ballotEditor() {
  return `<p class="muted small">Untick duplicates or blanks to keep them off the ballot. Students never see names.</p><p><button class="link small" onclick="A.ui('names')">${hostUI.names ? "Hide names" : "Show names"}</button></p>` +
    FIELDS.map((f) => { const cs = clauses(f.id, true); return `<h3>${esc(f.t)} <span class="muted small">(${cs.filter((c) => !c.off).length} on the ballot)</span></h3>` + (cs.map((c) => `<div class="clause ${c.off ? "off" : ""}"><div><div class="txt">${esc(c.text)}</div>${hostUI.names ? `<div class="who">${esc((players()[c.pid] || {}).name || "?")}</div>` : ""}</div><label class="small"><input type="checkbox" ${c.off ? "" : "checked"} onchange="A.ballot('${f.id}','${c.pid}',this.checked)"> on ballot</label></div>`).join("") || `<p class="muted">None yet.</p>`); }).join("");
}
function hostPanel(r, n) {
  const meta = ROUNDS.find((x) => x.id === r), k = ROUNDS.indexOf(meta) + 1;
  const head = meta ? `<div class="tag">Round ${k} of ${ROUNDS.length}</div><h1>${esc(meta.name)}</h1>` : "";
  if (r === "lobby") return `<h1>Join the session</h1><div class="count">${n}<small>${n === 1 ? "student has" : "students have"} joined</small></div><p class="muted" style="margin-top:.6rem">${Object.values(players()).map((p) => esc(p.name)).join(" · ") || "Students open the address above on a phone or laptop and enter the code."}</p>`;
  if (r === "poll1") return head + `<p>Is personalized pricing unfair? Should we ban it?</p>` + statusLine(r, n) + (revealed(r) ? pollResults(r) : "");
  if (r === "poll2") return head + `<p>The same two questions as the opening poll.</p>` + statusLine(r, n) + (revealed(r) ? revoteResults() : "");
  if (r === "sort") return head + `<p>Students drag eight kinds of price differences into order, fairest first, then mark where fair ends and unfair begins.</p>` + statusLine(r, n) + (revealed(r) ? sortResults() : `<p class="muted">${CASES.map((c) => esc(c.t)).join(" · ")}</p>`);
  if (r === "frame") {
    const as = Object.values(S.frameAssign || {}), a = as.filter((v) => v === "A").length, b = as.filter((v) => v === "B").length;
    return head + `<p>Each student is rating one pricing policy on a 1 to 5 fairness scale.</p>` + statusLine(r, n) + (revealed(r) ? frameResults() : `<p class="muted">The room is split into two groups of ${a} and ${b}. What each group is reading stays hidden until you show results.</p>`);
  }
  if (r === "law") {
    const got = Object.keys(resp(r)).length;
    return head + `<p>Each student says why a law is needed, then writes it in four sections: what's covered, the rule, exemptions, enforcement. This round can stay open between classes; students rejoin with the same code and name.</p>
      <div class="row spread" style="margin:.6rem 0"><div class="count">${got}<small>of ${n} drafts in</small></div><button class="secondary" onclick="A.ui('drafts')">${hostUI.drafts ? "Hide drafts" : "Review drafts and build the ballot"}</button></div>` + (hostUI.drafts ? ballotEditor() : "");
  }
  if (r === "vote") {
    const div = revealed(r) ? mostDivided() : [];
    return head + `<p>Students tick every reason and clause they want the class to use.</p>` + statusLine(r, n) +
      (revealed(r) ? (div.length ? `<div class="panel gold"><div class="tag">Most divided</div>${div.map((x) => `<p style="margin:.4rem 0"><b>${x.share}% kept it</b> · ${esc(x.f.t)}: ${esc(x.c.text)}</p>`).join("")}</div>` : "") + voteResults()
        : `<p class="muted">${FIELDS.map((f) => esc(f.t) + ": " + clauses(f.id).length).join(" · ")} clauses on the ballot.</p><p><button class="link small" onclick="A.ui('drafts')">${hostUI.drafts ? "Hide ballot editor" : "Edit the ballot"}</button></p>` + (hostUI.drafts ? ballotEditor() : ""));
  }
  if (r === "prompt") {
    const oped = fmt() === "oped";
    return head + `<p><b>Step 1.</b> Choose what the class is writing.</p><div class="seg"><button class="${oped ? "" : "on"}" onclick="A.format('email')">Email to our legislators</button><button class="${oped ? "on" : ""}" onclick="A.format('oped')">Op-ed for the Boston Globe</button></div>
      <p style="margin-top:1.2rem"><b>Step 2.</b> Copy this prompt and paste it into the AI of your choice. This page builds it from the students' reasons and clauses, the round 6 vote counts, and the class results from rounds 1 to 4.</p><pre class="prompt" id="promptBox">${esc(buildPrompt())}</pre><p><button onclick="A.copy('prompt')">Copy prompt</button> <span id="copied_prompt" class="ok"></span></p>
      <p style="margin-top:1.2rem"><b>Step 3.</b> Paste the AI's ${pieceName()} here to put it on every student's screen. Leave out the discussion lists the AI adds after it.</p><textarea id="draftText" data-bind="h.draft" style="min-height:9rem" placeholder="Paste the ${pieceName()} here"></textarea>
      <p style="margin-top:.6rem"><button class="go" onclick="A.postDraft()">${S.draft ? "Replace the class draft" : "Show draft to the class"}</button></p>` +
      (S.draft ? `<h3>The class draft</h3><div class="draft">${esc(S.draft)}</div>` : "");
  }
  if (r === "red") {
    const all = loopholes();
    return head + `<p>Students play the seller's pricing team: obey every word of the law and still charge people different prices.</p>
      <div class="row spread" style="margin:.6rem 0"><div class="count">${all.length}<small>${all.length === 1 ? "loophole" : "loopholes"} found</small></div><button class="${revealed(r) ? "secondary" : "go"}" onclick="A.reveal('red',${!revealed(r)})">${revealed(r) ? "Hide loopholes" : "Show loopholes"}</button></div>` +
      (revealed(r) ? `<ul class="loops">${all.map((x) => `<li>${esc(x.text)}</li>`).join("")}</ul>` : "") +
      (S.draft ? `<details ${revealed(r) ? "" : "open"}><summary><b>The class draft</b></summary><div class="draft" style="margin-top:.5rem">${esc(S.draft)}</div></details>` : `<p class="warn">No class draft posted yet. Go back to round 7 to paste one in.</p>`);
  }
  if (r === "sign") {
    const g = signers(), R = resp("sign"), answered = Object.keys(R).filter((p) => R[p] && (R[p].v || 0) === draftV()).length, cc = ccList();
    return head + `<p>Students read the final ${pieceName()} on their phones and decide whether to add their name. Signing is optional, and the screen never shows who declined.</p>
      <div class="row spread" style="margin:.6rem 0"><div class="count">${g.length}<small>signed · ${answered} of ${n} have answered</small></div><button class="secondary" onclick="A.ui('edit')">${hostUI.edit ? "Close the editor" : "Edit the text"}</button></div>` +
      (hostUI.edit ? `<textarea id="draftText" data-bind="h.draft" style="min-height:9rem"></textarea><p style="margin:.6rem 0 1rem"><button class="go" onclick="A.postDraft()">Replace the text</button> <span class="muted small">Changing the text clears every signature. Students are asked to read it and sign again.</span></p>` : "") +
      (S.draft ? `<div class="draft" id="signedBox">${esc(signedText())}</div>
        <p style="margin-top:.6rem"><button onclick="A.copy('signed')">Copy text with signatures</button> <span id="copied_signed" class="ok"></span></p>
        <h3>Addresses to cc (${cc.length})</h3><p class="muted small">The signers' email addresses, ready to paste into the cc line. They stay hidden unless you show them, because this screen is usually projected.</p>
        <p><button onclick="A.copy('cc')">Copy cc list</button> <button class="secondary" onclick="A.ui('cc')">${hostUI.cc ? "Hide addresses" : "Show addresses"}</button> <span id="copied_cc" class="ok"></span></p>` +
        (hostUI.cc ? `<pre class="prompt" id="ccBox">${esc(cc.join(", ")) || "No signatures yet."}</pre>` : "")
        : `<p class="warn">No text posted yet. Go back to round 7 to paste one in.</p>`);
  }
  return head;
}

/* =====================================================================
   SCREENS BEFORE A SESSION

function landing(msg) {
  ctx = null; S = {}; lastHTML = null; $("who").innerHTML = "";
  const code = (new URLSearchParams(location.search).get("code") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  $("app").className = "";
  $("app").innerHTML = `<h1>Is that a fair price?</h1><p>A class activity on personalized pricing: vote, compare, then write the law yourselves.</p>
    ${msg ? `<p class="warn">${esc(msg)}</p>` : ""}
    <section class="panel gold"><h2>Join your class</h2>
      <div class="row"><input id="joinCode" class="code" type="text" maxlength="4" placeholder="CODE" value="${esc(code)}" autocomplete="off" autocapitalize="characters" style="max-width:8.5em" aria-label="Session code">
      <input id="joinName" type="text" maxlength="24" placeholder="First name and last initial" autocomplete="off" style="flex:1;min-width:11em" aria-label="Your name"></div>
      <p id="joinErr" class="warn small"></p><button class="big go" onclick="A.join()">Join</button>
      <p class="small muted" style="margin-top:.6rem">Coming back for another class? Use the same code and the same name to pick up where you left off.</p></section>
    <div class="row spread"><button class="secondary" onclick="A.hostSetup()">Run a session (instructor)</button><button class="secondary" onclick="A.demo()">Preview with a simulated class</button></div>`;
}
function hostSetupScreen(msg) {
  const last = lsGet(LS_HOST);
  $("app").innerHTML = `<h1>Run a session</h1>${msg ? `<p class="warn">${esc(msg)}</p>` : ""}
    <section class="panel"><h2>Start a new session</h2><p>You get a four-letter code. Students open this same page, enter the code and their name, and you decide when each of the nine rounds opens and when results appear.</p><button class="go" onclick="A.hostNew()">Start a new session</button></section>
    <section class="panel"><h2>Reopen an earlier session</h2><p>For the second class, or after closing this tab. Everything students submitted is still there.</p>
      <div class="row"><input id="resumeCode" class="code" type="text" maxlength="4" placeholder="CODE" value="${esc(last || "")}" autocomplete="off" autocapitalize="characters" style="max-width:8.5em" aria-label="Session code"><button onclick="A.hostResume()">Reopen</button></div></section>
    <button class="link" onclick="A.leave()">← Back</button>`;
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
const A = {
  /* ---- joining and hosting ---- */
  async join() {
    const code = $("joinCode").value.toUpperCase().replace(/[^A-Z]/g, ""), name = $("joinName").value.trim().replace(/\s+/g, " ");
    const err = (m) => { $("joinErr").textContent = m; };
    if (code.length !== 4) return err("Enter the four-letter code on the screen.");
    if (name.length < 2) return err("Enter your first name and last initial.");
    try {
      store = fbStore();
      const path = "games/" + PREFIX + code;
      if (!(await store.get(path + "/created"))) return err("No session with the code " + code + ". Check the screen and try again.");
      const P = (await store.get(path + "/players")) || {};
      let pid = Object.keys(P).find((p) => P[p] && P[p].key === norm(name));
      if (!pid) { pid = rid("p"); await store.set(path + "/players/" + pid, { name, key: norm(name), joined: Date.now() }); }
      ctx = { role: "student", code, pid, name: (P[pid] && P[pid].name) || name };
      lsSet(LS_STU, ctx);
      connect();
    } catch (e) { err("Couldn't join: " + e.message); }
  },
  hostSetup() { hostSetupScreen(); },
  async hostNew() {
    try {
      store = fbStore();
      const L = "ABCDEFGHJKMNPQRSTUVWXYZ"; let code = "";
      for (let t = 0; t < 30 && !code; t++) { const c = Array.from({ length: 4 }, () => L[Math.floor(Math.random() * L.length)]).join(""); if (!(await store.get("games/" + PREFIX + c + "/created"))) code = c; }
      if (!code) throw new Error("couldn't find a free code");
      ctx = { role: "host", code };
      await store.set(base(), { created: Date.now(), round: "lobby" });
      lsSet(LS_HOST, code);
      connect();
    } catch (e) { hostSetupScreen("Couldn't start a session: " + e.message); }
  },
  async hostResume(auto) {
    const code = (auto || $("resumeCode").value).toUpperCase().replace(/[^A-Z]/g, "");
    try {
      store = fbStore();
      if (code.length !== 4 || !(await store.get("games/" + PREFIX + code + "/created"))) { lsDel(LS_HOST); return hostSetupScreen("No session with the code " + (code || "(blank)") + "."); }
      ctx = { role: "host", code }; lsSet(LS_HOST, code); connect();
    } catch (e) { hostSetupScreen("Couldn't reopen: " + e.message); }
  },
  leave(msg) {
    if (unsub) unsub(); unsub = null;
    if (unsubCC) unsubCC(); unsubCC = null; CC = {};
    if (ctx && !ctx.demo) { if (ctx.role === "student") lsDel(LS_STU); }
    Object.keys(local).forEach((k) => delete local[k]); Object.keys(seeded).forEach((k) => delete seeded[k]);
    const wasHost = ctx && ctx.role === "host" && !ctx.demo;
    ctx = null; banner("");
    if (wasHost) { sessionStorage.setItem("fairprice.noresume", "1"); }
    landing(typeof msg === "string" ? msg : "");
  },

  /* ---- instructor controls ---- */
  async go(r) {
    const up = { round: r };
    if (r === "frame") {
      const have = S.frameAssign || {}, need = Object.keys(players()).filter((p) => !have[p]);
      let a = Object.values(have).filter((v) => v === "A").length, b = Object.values(have).filter((v) => v === "B").length;
      need.sort(() => Math.random() - 0.5).forEach((p) => { const v = a < b ? "A" : b < a ? "B" : Math.random() < 0.5 ? "A" : "B"; up["frameAssign/" + p] = v; v === "A" ? a++ : b++; });
    }
    hostUI.missing = false; hostUI.drafts = false; hostUI.edit = false; hostUI.cc = false;
    if ((r === "prompt" || r === "sign") && S.draft) local["h.draft"] = S.draft;
    await store.update(base(), up);
    window.scrollTo(0, 0);
  },
  reveal(r, on) { store.set(base() + "/reveal/" + r, on ? true : null); },
  ui(k) { hostUI[k] = !hostUI[k]; render(); },
  ballot(f, pid, on) { store.set(base() + "/off/" + f + "/" + pid, on ? null : true); },
  async clearRound(r) {
    if (!confirm("Delete every answer in this round for the whole class?")) return;
    const up = { ["r/" + r]: null, ["reveal/" + r]: null };
    if (r === "frame") up.frameAssign = null;
    if (r === "law") up.off = null;
    if (r === "sign") await store.set(ccPath(), null);
    await store.update(base(), up);
    if (r === "frame") A.go("frame");
  },
  async copy(kind) {
    const t = kind === "cc" ? ccList().join(", ") : kind === "signed" ? signedText() : buildPrompt();
    try { await navigator.clipboard.writeText(t); }
    catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    const el = $("copied_" + kind); if (el) el.textContent = "Copied.";
  },
  format(f) { store.set(base() + "/format", f === "oped" ? "oped" : "email"); },
  async postDraft() {
    const t = (local["h.draft"] || "").trim().slice(0, 9000); if (!t || t === S.draft) return;
    if (signers().length && !confirm("Changing the text clears every signature. Students will be asked to sign again. Continue?")) return;
    await store.update(base(), { draft: t, draftV: draftV() + 1 });
    hostUI.edit = false; render();
  },
  exportData() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "fair-price-" + ctx.code + ".json"; document.body.appendChild(a); a.click(); a.remove();
  },

  /* ---- student answers ---- */
  pick(k, v) { local[k] = v; lastHTML = null; render(); },
  tick(k, on) { if (on) local[k] = true; else delete local[k]; lastHTML = null; render(); },
  sendPoll(r) { const v = {}; POLL.forEach((q) => { v[q.id] = local[r + "." + q.id]; }); store.set(base() + "/r/" + r + "/" + ctx.pid, v); },
  move(id, d) {
    const o = local["sort.order"], i = o.indexOf(id), j = i + d; if (i < 0 || j < 0 || j >= o.length) return;
    o.splice(i, 1); o.splice(j, 0, id); if (id === "LINE") local["sort.lineMoved"] = true;
    lastHTML = null; render();
  },
  sendSort() { const o = local["sort.order"]; store.set(base() + "/r/sort/" + ctx.pid, { o: o.filter((x) => x !== "LINE").join(","), line: o.indexOf("LINE") }); },
  async sign(yes) {
    const name = (local["sign.name"] || "").trim().replace(/\s+/g, " ").slice(0, 60), email = (local["sign.email"] || "").trim();
    if (yes) {
      const err = (m) => { const e = $("signErr"); if (e) e.textContent = m; };
      if (name.length < 3) return err("Enter your full name.");
      if (!/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(email)) return err("Enter a valid email address.");
      await store.set(ccPath() + "/" + ctx.pid, { email });
      await store.set(base() + "/r/sign/" + ctx.pid, { sign: true, name, v: draftV(), t: Date.now() });
    } else {
      await store.set(ccPath() + "/" + ctx.pid, null);
      await store.set(base() + "/r/sign/" + ctx.pid, { sign: false, v: draftV(), t: Date.now() });
    }
  },
  async unsign() { await store.set(ccPath() + "/" + ctx.pid, null); await store.set(base() + "/r/sign/" + ctx.pid, null); },
  sendFrame() { store.set(base() + "/r/frame/" + ctx.pid, { v: S.frameAssign[ctx.pid], rating: +local["frame.rating"] }); },
  async assignMe() {
    if (A._assigning) return; A._assigning = true;
    const as = Object.values(S.frameAssign || {}), a = as.filter((v) => v === "A").length, b = as.length - a;
    try { await store.set(base() + "/frameAssign/" + ctx.pid, a < b ? "A" : b < a ? "B" : Math.random() < 0.5 ? "A" : "B"); } finally { A._assigning = false; }
  },
  async sendLaw() {
    const v = { t: Date.now() }; FIELDS.forEach((f) => { v[f.id] = (local["law." + f.id] || "").trim().slice(0, MAXLEN); });
    if (FIELDS.some((f) => !v[f.id])) return;
    await store.set(base() + "/r/law/" + ctx.pid, v);
    lsDel(LS_LAW); lawStatus();
  },
  sendVote() {
    const v = { t: Date.now() };
    FIELDS.forEach((f) => { clauses(f.id).forEach((c) => { if (local["vote." + f.id + "." + c.pid]) { (v[f.id] = v[f.id] || {})[c.pid] = true; } }); });
    store.set(base() + "/r/vote/" + ctx.pid, v);
  },
  async sendLoop() {
    const t = (local["red.text"] || "").trim().slice(0, MAXLEN); if (!t) return;
    local["red.text"] = "";
    await store.set(base() + "/r/red/" + ctx.pid + "/" + rid("k"), { text: t, t: Date.now() });
    lastHTML = null; render();
  },

  /* ---- preview ---- */
  demo() {
    store = memStore(); ctx = { role: "host", code: "DEMO", demo: true };
    const d = demoData(); store.set(base(), d.D); store.set(ccPath(), d.cc); connect();
  },
  demoStudent() {
    ctx = { role: "student", code: "DEMO", pid: "you", name: "You (student view)", demo: true };
    if (!players().you) store.set(base() + "/players/you", { name: "You", key: "you", joined: Date.now() });
    banner(`Preview: this is what a student sees in the current round. <button onclick="A.demoHost()">Back to the instructor view</button>`, "info");
    lastHTML = null; render();
  },
  demoHost() { ctx = { role: "host", code: "DEMO", demo: true }; banner(""); lastHTML = null; render(); }
};

/* =====================================================================
   SIMULATED CLASS FOR THE PREVIEW
   ===================================================================== */
function demoData() {
  let s = 7; const rnd = () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646;
  const choose = (pairs) => { let x = rnd(); for (const [k, p] of pairs) { if ((x -= p) < 0) return k; } return pairs[pairs.length - 1][0]; };
  const names = ["Ava", "Ben", "Carlos", "Dana", "Eli", "Fatima", "Grace", "Hiro", "Imani", "Jack", "Keisha", "Liam", "Maya", "Noah", "Olivia", "Priya", "Quinn", "Rosa"];
  const surnames = ["Thompson", "Okafor", "Reyes", "Whitfield", "Katz", "Rahman", "Lindqvist", "Tanaka", "Mbeki", "Sullivan", "Brooks", "Nguyen", "Patel", "Goldberg", "Castillo", "Iyer", "Abbott", "Delgado"];
  const D = { created: Date.now(), round: "lobby", format: "email", draftV: 1, players: {}, r: { poll1: {}, sort: {}, frame: {}, poll2: {}, law: {}, vote: {}, red: {}, sign: {} }, frameAssign: {} }, cc = {};
  const pf = { senior: .9, student: .85, military: .8, bulk: .95, coupon: .9, zip: .3, browse: .1, aid: .7 };
  const whys = ["Shoppers cannot tell when a price was set just for them, so they cannot shop around.", "Sellers can use what they know about you to charge the most you would pay.", "People in a hurry or in need get charged more, which is gouging one person at a time.", "Prices on necessities should not depend on who is asking.", "Personal data was collected for other reasons and should not be turned against the shopper.", "No new law is needed. Competition already punishes sellers who overcharge."];
  const laws = [
    ["Any business that sets a price for one shopper using that shopper's personal data.", "Covered sellers must show every shopper the same base price before any discount.", "Discounts open to a whole group, such as seniors, students and veterans.", "The attorney general can fine a seller $1,000 for each shopper affected."],
    ["Online sellers with more than $10 million in yearly sales.", "A seller may not raise a price because of a shopper's browsing history or location.", "Coupons anyone can find and use, and need-based financial aid.", "Shoppers can sue for three times what they were overcharged."],
    ["All sellers, online and in stores, that use an algorithm to set prices.", "A seller must tell the shopper when a price was set using personal data, and say which data.", "Loyalty programs a shopper chose to join.", "A state agency audits pricing code once a year."],
    ["Sellers of necessities: groceries, housing, medicine and transportation.", "No personalized prices on necessities, ever.", "None.", "Fines equal to 5% of the seller's yearly revenue."],
    ["Any company that buys data about shoppers from a data broker.", "Shoppers can switch off personalized pricing and get the standard price.", "Prices that are lower than the standard price.", "The attorney general, after one warning letter."],
    ["Any business that sets a price for one shopper using personal data, except small businesses.", "Sellers may personalize discounts but may never charge above the posted price.", "Financial aid at colleges and sliding-scale fees at clinics.", "A public database where shoppers report the prices they were shown."]
  ];
  const approve = [[.85, .8, .6, .45, .5, .2], [.8, .35, .6, .3, .25, .55], [.5, .7, .85, .45, .75, .4], [.8, .75, .5, .15, .45, .7], [.7, .4, .3, .2, .55, .5]];
  names.forEach((nm, i) => {
    const p = "p" + String(i + 1).padStart(2, "0");
    D.players[p] = { name: nm, key: nm.toLowerCase(), joined: Date.now() };
    D.r.poll1[p] = { fair: choose([["unfair", .6], ["depends", .3], ["fair", .1]]), ban: choose([["yes", .45], ["unsure", .35], ["no", .2]]) };
    D.r.poll2[p] = { fair: choose([["unfair", .3], ["depends", .55], ["fair", .15]]), ban: choose([["yes", .15], ["unsure", .35], ["no", .5]]) };
    const sc = {}; CASES.forEach((c) => { sc[c.id] = 1 - pf[c.id] + (rnd() - 0.5) * 0.5; });
    const ord = CASES.map((c) => c.id).sort((a, b) => sc[a] - sc[b]);
    D.r.sort[p] = { o: ord.join(","), line: ord.filter((x) => sc[x] < 0.42 + (rnd() - 0.5) * 0.3).length };
    const v = i % 2 ? "B" : "A"; D.frameAssign[p] = v;
    D.r.frame[p] = { v, rating: v === "A" ? choose([[5, .4], [4, .4], [3, .15], [2, .05]]) : choose([[4, .2], [3, .35], [2, .3], [1, .15]]) };
    if (i < laws.length) D.r.law[p] = { why: whys[i], scope: laws[i][0], rule: laws[i][1], exempt: laws[i][2], enforce: laws[i][3], t: Date.now() };
    if (i < 11) { D.r.sign[p] = { sign: true, name: nm + " " + surnames[i], v: 1, t: i }; cc[p] = { email: (nm + "." + surnames[i]).toLowerCase() + "@example.edu" }; }
    else if (i < 14) D.r.sign[p] = { sign: false, v: 1, t: i };
  });
  names.forEach((nm, i) => {
    const p = "p" + String(i + 1).padStart(2, "0"), b = { t: Date.now() };
    FIELDS.forEach((f, fi) => laws.forEach((_, li) => { if (rnd() < approve[fi][li]) (b[f.id] = b[f.id] || {})["p" + String(li + 1).padStart(2, "0")] = true; }));
    D.r.vote[p] = b;
  });
  D.draft = "Subject: A proposal on personalized pricing from Brandeis students\n\nDear Senator / Representative [name],\n\nWe are students in a first-year seminar at Brandeis University, writing as individuals. We spent two classes studying personalized pricing, and we are writing to propose a law.\n\nWhy it is needed. Shoppers cannot tell when a price was set just for them, so they cannot shop around. Sellers can use what they know about a person to charge the most that person would pay.\n\nOur proposal.\n1. Scope. This law applies to any business that sets a price for an individual shopper using that shopper's personal data.\n2. Rule. A covered seller must say, next to the price, that it was set using personal data and which data. A shopper may switch personalized pricing off and get the standard price.\n3. Exemptions. Discounts offered to a whole group, coupons anyone can use, and need-based financial aid.\n4. Enforcement. The attorney general may fine a seller $1,000 for each shopper affected.\n\nWhy we made these choices. We chose disclosure and an opt-out over a ban because most of us think some personalized discounts help people.\n\nWhere we disagreed. Some of us think no new law is needed, and we split on whether loyalty programs should be exempt.\n\nWe ask that you consider these ideas as the legislature takes up surveillance pricing.\n\nSincerely,";
  [["p03", "Raise the standard price for everyone, then send personal coupons. Coupons are exempt."], ["p08", "Use the type of phone instead of personal data. A phone model isn't linked to one person."], ["p11", "Keep prices equal but show richer shoppers the expensive products first."], ["p15", "Call every shopper a 'group of one' and offer each group its own discount."]]
    .forEach(([p, t], i) => { D.r.red[p] = { ["k" + i]: { text: t, t: i } }; });
  return { D, cc };
}

(function start() {

  if (stu && stu.code && stu.pid && (!q || q.toUpperCase() === stu.code)) {
    try {
      store = fbStore(); ctx = { role: "student", code: stu.code, pid: stu.pid, name: stu.name };
      store.get(base() + "/players/" + stu.pid).then((p) => { if (p) connect(); else { lsDel(LS_STU); landing(); } }).catch((e) => landing("Couldn't reconnect: " + e.message));
      return;
    } catch (e) { landing("Couldn't reach the class database: " + e.message); return; }
  }
  if (host && !q && !noResume) { A.hostResume(host); return; }
  landing();
  try { fbStore(); } catch (e) { banner("This page can't reach the class database: " + esc(e.message) + ". The preview still works."); }
})();
