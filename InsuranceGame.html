<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Gets Insured?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=Lora:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: FYS 7b deck look — navy title band + gold stripe, one centered column of step cards, teal callouts, gold discussion boxes */
:root{
  --band:#2f3f55; --band-fg:#ffffff; --gold:#e3b23c; --gold-ink:#7a5a12; --gold-wash:#fbf3dd;
  --teal:#2b8a80; --teal-ink:#1e6b63; --teal-wash:#e4f2f0;
  --bg:#f3f5f8; --surface:#ffffff; --ink:#1f2733; --muted:#5a6575; --line:#d8dee6; --soft:#eef1f5;
  --sara:#2b8a80; --bob:#c08a1e; --sam:#b0503c;
  --good:#2c7a4b; --good-wash:#e3f2e8; --bad:#b03f37; --bad-wash:#f8e5e2;
  --btn:#2f3f55; --btn-fg:#ffffff;
  --display:"Lato","Helvetica Neue",Arial,sans-serif;
  --body:"Lato","Helvetica Neue",Arial,sans-serif;
  --story:"Lora",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#1b2636; --band-fg:#f1f4f8; --gold:#e6bb52; --gold-ink:#f0d48e; --gold-wash:#352c17;
  --teal:#56b7ac; --teal-ink:#8fd6cd; --teal-wash:#173230;
  --bg:#111821; --surface:#19222e; --ink:#e6eaf0; --muted:#a2acba; --line:#2d3947; --soft:#212c3a;
  --sara:#56b7ac; --bob:#e0ac45; --sam:#e07a64;
  --good:#6cc493; --good-wash:#173025; --bad:#ec8378; --bad-wash:#3a1d1b;
  --btn:#e6bb52; --btn-fg:#1b2636; color-scheme:dark;}}
:root[data-theme="dark"]{
  --band:#1b2636; --band-fg:#f1f4f8; --gold:#e6bb52; --gold-ink:#f0d48e; --gold-wash:#352c17;
  --teal:#56b7ac; --teal-ink:#8fd6cd; --teal-wash:#173230;
  --bg:#111821; --surface:#19222e; --ink:#e6eaf0; --muted:#a2acba; --line:#2d3947; --soft:#212c3a;
  --sara:#56b7ac; --bob:#e0ac45; --sam:#e07a64;
  --good:#6cc493; --good-wash:#173025; --bad:#ec8378; --bad-wash:#3a1d1b;
  --btn:#e6bb52; --btn-fg:#1b2636; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:780px;margin:0 auto}
header.band{background:var(--band);color:var(--band-fg)}
header.band .col{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 14px}
header.band h1{font:900 clamp(1.35rem,4vw,1.8rem)/1.15 var(--display);margin:0;letter-spacing:.01em}
header.band .who{font-size:.85rem;opacity:.85}
.stripe{height:7px;background:var(--gold)}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--teal-ink)}
h2{font:900 clamp(1.35rem,3.6vw,1.75rem)/1.2 var(--display);margin:.2rem 0 .6rem;text-wrap:balance}
h3{font:700 1.08rem/1.3 var(--display);margin:0 0 .4rem}
p{margin:0 0 .8rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
b,strong{font-weight:700}
main{padding-block:20px 120px}
.stage{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.callout{background:var(--teal-wash);border:1px solid var(--teal);border-radius:8px;padding:14px 16px}
.callout p:last-child,.discuss p:last-child,.card p:last-child{margin-bottom:0}
.discuss{background:var(--gold-wash);border:1px solid var(--gold);border-radius:8px;padding:14px 16px}
.discuss .lab{font-weight:900;color:var(--gold-ink)}
.num{font-variant-numeric:tabular-nums}

/* progress */
.prog{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-block:12px 0}
.prog div{height:6px;border-radius:3px;background:var(--line)}
.prog div.on{background:var(--teal)}
.prog div.cur{background:var(--gold)}
.progl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);padding-top:6px;gap:8px}

/* buttons */
button{font:inherit;cursor:pointer}
.btn{background:var(--btn);color:var(--btn-fg);border:0;border-radius:8px;padding:11px 18px;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.teal{background:var(--teal);color:var(--surface)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* people */
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.people{grid-template-columns:1fr}}
.pc{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.pc .top{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--surface);flex:none}
.p-sara .av,.av.p-sara{background:var(--sara)} .p-bob .av,.av.p-bob{background:var(--bob)} .p-sam .av,.av.p-sam{background:var(--sam)}
.pc .nm{font-weight:900;font-size:1.05rem;line-height:1.1}
.pc .rk{font-size:.8rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.92rem}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-weight:700;font-size:.9rem;background:var(--surface)}
.chip .av{width:24px;height:24px;font-size:.75rem}
.chip.gone{opacity:.4;text-decoration:line-through}
.pool{display:flex;gap:8px;flex-wrap:wrap}

/* ledger */
.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ledger td{padding:7px 0;border-bottom:1px solid var(--line)}
.ledger td:last-child{text-align:right;font-weight:700}
.ledger tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-size:1.05rem}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* slider */
.slider{display:flex;flex-direction:column;gap:8px}
.slider .big{font:900 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.slider input[type=range]{width:100%;accent-color:var(--teal);height:28px}
.nudge{display:flex;gap:6px;flex-wrap:wrap}
.nudge button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:.85rem;font-variant-numeric:tabular-nums}
.status{border-radius:8px;padding:10px 12px;font-weight:700;font-size:.95rem}
.status.ok{background:var(--good-wash);color:var(--good)}
.status.no{background:var(--soft);color:var(--muted)}
.status.warn{background:var(--bad-wash);color:var(--bad)}

/* choices */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:8px 12px;font-size:.9rem;font-weight:700;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.sel{background:var(--btn);color:var(--btn-fg)}
.seg button:disabled{cursor:default}
.fb{border-radius:8px;padding:10px 12px;font-size:.93rem}
.fb.ok{background:var(--good-wash)} .fb.no{background:var(--bad-wash)} .fb.info{background:var(--soft)}
.fb.ok b:first-child{color:var(--good)} .fb.no b:first-child{color:var(--bad)}
.mc .q{font-weight:700;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 14px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.sel{border-color:var(--btn);box-shadow:inset 0 0 0 2px var(--btn);background:var(--soft)}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.opt:disabled{cursor:default;color:var(--ink)}

/* tables */
.tw{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:.95rem}
table.cmp th,table.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.tag.y{background:var(--good-wash);color:var(--good)} .tag.n{background:var(--bad-wash);color:var(--bad)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:10px}
.tl .yr{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:10px}
.tl .yr:last-child{border-bottom:0}
.tl .lab{font-weight:900;font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.tl .yr{grid-template-columns:1fr}}

/* rank */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.rank li.drag{opacity:.5}
.rank .n{font:900 1.1rem/1 var(--display);color:var(--teal-ink);text-align:center;font-variant-numeric:tabular-nums}
.rank .t{font-weight:700;line-height:1.2}
.rank .d{font-size:.83rem;color:var(--muted)}
.rank .mv{display:flex;gap:4px}
.rank .mv button{width:34px;height:34px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;font-weight:900}
.rank .mv button:disabled{opacity:.3}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:700}

/* rate rows */
.rate{display:flex;flex-direction:column}
.rr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0}
.rr .ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rr .ctl .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.rr .ctl > div{display:flex;align-items:center;gap:8px}
@media (max-width:640px){.rr{grid-template-columns:1fr}.rr .ctl{align-items:flex-start}}
.rr input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink)}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}

/* map */
.map{display:grid;grid-template-columns:76px repeat(3,minmax(0,1fr));gap:4px;font-size:.85rem}
.map .h{font-weight:900;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px;text-align:center}
.map .rh{font-weight:900;font-size:.8rem;display:flex;align-items:center;padding:4px}
.map .cell{background:var(--soft);border-radius:6px;min-height:70px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.map .cell span{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:.78rem;font-weight:700;line-height:1.25}
.map .rh.f{color:var(--good)} .map .rh.u{color:var(--bad)}
@media (max-width:520px){.map{grid-template-columns:52px repeat(3,minmax(0,1fr))}.map .cell span{font-size:.7rem}}

/* two columns */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.two > div{min-width:0}

/* story */
.story{font-family:var(--story);font-size:1.15rem;line-height:1.6}
.story em{font-style:italic}
.coop{width:100%;max-width:360px;display:block;margin:0 auto}
.coop .ground{fill:var(--line)} .coop .wall{fill:var(--gold-wash);stroke:var(--gold-ink);stroke-width:2}
.coop .roof{fill:var(--sam)} .coop .door{fill:var(--band)} .coop .ramp{fill:var(--gold-ink)}
.coop .hen{fill:var(--surface);stroke:var(--ink);stroke-width:1.5} .coop .comb{fill:var(--bad)} .coop .beak{fill:var(--gold)}
.coop .snow{fill:var(--muted);opacity:.5}
.pull{font:900 1.35rem/1.3 var(--display);text-wrap:balance;border-left:0;margin:0}

/* nav */
nav.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.foot .col{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px}
nav.foot .why{font-size:.85rem;color:var(--muted);text-align:center;flex:1;min-width:0}

/* join / host */
.join{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;font-size:.9rem}
.field input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--ink)}
.code{font:900 2.6rem/1 var(--display);letter-spacing:.18em;color:var(--teal-ink)}
.err{color:var(--bad);font-weight:700;font-size:.92rem}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,190px) 1fr 52px;gap:8px;align-items:center;font-size:.88rem}
.bar .lbl{overflow-wrap:anywhere}
.bar .trk{background:var(--soft);border-radius:4px;height:16px;overflow:hidden}
.bar .fill{background:var(--teal);height:100%}
.bar .fill.g{background:var(--gold)} .bar .fill.r{background:var(--sam)}
.bar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:520px){.bar{grid-template-columns:minmax(0,120px) 1fr 46px}}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.texts{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.texts div{background:var(--soft);border-radius:6px;padding:6px 10px;font-size:.9rem}
.texts div b{color:var(--muted);font-weight:700;margin-right:6px}
.gates{display:flex;gap:6px;flex-wrap:wrap}
.gates button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:700;font-size:.88rem}
.gates button.open{background:var(--teal);border-color:var(--teal);color:var(--surface)}
svg text{fill:var(--ink)}
svg .axis{stroke:var(--muted);stroke-width:1}
svg .grid{stroke:var(--line);stroke-width:1}
svg .dot{fill:var(--teal)}
@media (prefers-reduced-motion:no-preference){.stage>*{animation:rise .35s ease both}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<div class="stripe"></div>
<div class="gut" id="progwrap" hidden><div class="col"><div class="prog" id="prog"></div><div class="progl"><span id="partname"></span><span id="partnum"></span></div></div></div>
<main class="gut"><div class="col stage" id="stage"></div></main>
<nav class="foot gut" id="nav" hidden><div class="col"><button class="btn ghost" id="back">Back</button><span class="why" id="why"></span><button class="btn" id="next">Next</button></div></nav>

<script>
/* =====================================================================
   FIREBASE CONFIG (same project as the other class games)
   Sessions live under games/ins-CODE, so the existing rules apply.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDQ8gn5w_Jj4OzcXFBz2lY2SKuaKEo2wbk",
  authDomain: "obfuscationgame.firebaseapp.com",
  databaseURL: "https://obfuscationgame-default-rtdb.firebaseio.com",
  projectId: "obfuscationgame",
  storageBucket: "obfuscationgame.firebasestorage.app",
  messagingSenderId: "443679460937",
  appId: "1:443679460937:web:d6b2806717894b3c923998"
};
const PREFIX = "ins-";

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = x => (x < -0.5 ? "−" : "") + "$" + Math.round(Math.abs(x)).toLocaleString("en-US");
const signed = x => (x > 0.5 ? "+" : "") + money(x);
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function rid(n, abc) { abc = abc || "abcdefghijkmnpqrstuvwxyz23456789"; let s = ""; for (let i = 0; i < n; i++) s += abc[Math.floor(Math.random() * abc.length)]; return s; }

/* ---------------- Firebase (optional) ---------------- */
let db = null;
try { if (window.firebase && FIREBASE_CONFIG.databaseURL) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); } } catch (e) { db = null; }
const CLASS_OK = !!db;

/* ---------------- the economy (from the lecture slides) ---------------- */
const PEOPLE = {
  sara: { id: "sara", name: "Sara", pro: "she", pos: "her", obj: "her", cost: 4000, wtp: 8000, income: 55000, risk: "Low risk", note: "Rarely needs a doctor." },
  bob:  { id: "bob",  name: "Bob",  pro: "he",  pos: "his", obj: "him", cost: 25000, wtp: 35000, income: 55000, risk: "Medium risk", note: "Some prescriptions and specialist visits." },
  sam:  { id: "sam",  name: "Samantha", pro: "she", pos: "her", obj: "her", cost: 75000, wtp: 55000, income: 55000, risk: "High risk", note: "A chronic condition that needs ongoing care." }
};
const ORDER = ["sara", "bob", "sam"];
const claims = pool => pool.reduce((s, id) => s + PEOPLE[id].cost, 0);
const breakEven = pool => pool.length ? claims(pool) / pool.length : 0;
const buyersAt = (pool, priceOf) => pool.filter(id => PEOPLE[id].wtp >= priceOf(id));
function yearPool(y) { let pool = ORDER.slice(); for (let i = 1; i < y; i++) { const p = breakEven(pool); pool = buyersAt(pool, () => p); } return pool; }
const TAILORED = id => PEOPLE[id].cost;

/* ---------------- content lists ---------------- */
const RANK_ITEMS = [
  { id: "age", t: "Age", d: "Older people pay more" },
  { id: "tobacco", t: "Tobacco use", d: "Smokers pay more" },
  { id: "geo", t: "Geography", d: "Where you live (zip code, region)" },
  { id: "sky", t: "Skydiving", d: "Risky hobbies" },
  { id: "parent", t: "Parent died young", d: "Family health history" },
  { id: "search", t: "Search history", d: "e.g., searches about depression" },
  { id: "grocery", t: "Grocery history", d: "What you buy at the store" },
  { id: "genes", t: "Genetics", d: "Results of a DNA test" }
];
const ACA = { age: ["y", "Allowed, but the oldest can pay at most 3× the youngest"], tobacco: ["y", "Allowed, up to 1.5× the non-smoker price"], geo: ["y", "Allowed"],
  sky: ["n", "Not allowed (but life insurers often ask)"], parent: ["n", "Not allowed (health history)"], search: ["n", "Not allowed"], grocery: ["n", "Not allowed"],
  genes: ["n", "Not allowed (ACA and GINA)"] };

const SHARE = [
  { id: "tracker", t: "Fitness tracker", d: "steps, heart rate, sleep" },
  { id: "grocery", t: "Grocery purchases", d: "your loyalty-card history" },
  { id: "search", t: "Search history", d: "everything you've typed into Google" },
  { id: "dna", t: "DNA test", d: "your full genetic results" }
];

const FACTORS = [
  { id: "pre", t: "Pre-existing condition", d: "Diabetes diagnosed before applying" },
  { id: "genes", t: "Genetic risk", d: "A gene variant that raises cancer risk" },
  { id: "family", t: "Family history", d: "A parent died young of heart disease" },
  { id: "age", t: "Age", d: "Older people cost more on average" },
  { id: "sex", t: "Sex", d: "Men and women have different average costs" },
  { id: "zip", t: "Zip code", d: "Neighborhoods differ in prices and health" },
  { id: "job", t: "Occupation", d: "Roofer vs. accountant" },

function mc(parent, o) {
  const box = el("div", "mc");
  const ok = v => Array.isArray(o.correct) ? o.correct.includes(v) : v === o.correct;
  const draw = () => {
    const v = A[o.key]; const answered = v != null; const lock = answered && !o.poll;
    box.innerHTML = `<p class="q">${o.q}</p><div class="opts">${o.opts.map(x => {
      let c = "opt"; if (v === x.v) c += " sel";
      if (lock) { if (ok(x.v)) c += " right"; else if (v === x.v) c += " wrong"; }
      return `<button class="${c}" data-v="${esc(x.v)}" ${lock ? "disabled" : ""}>${x.label}</button>`; }).join("")}</div>
      ${answered && o.explain ? `<div class="fb ${o.poll ? "info" : ok(v) ? "ok" : "no"}">${o.poll ? "" : ok(v) ? "<b>Right.</b> " : "<b>Not quite.</b> "}${typeof o.explain === "function" ? o.explain(v) : o.explain}</div>` : ""}`;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => { A[o.key] = b.dataset.v; save(); draw(); renderNav(); if (o.after) o.after(); });
  };

}

function priceSlider(o) {
  // o: {value, max, step, onChange, disabled, label}
  const w = el("div", "slider");
  w.innerHTML = `<div class="row" style="justify-content:space-between;align-items:baseline"><span class="muted small">${o.label || "Your price per policy"}</span><span class="big num"></span></div>
    <input type="range" min="0" max="${o.max || 80000}" step="${o.step || 100}" value="${o.value}" ${o.disabled ? "disabled" : ""} aria-label="${esc(o.label || "Price")}">
    <div class="nudge">${[-5000, -1000, -100, 100, 1000, 5000].map(d => `<button data-d="${d}" ${o.disabled ? "disabled" : ""}>${d > 0 ? "+" : "−"}${Math.abs(d).toLocaleString()}</button>`).join("")}</div>`;
  const r = w.querySelector("input"), big = w.querySelector(".big");
  const set = v => { v = Math.max(0, Math.min(+r.max, v)); r.value = v; big.textContent = money(v); o.onChange(v); };
  r.oninput = () => set(+r.value);
  w.querySelectorAll(".nudge button").forEach(b => b.onclick = () => set(+r.value + +b.dataset.d));
  big.textContent = money(o.value);

}

function ledgerHTML(rows, totLabel, tot) {
  return `<table class="ledger">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}<tr class="tot"><td>${totLabel}</td><td class="${tot >= -0.5 ? (tot > 0.5 ? "pos" : "") : "neg"}">${signed(tot)}</td></tr></table>`;
}

/* ---------- Part 1/2 building blocks ---------- */
function priceStep(stage, y) {
  const key = "y" + y + "price";
  const pool = yearPool(y); const be = breakEven(pool); const tot = claims(pool);
  const prevLoss = y > 1 ? (() => { const pp = yearPool(y - 1), pb = breakEven(pp), b = buyersAt(pp, () => pb); return pb * b.length - claims(b); })() : 0;
  const c = el("div", "card");
  c.innerHTML = `<div class="eyebrow">Year ${y} · You are the insurer</div>
    <h2>${y === 1 ? "Set a price for everyone" : y === 2 ? "Reprice for the customers you have left" : "Reprice again"}</h2>
    ${y === 1 ? `<p>Three people apply. You can't tell who is healthy and who is sick: everyone looks the same on the application. You only know what the group costs on average.</p>`
      : `<p>Last year you lost <b class="neg">${money(-prevLoss)}</b>. Your claims showed who actually bought, so this year you expect only these customers to apply:</p>`}
    <div style="margin:10px 0 14px">${poolLine(pool)}</div>
    <p class="small muted">Many insurers compete. Charge more than break-even and a rival undercuts you. Charge less and you lose money. So the price ends up where premiums just cover expected claims.</p>`;
  const task = el("div", "callout"); task.innerHTML = `<p><b>Your task:</b> slide the price until you break even${pool.length > 1 ? `, assuming all ${pool.length} people buy` : ", assuming she buys"}.</p>`;
  c.appendChild(task);
  const led = el("div"); const st = el("div", "status no");
  const locked = () => A[key] === true;
  let cur = locked() ? Math.round(be) : (A[key + "_v"] != null ? A[key + "_v"] : (y === 1 ? 15000 : Math.round(breakEven(yearPool(y - 1)) / 100) * 100));
  const draw = v => {
    const prem = v * pool.length, prof = prem - tot;
    led.innerHTML = ledgerHTML([
      [`Premiums: ${pool.length} × ${money(v)}`, money(prem)],
      [`Expected claims: ${pool.map(id => PEOPLE[id].name + " " + money(PEOPLE[id].cost)).join(" + ")}`, money(tot)]
    ], "Expected profit", prof);
    if (locked()) { st.className = "status ok"; st.innerHTML = `Price locked at ${money(be)}: the average expected cost of ${pool.length > 1 ? "this pool" : "your only customer"}.`; lockBtn.hidden = true; }
    else if (v - be >= -100 && v - be <= 1000) { st.className = "status ok"; st.textContent = Math.abs(v - be) < 1 ? "That's break-even. Lock it in." : `Close enough. Rivals will shave the price down to exact break-even, ${money(be)}. Lock it in.`; lockBtn.hidden = false; }
    else { st.className = "status " + (prof < 0 ? "warn" : "no"); st.textContent = prof < 0 ? "You'd lose money at this price." : "A rival would undercut this price."; lockBtn.hidden = true; }
  };
  const sl = priceSlider({ value: cur, disabled: locked(), onChange: v => { cur = v; A[key + "_v"] = v; draw(v); } });
  const lockBtn = el("button", "btn teal", `Lock in ${money(be)}`); lockBtn.hidden = true;
  lockBtn.onclick = () => { A[key] = true; save(); sl.setValue(Math.round(be)); sl.querySelectorAll("input,button").forEach(b => b.disabled = true); draw(be); renderNav(); };
  const hint = el("button", "btn ghost", "Hint"); const hintBox = el("div", "fb info"); hintBox.hidden = true;
  hintBox.innerHTML = `Break-even means premiums = expected claims. So the price = total expected claims ÷ number of customers = ${money(tot)} ÷ ${pool.length}.`;
  hint.onclick = () => { hintBox.hidden = false; hint.hidden = true; };
  const box = el("div", "card"); box.style.display = "flex"; box.style.flexDirection = "column"; box.style.gap = "12px";
  box.append(sl, led, st); const r = el("div", "row"); r.append(lockBtn, hint); box.append(r, hintBox);
  stage.append(c, box); draw(cur);
}

function decisionStep(stage, o) {
  // o: {key, pool, price(id), eyebrow, title, intro, result(buyers)}
  const key = o.key;
  const d = A[key] || { c: {} }; A[key] = d; d.c = d.c || {};
  const head = el("div", "card");
  head.innerHTML = `<div class="eyebrow">${o.eyebrow}</div><h2>${o.title}</h2>${o.intro}`;
  stage.appendChild(head);
  const grid = el("div", "people"); stage.appendChild(grid);
  const fb = el("div"); stage.appendChild(fb);
  const verdict = id => PEOPLE[id].wtp >= o.price(id) ? "buy" : "no";
  const reason = id => {
    const p = PEOPLE[id], pr = o.price(id);
    if (verdict(id) === "buy") return `${p.name} buys: ${money(pr)} is no more than the ${money(p.wtp)} ${p.pro} is willing to pay.`;
    return `${p.name} walks away: ${money(pr)} is more than the ${money(p.wtp)} ${p.pro} is willing to pay.${pr > p.income ? ` It's more than ${p.pos} entire income.` : ""}`;
  };
  const draw = () => {
    grid.innerHTML = o.pool.map(id => {
      const ch = d.c[id], done = d.done, right = done && ch === verdict(id);
      return personCard(id, `<div class="kv" style="border-top:1px solid var(--line);padding-top:6px"><span>${o.priceLabel || "Price"}</span><span>${money(o.price(id))}</span></div>
        <div class="seg" role="group" aria-label="${PEOPLE[id].name}'s choice"><button data-id="${id}" data-v="buy" class="${ch === "buy" ? "sel" : ""}" ${done ? "disabled" : ""}>Buys</button><button data-id="${id}" data-v="no" class="${ch === "no" ? "sel" : ""}" ${done ? "disabled" : ""}>Doesn't buy</button></div>
        ${done ? `<div class="fb ${right ? "ok" : "no"}"><b>${right ? "Right." : "Not quite."}</b> ${reason(id)}</div>` : ""}`);
    }).join("");
    grid.querySelectorAll(".seg button").forEach(b => b.onclick = () => { d.c[b.dataset.id] = b.dataset.v; save(); draw(); });
    fb.innerHTML = "";
    if (!d.done) {
      const ready = o.pool.every(id => d.c[id]);
      const btn = el("button", "btn", "Check my answers"); btn.disabled = !ready; btn.onclick = () => { d.done = true; save(); draw(); renderNav(); };
      fb.appendChild(btn);
    } else {
      const buyers = o.pool.filter(id => verdict(id) === "buy");
      fb.appendChild(o.result(buyers, verdict));
    }
  };
  draw();
}

function yearResultCard(y, buyers) {
  const pool = yearPool(y), p = breakEven(pool);
  const prem = p * buyers.length, cl = claims(buyers), prof = prem - cl;
  const c = el("div", "card");
  if (!buyers.length) {
    c.innerHTML = `<h3>Nobody buys.</h3><p>The market has unraveled. Samantha would gladly take insurance at any price up to ${money(PEOPLE.sam.wtp)}, but covering her costs ${money(PEOPLE.sam.cost)} on average. No insurer will sell at a loss.</p>`;
    return c;
  }
  const gone = pool.filter(id => !buyers.includes(id));
  c.innerHTML = `<h3>What actually happened in year ${y}</h3>
    <div style="margin:6px 0 10px">${poolLine(buyers)}</div>
    ${ledgerHTML([[`Premiums: ${buyers.length} × ${money(p)}`, money(prem)], [`Claims: ${buyers.map(id => PEOPLE[id].name + " " + money(PEOPLE[id].cost)).join(" + ")}`, money(cl)]], "Insurer's profit", prof)}
    <div class="callout" style="margin-top:12px"><p>The price was built for a pool that included ${gone.map(id => PEOPLE[id].name).join(" and ")}. The lowest-cost customer${gone.length > 1 ? "s" : ""} left, so the average cost of the people still buying went <b>up</b>.</p></div>`;
  return c;
}

      <span>Principles you chose</span><span style="text-align:right">${PRINCIPLES.filter(p => A.principles && A.principles[p.id]).map(p => p.t.split(":")[0]).join(", ") || "–"}</span></div>
      ${A.rule ? `<div class="callout" style="margin-top:14px"><p><b>Your rule:</b> Insurers may charge more based on a characteristic only if ${esc(A.rule)}</p></div>` : ""}
      <p class="small muted" style="margin-top:12px">${S && S.mode === "class" ? "Your answers were sent to the class results. " : ""}Use Back to revisit any part.</p>`;
  } }
];

/* ---------------- navigation ---------------- */
function renderProgress() {
  const st = STEPS[S.step];
  $("prog").innerHTML = PARTS.map(p => `<div class="${p.n < st.part ? "on" : p.n === st.part ? "cur" : ""}"></div>`).join("");
  $("partname").textContent = PARTS[st.part - 1].t;
  $("partnum").textContent = `Part ${st.part} of ${PARTS.length}`;
}
function renderNav() {
  if (!S) return;
  const st = STEPS[S.step], nx = STEPS[S.step + 1];
  $("back").disabled = S.step === 0;
  const n = $("next"), why = $("why");
  if (!nx) { n.hidden = true; why.textContent = ""; return; }
  n.hidden = false;
  if (!st.done()) { n.disabled = true; why.textContent = "Finish this step to continue"; return; }
  if (nx.part > GATE) { n.disabled = true; why.textContent = `Waiting for your professor to open Part ${nx.part}`; return; }
  n.disabled = false; why.textContent = "";
}
function go(i) {
  S.step = Math.max(0, Math.min(STEPS.length - 1, i)); save();
  const stage = $("stage"); stage.innerHTML = ""; STEPS[S.step].render(stage);
  renderProgress(); renderNav(); window.scrollTo(0, 0);
}
$("back").onclick = () => go(S.step - 1);
$("next").onclick = () => { if (!$("next").disabled) go(S.step + 1); };

/* ---------------- join screen ---------------- */
function startStudent(s) {
  S = s; A = s.A || {};
  $("progwrap").hidden = false; $("nav").hidden = false;
  $("who").textContent = (s.name ? s.name + " · " : "") + (s.mode === "class" ? "Session " + s.code : "Solo play");
  if (s.mode === "class" && db) {
    GATE = 1;
    db.ref("games/" + PREFIX + s.code + "/meta/gate").on("value", snap => { GATE = snap.val() || 1; renderNav(); });
  } else GATE = 99;
  go(s.step || 0);
}
function joinScreen(msg) {
  const stage = $("stage"); stage.innerHTML = "";
  const qp = new URLSearchParams(location.search);
  const saved = lsGet(LSKEY);
  const c = el("div", "card join");
  c.innerHTML = `<div class="eyebrow">FYS 7b · Big Tech Under Fire</div><h2>Can better data fix insurance, or just pick new victims?</h2>
    <p>You'll run a health insurer, then step into the shoes of its customers, and watch what happens when the insurer knows too little, and then everything.</p>
    ${saved && saved.A ? `<button class="btn teal" id="resume">Continue where you left off (${saved.mode === "class" ? "session " + esc(saved.code) : "solo"}, Part ${STEPS[saved.step || 0].part})</button>` : ""}
    ${CLASS_OK ? `<div class="field"><label for="code">Session code</label><input id="code" autocomplete="off" autocapitalize="characters" maxlength="6" placeholder="e.g. K7QM" value="${esc(qp.get("code") || "")}"></div>
    <div class="field"><label for="name">First name</label><input id="name" autocomplete="given-name" maxlength="30"></div>
    <div class="row"><button class="btn" id="join">Join class session</button><button class="btn ghost" id="solo">Play solo</button></div>
    <div class="err" id="err">${msg ? esc(msg) : ""}</div>`
    : `<div class="row"><button class="btn" id="solo">Start</button></div><p class="small muted">Class sessions with shared results run from the copy on the course website.</p>`}`;
  stage.appendChild(c);
  if (CLASS_OK) {
    const h = el("p", "small muted", `Instructor? <a href="#" id="hostlink">Start a class session</a>`); stage.appendChild(h);
    h.querySelector("#hostlink").onclick = e => { e.preventDefault(); hostScreen(); };
  }
  if ($("resume")) $("resume").onclick = () => startStudent(saved);
  $("solo").onclick = () => startStudent({ mode: "solo", pid: rid(10), name: CLASS_OK ? ($("name").value || "").trim() : "", step: 0, A: {} });
  if ($("join")) $("join").onclick = async () => {
    const code = ($("code").value || "").trim().toUpperCase(), name = ($("name").value || "").trim();
    if (!code) { $("err").textContent = "Enter the session code on the screen."; return; }
    if (!name) { $("err").textContent = "Enter your first name."; return; }
    $("err").textContent = "Joining…";
    try {
      const m = (await db.ref("games/" + PREFIX + code + "/meta").get()).val();
      if (!m) { $("err").textContent = `No session with code ${code}. Check the code on the screen.`; return; }
      const prev = saved && saved.code === code ? saved : null;
      startStudent(prev ? Object.assign(prev, { name }) : { mode: "class", code, pid: rid(10), name, step: 0, A: {} });
      save();
    } catch (e) { $("err").textContent = "Couldn't reach the class database. Check your connection and try again."; }
  };
}

/* ---------------- host dashboard ---------------- */
const HOSTKEY = "wgi.host";
function hostScreen() {
  const stage = $("stage"); stage.innerHTML = "";
  const prev = lsGet(HOSTKEY);
  const c = el("div", "card join");
  c.innerHTML = `<div class="eyebrow">Instructor</div><h2>Start a class session</h2>
    <p>Students open this page, enter the code and their first name. You control which parts are open.</p>
    <div class="row"><button class="btn" id="new">Create new session</button>${prev ? `<button class="btn ghost" id="old">Resume session ${esc(prev)}</button>` : ""}<button class="btn ghost" id="cancel">Back</button></div><div class="err" id="herr"></div>`;
  stage.appendChild(c);
  $("cancel").onclick = () => joinScreen();
  $("new").onclick = async () => {
    const code = rid(4, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789");
    try { await db.ref("games/" + PREFIX + code + "/meta").set({ created: Date.now(), gate: 1 }); lsSet(HOSTKEY, code); runHost(code); }
    catch (e) { $("herr").textContent = "Couldn't create the session: " + e.message; }
  };
  if ($("old")) $("old").onclick = () => runHost(prev);
}

function bars(rows, opts) {
  opts = opts || {}; const max = opts.max || Math.max(1, ...rows.map(r => r[1]));
  return `<div class="bars">${rows.map(r => `<div class="bar"><span class="lbl">${r[0]}</span><span class="trk"><span class="fill ${r[2] || ""}" style="display:block;width:${Math.max(0, Math.min(100, 100 * r[1] / max))}%"></span></span><span class="v">${opts.fmt ? opts.fmt(r[1]) : r[1]}</span></div>`).join("")}</div>`;
}
function countBy(players, get, opts) { const out = {}; opts.forEach(o => out[o.v] = 0); players.forEach(p => { const v = get(p); if (v != null && out[v] != null) out[v]++; }); return opts.map(o => [o.label || o.l, out[o.v]]); }

function runHost(code) {
  $("progwrap").hidden = true; $("nav").hidden = true;
  $("who").textContent = "Instructor · Session " + code;
  const base = "games/" + PREFIX + code;
  const stage = $("stage"); stage.innerHTML = "";
  const top = el("div", "card");
  const url = location.origin + location.pathname + "?code=" + code;
  top.innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">Session code</div><div class="code">${code}</div><div class="small muted" style="overflow-wrap:anywhere">${esc(url)}</div></div><div style="text-align:right"><div class="eyebrow">Students</div><div class="code" id="hn" style="letter-spacing:0">0</div></div></div>
    <h3 style="margin-top:16px">Open parts</h3><div class="gates" id="gates"></div><div class="small muted" style="margin-top:6px">Students can work up to the last open part and wait there.</div>
    <div class="bars" id="where" style="margin-top:14px"></div>`;
  stage.appendChild(top);
  const res = el("div", "hgrid"); stage.appendChild(res);
  let gate = 1;
  const drawGates = () => { $("gates").innerHTML = PARTS.map(p => `<button data-g="${p.n}" class="${p.n <= gate ? "open" : ""}">${p.n}. ${p.t}</button>`).join("");
    $("gates").querySelectorAll("button").forEach(b => b.onclick = () => db.ref(base + "/meta/gate").set(+b.dataset.g)); };
  db.ref(base + "/meta/gate").on("value", s => { gate = s.val() || 1; drawGates(); });
  db.ref(base + "/players").on("value", s => drawResults(Object.values(s.val() || {})));

  function drawResults(P) {
    $("hn").textContent = P.length;
    $("where").innerHTML = bars(PARTS.map(p => [`Part ${p.n}`, P.filter(x => x.part === p.n).length]), { max: Math.max(1, P.length) });
    const card = (title, body) => `<div class="card"><h3>${title}</h3>${body}</div>`;
    const A_ = P.map(p => p.a || {});
    const out = [];
    // Part 1
    const decRows = [];
    [["y1buy", 1], ["y2buy", 2], ["y3buy", 3]].forEach(([k, y]) => { const pool = yearPool(y), pr = breakEven(pool);
      pool.forEach(id => { const ans = A_.filter(a => a[k] && a[k].done); const ok = ans.filter(a => a[k].c && a[k].c[id] === (PEOPLE[id].wtp >= pr ? "buy" : "no")).length;
        decRows.push([`Yr ${y} · ${PEOPLE[id].name} at ${money(pr)}`, ans.length ? ok / ans.length : 0, "", `${ok}/${ans.length}`]); }); });
    out.push(card("Part 1 · Predicted each customer correctly", bars(decRows.map(r => [r[0], r[1]]), { max: 1, fmt: v => Math.round(v * 100) + "%" }) +
      `<p class="small muted" style="margin-top:8px">Warm-up (why Sara pays extra) correct: ${pct(A_.filter(a => a.warm === "risk").length, A_.filter(a => a.warm).length)} · Saw the “no price works” table: ${A_.filter(a => a.whySeen).length}</p>`));
    // Part 2
    const tRows = ORDER.map(id => { const ans = A_.filter(a => a.tailbuy && a.tailbuy.done); const ok = ans.filter(a => a.tailbuy.c && a.tailbuy.c[id] === (PEOPLE[id].wtp >= TAILORED(id) ? "buy" : "no")).length; return [`${PEOPLE[id].name} at ${money(TAILORED(id))}`, ans.length ? ok / ans.length : 0]; });
    out.push(card("Part 2 · Personal prices", bars(tRows, { max: 1, fmt: v => Math.round(v * 100) + "%" }) +
      `<p class="small muted" style="margin-top:8px">Set all three personal prices near break-even: ${pct(A_.filter(a => a.tailGuess && ORDER.every(id => Math.abs(a.tailGuess[id] - PEOPLE[id].cost) <= 1000)).length, A_.filter(a => a.tailGuess).length)}</p>` + `<h3 style="margin-top:14px">Which market is better for society?</h3>` + bars(countBy(A_, a => a.compare, [{ v: "single", l: "One price for all" }, { v: "tailored", l: "Personal prices" }, { v: "neither", l: "Neither: policy fix" }])) +
      `<p class="small muted" style="margin-top:8px">Sara's renewal price answered $75,000: ${pct(A_.filter(a => a.reclass === "jump").length, A_.filter(a => a.reclass).length)}</p>`));
    // Part 3
    out.push(card("Part 3 · What did the family do?", bars(countBy(A_, a => a.coop, COOP_OPTS))));
    // Part 4
    out.push(card("Part 4 · Would share for 35% off", bars(SHARE.map(x => [x.t, A_.filter(a => a.shareDone && a.share && a.share[x.id]).length]), { max: Math.max(1, A_.filter(a => a.shareDone).length) }) + `<p class="small muted" style="margin-top:8px">${A_.filter(a => a.shareDone).length} responses</p>`));
    const ranked = A_.filter(a => a.rankDone && Array.isArray(a.rank));
    const avgRank = RANK_ITEMS.map(it => [it.t, ranked.length ? ranked.reduce((s, a) => s + a.rank.indexOf(it.id) + 1, 0) / ranked.length : 0, ACA[it.id][0] === "y" ? "" : "r"]).sort((x, y) => x[1] - y[1]);
    out.push(card("Part 4 · Average rank (1 = most acceptable)", bars(avgRank, { max: RANK_ITEMS.length, fmt: v => v ? v.toFixed(1) : "–" }) + `<p class="small muted" style="margin-top:8px">${ranked.length} rankings · teal = allowed in ACA plans, red = banned</p>`));
    // Part 5
    const keys = FACTORS.map(f => ({ id: f.id, t: f.t }));
    const stats = keys.map(k => { const r = A_.map(a => a.rate && a.rate[k.id]).filter(x => x && x.f != null && x.c != null);
      return { t: k.t, n: r.length, f: r.length ? r.reduce((s, x) => s + x.f, 0) / r.length : 0, c: r.length ? r.reduce((s, x) => s + x.c, 0) / r.length : 0 }; });
    out.push(card("Part 5 · Fairness vs. control (class average)", scatterSVG(stats.filter(s => s.n)) + `<p class="small muted">Fair = +1, Unsure = 0, Unfair = −1. Control: None = 0, Some = 1, A lot = 2.</p>
      <div class="tw"><table class="cmp"><tr><th>Factor</th><th>Fairness</th><th>Control</th></tr>${stats.filter(s => s.n).sort((a, b) => b.f - a.f).map(s => `<tr><td>${esc(s.t)}</td><td class="num ${s.f > 0.2 ? "pos" : s.f < -0.2 ? "neg" : ""}">${s.f > 0 ? "+" : ""}${s.f.toFixed(2)}</td><td class="num">${s.c.toFixed(2)}</td></tr>`).join("")}</table></div>`));
    out.push(card("Part 5 · Principles chosen", bars(PRINCIPLES.map(p => [p.t.split(":")[0], A_.filter(a => a.principles && a.principles[p.id]).length]))));
    const clRows = CLASSIFY.map(x => { const ans = A_.filter(a => a.cl && a.cl[x.id]); return `<tr><td>${x.t}</td>${CL_OPTS.map(o => `<td class="num">${ans.filter(a => a.cl[x.id] === o.v).length}</td>`).join("")}</tr>`; }).join("");
    out.push(card("Part 5 · Adverse selection or moral hazard?", `<div class="tw"><table class="cmp"><tr><th></th><th>AS</th><th>MH</th><th>Both</th></tr>${clRows}</table></div>`));
    const cust = []; P.forEach(p => { const a = p.a || {}; ["c1", "c2"].forEach(k => { if (a.custom && a.custom[k] && a.custom[k].trim()) { const r = a.rate && a.rate[k]; cust.push(`<div><b>${esc(p.name)}</b>${esc(a.custom[k])}${r && r.f != null ? ` <span class="tag ${r.f === 1 ? "y" : r.f === -1 ? "n" : ""}">${r.f === 1 ? "fair" : r.f === -1 ? "unfair" : "unsure"}</span>` : ""}</div>`); } }); });
    out.push(card("Part 5 · Students' fill-in-the-blank factors", cust.length ? `<div class="texts">${cust.join("")}</div>` : `<p class="muted small">None yet.</p>`));
    const pats = P.filter(p => p.a && p.a.pattern && p.a.pattern.trim()).map(p => `<div><b>${esc(p.name)}</b>${esc(p.a.pattern)}</div>`);
    out.push(card("Part 5 · What the fair ones have in common", pats.length ? `<div class="texts">${pats.join("")}</div>` : `<p class="muted small">None yet.</p>`));
    // Part 6
    out.push(card("Part 6 · Which danger worries you more?", bars(countBy(A_, a => a.danger, [{ v: "little", l: "Too little information" }, { v: "much", l: "Too much information" }]))));
    const rules = P.filter(p => p.a && p.a.rule && p.a.rule.trim()).map(p => `<div><b>${esc(p.name)}</b>…only if ${esc(p.a.rule)}</div>`);
    out.push(card("Part 6 · Students' rules", rules.length ? `<div class="texts">${rules.join("")}</div>` : `<p class="muted small">None yet.</p>`));
    res.innerHTML = out.join("");
  }
}

function scatterSVG(pts) {
  const W = 420, H = 300, L = 46, R = 14, T = 14, B = 40;
  const x = c => L + (W - L - R) * c / 2, y = f => T + (H - T - B) * (1 - (f + 1) / 2);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Average fairness versus control for each factor">`;
  [-1, 0, 1].forEach(f => g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(f)}" y2="${y(f)}"/><text x="${L - 6}" y="${y(f) + 4}" font-size="11" text-anchor="end">${f === 1 ? "Fair" : f === 0 ? "Unsure" : "Unfair"}</text>`);
  [0, 1, 2].forEach(c => g += `<line class="grid" y1="${T}" y2="${H - B}" x1="${x(c)}" x2="${x(c)}"/><text x="${x(c)}" y="${H - B + 16}" font-size="11" text-anchor="middle">${["No control", "Some", "A lot"][c]}</text>`);
  g += `<text x="${(L + W - R) / 2}" y="${H - 4}" font-size="11" text-anchor="middle">How much control the person has →</text>`;
  // group points that land close together so their labels stack instead of overprinting
  const groups = [];
  pts.forEach(p => { const px = x(p.c), py = y(p.f); const gp = groups.find(q => Math.abs(q.px - px) < 30 && Math.abs(q.py - py) < 14);
    if (gp) gp.items.push(p); else groups.push({ px, py, items: [p] }); });
  groups.forEach(gp => {
    const anchor = gp.px > W * 0.62 ? "end" : "start", dx = anchor === "end" ? -8 : 8, lh = 12;
    const y0 = Math.max(T + 9, Math.min(H - B - 4 - lh * (gp.items.length - 1), gp.py + 4 - lh * (gp.items.length - 1) / 2));
    gp.items.forEach(p => g += `<circle class="dot" cx="${x(p.c)}" cy="${y(p.f)}" r="4.5"/>`);
    gp.items.forEach((p, i) => g += `<text x="${gp.px + dx}" y="${y0 + i * lh}" font-size="10.5" text-anchor="${anchor}">${esc(p.t)}</text>`);
  });
  return g + `</svg>`;
}

const COOP_SVG = `<svg class="coop" viewBox="0 0 360 200" role="img" aria-label="A small wooden chicken coop in winter with a hen at the door">
  <rect class="ground" x="0" y="172" width="360" height="28"/>

  <rect class="wall" x="90" y="80" width="180" height="92"/>
  <polygon class="roof" points="76,84 180,30 284,84"/>
  <rect class="wall" x="120" y="102" width="34" height="26"/>

  <polygon class="ramp" points="200,172 234,172 262,190 172,190"/>

</svg>`;

/* ---------------- boot ---------------- */
(function boot() {
  const qp = new URLSearchParams(location.search);
  if (qp.has("host") && CLASS_OK) hostScreen(); else joinScreen();
})();
